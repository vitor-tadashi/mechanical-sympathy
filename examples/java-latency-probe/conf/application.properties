# Thread pinning. true on a tuned bare-metal host (Guides 01-03 applied), false elsewhere.
# The launcher also reads this switch to decide whether to add the large page flags.
affinity.enable=true

# Thread role -> isolated CPU (reference layout: odd CPUs on NUMA node 1 are isolated)
ping.cpu.affinity=9
pong.cpu.affinity=11

# spin on isolated CPUs; backoff on shared CPUs / VMs (default: spin if affinity.enable)
idle.strategy=spin

probe.warmup=1000000
probe.iterations=10000000
# Size of the random-walk table. Must fit in the heap (and in the huge page pool).
probe.working.set.mib=1024
probe.hops=4
