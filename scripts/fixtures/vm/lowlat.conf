# shellcheck shell=bash disable=SC2034
#
# lowlat.conf for the VMs of tools/check-vm: 4 vCPUs on 2 NUMA nodes (CPUs 0-1 on node 0,
# 2-3 on node 1), 4 GiB, and two virtio-net NICs. tools/check-vm-guest replaces
# @critical@ and @mgmt@ with the names that the guest gave the NICs. Only the values that
# differ from scripts/lowlat.conf.example are explained here.

# -----------------------------------------------------------------------------
# CPU layout (Guides 01, 02, 05)
# -----------------------------------------------------------------------------

# Not sure which CPUs to pick? scripts/plan-layout proposes the CPU lists below from
# your topology (Guide 02 §3).
#
# CPUs dedicated to latency-critical application threads. They are removed from
# the scheduler (isolcpus), run tickless (nohz_full) and have their RCU callbacks
# offloaded (rcu_nocbs). Node 1 minus CPU 1, which stays as node-1 housekeeping.
ISOLATED_CPUS=(2 3)

# Every CPU that is NOT isolated. systemd (PID 1) and therefore every service it
# starts inherits this affinity. It must be the exact complement of ISOLATED_CPUS.
OS_CPUS=(0 1)

# CPUs allowed to run unbound kernel workqueues (writeback, deferred work).
WORKQUEUE_CPUS=(0)

# CPUs where noisy third-party agents (EDR, security scanners, monitoring) are
# pinned so they never share a core with IRQ handling or the application.
HOUSEKEEPING_PIN_CPUS=(1)
HOUSEKEEPING_PIN_PROCESSES=(edr-agentd av-scand)

# -----------------------------------------------------------------------------
# Firmware (Guide 00)
# -----------------------------------------------------------------------------

# PCIe Active State Power Management policy written at boot: performance keeps links
# out of low-power states (no L0s/L1 exit latency on the NIC's link). "" = leave alone.
BIOS_PCIE_ASPM_POLICY=performance

# -----------------------------------------------------------------------------
# GRUB options (Guide 01)
# -----------------------------------------------------------------------------

# yes: disable CPU vulnerability mitigations (nospectre_v1/v2, pti=off, mds=off,
# tsx_async_abort=off). Only on single-tenant hosts in a trusted network.
GRUB_DISABLE_MITIGATIONS=yes

# yes: intel_iommu=off iommu=off. Must be "no" if you use VFIO/SR-IOV/DPDK with IOMMU.
# Ignored when KERNEL_BYPASS_STACK=dpdk with vfio-pci: 01 sets intel_iommu=on iommu=pt instead.
GRUB_DISABLE_IOMMU=yes

# 0 / 1 / empty. biosdevname=0 CHANGES INTERFACE NAMES (em1 -> eno1 ...).
# Leave empty to keep whatever naming the host already uses.
GRUB_BIOSDEVNAME=""

# Page size reserved for huge pages: 2M or 1G.
HUGEPAGE_SIZE=2M

# -----------------------------------------------------------------------------
# Real-time and limits (Guides 02, 07)
# -----------------------------------------------------------------------------

APP_USER=app-user
APP_GROUP=app-user
REAL_TIME_PRIORITY=99
NICE_LIMIT=40          # rlimit 40 == nice -20
NPROC_LIMIT=65535
NOFILE_LIMIT=65535

# -----------------------------------------------------------------------------
# Huge pages (Guide 03)
# -----------------------------------------------------------------------------

# Pages reserved per NUMA node at early boot, as "node:count".
# 128 x 2 MiB = 256 MiB on each of the two 2 GiB nodes: small enough to leave the guest
# room, and on both nodes, so that the per-node reservation is what the check proves.
HUGEPAGES_PER_NODE=("node0:128" "node1:128")

# Extra "surplus" pages the kernel may allocate on demand when the pool is empty.
HUGEPAGES_OVERCOMMIT=2048

# Max number of System V shared-memory segments (some IPC libraries use SysV shm).
SHMMNI=24576

# -----------------------------------------------------------------------------
# Network interfaces (Guide 04)
# -----------------------------------------------------------------------------

# One entry per interface: "name|role|irq_cpus|txqueuelen"
#   role       critical  - client requests / event streams / critical backend (lowest latency)
#              timing    - PTP / time synchronization (latency-sensitive, low volume)
#              bulk      - replication, logging, reporting (throughput, not latency)
#              mgmt      - SSH, monitoring, configuration management (never touched)
#   irq_cpus   CPU list for the NIC's interrupts: OS CPUs only, never an ISOLATED
#              CPU (Guide 04 §6.1)
#   txqueuelen 0 = keep the driver default
NICS=(
	"@critical@|critical|1|0"
	"@mgmt@|mgmt||0"
)

# Kernel driver of NICs driven by a socket-acceleration bypass stack (as shown by
# `ethtool -i <iface>`), and the launcher that proves the stack is installed.
# Onload on Solarflare/AMD NICs: KERNEL_BYPASS_DRIVER=sfc KERNEL_BYPASS_COMMAND=onload.
# When both are set and the command exists, 04-network gives those NICs ONE combined
# queue: the bypass stack has its own hardware queues for the accelerated traffic, and
# the kernel queue only carries what is not accelerated (ARP, ICMP, other sockets).
KERNEL_BYPASS_DRIVER=""
KERNEL_BYPASS_COMMAND=""

# -----------------------------------------------------------------------------
# Kernel bypass (Guide 08)
# -----------------------------------------------------------------------------

# "" (none) | onload | dpdk. Selects what 08-kernel-bypass configures.
KERNEL_BYPASS_STACK=""

# Housekeeping CPU used to reload bypass drivers, so the kernel threads they create
# start there (node-local to the NIC, never an ISOLATED CPU).
BYPASS_HOUSEKEEPING_CPU=1

# onload: options for the sfc driver, written to /etc/modprobe.d/lowlat-sfc.conf.
# rss_cpus=1 keeps the kernel's own RSS on one queue, as `ethtool -L combined 1` does,
# but from the moment the driver loads.
ONLOAD_SFC_MODULE_OPTIONS="rss_cpus=1"

# dpdk: PCI addresses (ethtool -i <iface> | grep bus-info) of the ports handed to DPDK.
# They are unbound from their kernel driver and disappear from `ip link`: remove them
# from NICS above. vfio-pci needs the IOMMU (GRUB_DISABLE_IOMMU=no, Guide 08 §4).
DPDK_PORTS=()
DPDK_DRIVER=vfio-pci

# rx-usecs/tx-usecs for bulk NICs. 0 = interrupt per packet (the reference default).
# Raise (e.g. 50-100) on busy bulk links to trade latency for fewer interrupts.
NIC_BULK_COALESCE_USECS=0

# yes: also disable RX/TX checksum offload (moves checksum work to the CPU). See Guide 04.
NIC_DISABLE_CSUM_OFFLOAD=no

# -----------------------------------------------------------------------------
# cgroups (Guide 05)
# -----------------------------------------------------------------------------

# CPUs for the housekeeping slice (agents, log shippers, monitoring).
HOUSEKEEPING_SLICE_CPUS=(1)
HOUSEKEEPING_SLICE_MEMORY_MAX=4G
HOUSEKEEPING_SLICE_CPU_QUOTA=150%
HOUSEKEEPING_SLICE_IO_WEIGHT=50
HOUSEKEEPING_SLICE_UNITS=(node_exporter.service fluent-bit.service)

# -----------------------------------------------------------------------------
# OS hygiene (Guide 07)
# -----------------------------------------------------------------------------

DISABLE_SERVICES=(
	crond
	plymouth-quit-wait plymouth-quit plymouth-read-write plymouth-start
	auth-rpcgss-module rpcbind.service rpcbind.socket rpcbind.target rpc_pipefs.target rpc-statd-notify
	nfs-client.target remote-fs-pre.target
	sysstat-collect.timer sysstat-summary.timer
	pcscd
	cpupower cpuspeed cpufreqd powerd
)

# Opt-in, security-sensitive. Read Guide 07 before setting any of these to yes.
DISABLE_FIREWALLD=no
FLUSH_FIREWALL_RULES=no
REMOVE_NETFILTER_MODULES=no

TUNED_BASE_PROFILE=network-latency

# -----------------------------------------------------------------------------
# Measurement (Guide 09)
# -----------------------------------------------------------------------------

# Packages 09-measure-latency installs when missing. rt-tests (cyclictest) may need
# the Real Time or EPEL repository; perf and kernel-tools (turbostat) are in BaseOS/AppStream.
MEASURE_PACKAGES=(rtla rt-tests sysstat perf kernel-tools numactl)

# CPUs measured by 09-measure-latency --run. Empty = ISOLATED_CPUS.
# rtla osnoise runs a workload on each of them: never measure CPUs the application is using.
MEASURE_CPUS=()

# Seconds of OS-noise measurement per bundle.
MEASURE_DURATION=60

# -----------------------------------------------------------------------------
# Time synchronization (Guide 10)
# -----------------------------------------------------------------------------

# chrony | ptp | "" (leave alone).
#   chrony  chronyd (NTP, optionally with hardware timestamping), pinned to TIME_SYNC_CPUS
#   ptp     ptp4l on PTP_INTERFACE + phc2sys (needs hardware timestamping), chronyd stopped
TIME_SYNC_MODE=chrony

# NIC for ptp4l. Empty = the first NICS entry with role "timing".
PTP_INTERFACE=""

# CPUs for chronyd / ptp4l / phc2sys: a housekeeping CPU, never an isolated one.
# The reference host serves the timing NIC's interrupts on CPU 0.
TIME_SYNC_CPUS=(0)

# -----------------------------------------------------------------------------
# Day-2 operations (Guide 11)
# -----------------------------------------------------------------------------

# yes | no. Install lowlat-verify.timer, which runs verify-tuning on a schedule and
# 10 minutes after every boot, on the OS CPUs. A FAIL makes the unit fail.
DAY2_VERIFY_TIMER=yes

# systemd OnCalendar expression for the scheduled run.
DAY2_VERIFY_SCHEDULE=daily
