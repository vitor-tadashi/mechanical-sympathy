<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
<title id="t">Mechanical Sympathy: low-latency tuning for RHEL</title>
<desc id="d">Repository card. The title Mechanical Sympathy, the line low-latency tuning for RHEL, a summary of thirteen guides, thirteen scripts, nineteen use cases and a CPU layout explorer, and a small map of a two-node host with isolated CPUs on the node that holds the critical network cards.</desc>
<style>
  .bg { fill: #0d1117; }
  .t1 { font: 700 76px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
  .t2 { font: 400 38px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c9d1d9; }
  .t3 { font: 400 26px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9da7b3; }
  .q { font: italic 24px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9da7b3; }
  .lab { font: 600 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c9d1d9; }
  .num { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14202b; text-anchor: middle; }
  .hk { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 2; }
  .os { fill: #e8f1ff; stroke: #1f4e8c; stroke-width: 2; stroke-dasharray: 3 3; }
  .ag { fill: #eeeeee; stroke: #777777; stroke-width: 2; }
  .iso { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 2; }
  .nic { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .rule { stroke: #30363d; stroke-width: 2; }
</style>
<rect class="bg" x="0" y="0" width="1280" height="640"/>
<text class="t1" x="72" y="230">Mechanical</text>
<text class="t1" x="72" y="314">Sympathy</text>
<text class="t2" x="72" y="384">Low-latency tuning for RHEL</text>
<line class="rule" x1="72" y1="420" x2="560" y2="420"/>
<text class="t3" x="72" y="466">13 guides · 13 scripts · 19 use cases</text>
<text class="t3" x="72" y="504">and a CPU layout explorer</text>
<text class="q" x="72" y="580">The tail is the sum of rare events.</text>

