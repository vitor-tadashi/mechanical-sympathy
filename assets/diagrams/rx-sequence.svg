<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d">
<title id="t">The receive path, step by step, from the NIC to the application thread</title>
<desc id="d">The NIC checks and filters the frame, picks a queue with RSS, DMAs it into the RX ring and may wait for the coalescing timer before it interrupts the housekeeping CPU. That CPU runs NAPI, GRO and the protocol stack in softirq and queues the data on the socket, where the application thread on its isolated CPU picks it up. NAPI re-enables the queue interrupt once the ring is drained.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .life { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .k1 { transform: translate(84px, 370px); animation: k1 10s linear infinite; }
  @keyframes k1 { 0% { transform: translate(84px, 78px); } 6% { transform: translate(84px, 78px); } 7.42% { transform: translate(114px, 78px); } 8.18% { transform: translate(114px, 94px); } 9.51% { transform: translate(86px, 94px); } 12.31% { transform: translate(86px, 94px); } 12.51% { transform: translate(84px, 118px); } 13.93% { transform: translate(114px, 118px); } 14.69% { transform: translate(114px, 134px); } 16.01% { transform: translate(86px, 134px); } 18.81% { transform: translate(86px, 134px); } 19.01% { transform: translate(84px, 194px); } 28.11% { transform: translate(276px, 194px); } 30.91% { transform: translate(276px, 194px); } 31.11% { transform: translate(284px, 222px); } 32.53% { transform: translate(314px, 222px); } 33.29% { transform: translate(314px, 238px); } 34.61% { transform: translate(286px, 238px); } 37.41% { transform: translate(286px, 238px); } 37.61% { transform: translate(284px, 268px); } 46.71% { transform: translate(476px, 268px); } 49.51% { transform: translate(476px, 268px); } 49.71% { transform: translate(484px, 302px); } 58.81% { transform: translate(676px, 302px); } 61.61% { transform: translate(676px, 302px); } 61.81% { transform: translate(676px, 336px); } 70.9% { transform: translate(484px, 336px); } 73.7% { transform: translate(484px, 336px); } 73.9% { transform: translate(276px, 370px); } 83% { transform: translate(84px, 370px); } 85.8% { transform: translate(84px, 370px); } 100% { transform: translate(84px, 370px); } }
