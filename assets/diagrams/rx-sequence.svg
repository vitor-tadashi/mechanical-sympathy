<path class="wire" d="M84,78 L114,78 L114,94 L86,94" marker-end="url(#a)"/>
<path class="wire" d="M84,118 L114,118 L114,134 L86,134" marker-end="url(#a)"/>
<rect class="wait" x="10" y="151" width="277.68" height="22" rx="4"/>
<text class="sm" x="148.84" y="166" text-anchor="middle">coalescing: wait rx-usecs or rx-frames</text>
<path class="wire" d="M84,194 L276,194" marker-end="url(#a)"/>
<path class="wire" d="M284,222 L314,222 L314,238 L286,238" marker-end="url(#a)"/>
<path class="wire" d="M284,268 L476,268" marker-end="url(#a)"/>
<path class="wire" d="M484,302 L676,302" marker-end="url(#a)"/>
<path class="wire" d="M676,336 L484,336" marker-end="url(#a)"/>
<path class="wire" d="M276,370 L84,370" marker-end="url(#a)"/>
<rect class="step" x="57" y="14" width="46" height="29" rx="5"/><text class="lbl" x="80" y="33" text-anchor="middle">NIC</text>
<rect class="box" x="224.5" y="14" width="111" height="44" rx="5"/><text class="lbl" x="280" y="33" text-anchor="middle">IRQ CPU</text><text class="lbl" x="280" y="48" text-anchor="middle">(housekeeping)</text>
<rect class="step" x="448" y="14" width="64" height="29" rx="5"/><text class="lbl" x="480" y="33" text-anchor="middle">Socket</text>
<rect class="app" x="626.5" y="14" width="107" height="44" rx="5"/><text class="lbl" x="680" y="33" text-anchor="middle">App thread</text><text class="lbl" x="680" y="48" text-anchor="middle">(isolated CPU)</text>
<text class="el" x="122" y="90" text-anchor="start">FCS check, MAC/VLAN filter, RSS picks a queue</text>
<text class="el" x="122" y="130" text-anchor="start">DMA into the RX ring</text>
<text class="el" x="180" y="188" text-anchor="middle">MSI-X interrupt (hard IRQ)</text>
<text class="el" x="322" y="234" text-anchor="start">softirq: NAPI poll, GRO, netfilter, IP, UDP/TCP</text>
<text class="el" x="380" y="262" text-anchor="middle">enqueue on the socket</text>
<text class="el" x="580" y="296" text-anchor="middle">wake a blocked reader (IPI), or a spinning reader sees data</text>
<text class="el" x="580" y="330" text-anchor="middle">recv() copies the data to user space</text>
<text class="el" x="180" y="364" text-anchor="middle">NAPI re-enables the queue interrupt once the ring is drained</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
