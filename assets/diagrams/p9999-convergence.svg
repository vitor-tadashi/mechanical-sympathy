<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">A p99.99 estimate jumps around until about a million samples</title>
<desc id="d">Three runs of the same benchmark read their p99.99 estimate as samples accumulate, on log scales. With ten thousand samples the percentile is a single sample and the runs disagree by a factor of three. From about a million samples, a hundred samples beyond the percentile, the runs agree within about ten percent, and at ten million within about three percent. The numbers are illustrative.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .plot { fill: #ffffff; stroke: #d0d7de; }
  .grid { stroke: #d0d7de; stroke-dasharray: 3 3; }
  .truth { stroke: #1d6b33; stroke-width: 2; stroke-dasharray: 6 4; }
  .run { fill: none; stroke-width: 2.2; }
  .r0 { stroke: #1f4e8c; } .r1 { stroke: #9b1c1c; } .r2 { stroke: #8a5a00; }
  .band { fill: #c8f0d0; opacity: 0.6; }
  .ax { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .axr { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .mk { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .pin { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pop 8s linear infinite; }
  @keyframes pop { 0%, 4% { transform: scale(1.6); } 9%, 100% { transform: scale(1); } }
  .head { transform: translateX(570px); animation: sweep 8s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pin, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="370" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="350" rx="6"/>
<text class="cap" x="24" y="34">Three runs of the same benchmark, p99.99 read after every few samples</text>
<text class="sub" x="24" y="52">Before about a million samples the estimate jumps by a factor of 3 between runs. After, the runs agree.</text>
