<rect class="band" x="577.5" y="100" width="142.5" height="220"/>
<line class="grid" x1="150.0" y1="100" x2="150.0" y2="320"/><text class="ax" x="150.0" y="336">1,000</text>
<line class="grid" x1="292.5" y1="100" x2="292.5" y2="320"/><text class="ax" x="292.5" y="336">10,000</text>
<line class="grid" x1="435.0" y1="100" x2="435.0" y2="320"/><text class="ax" x="435.0" y="336">100,000</text>
<line class="grid" x1="577.5" y1="100" x2="577.5" y2="320"/><text class="ax" x="577.5" y="336">1 million</text>
<line class="grid" x1="720.0" y1="100" x2="720.0" y2="320"/><text class="ax" x="720.0" y="336">10 million</text>
<text class="axr" x="144" y="324.0">10 µs</text>
<text class="axr" x="144" y="214.0">100 µs</text>
<text class="axr" x="144" y="104.0">1 ms</text>
<line class="truth" x1="150" y1="210.0" x2="720" y2="210.0"/>
