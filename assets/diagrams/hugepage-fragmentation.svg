<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">Reserve huge pages at early boot, before memory fragments</title>
<desc id="d">Two attempts to reserve twelve 2 MiB huge pages on NUMA node 1, with illustrative numbers. At early boot, most memory is still free in large blocks and the service gets all twelve. One hour later, small 4 KiB pages used by the page cache, the kernel and other processes sit in most 2 MiB blocks, so the same request as a runtime sysctl finds only five empty blocks, and the JVM falls back to small pages.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .free { fill: #ffffff; stroke: #c4ccd4; stroke-width: 1; }
  .pg { fill: #57606a; }
  .cnt { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .good { fill: #1d6b33; }
  .bad { fill: #9b1c1c; }
  .pk { transform-box: fill-box; transform-origin: center; animation: pop 8s linear infinite; }
  @keyframes pop { 0%, 3% { transform: scale(1.25); } 7%, 100% { transform: scale(1); } }
  .head { transform: translateX(570px); animation: sweep 8s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pk, .head { animation: none; }
    .head { display: none; }
  }
</style>
