<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Every drop counter sits on the stage that increments it</title>
<desc id="d">Five columns for the stages of the receive path. Hardware and ring drops show in ethtool -S. Softirq budget overruns and backlog drops show in softnet_stat. Socket drops show in nstat and in the d field of ss -m. The application has no kernel counter. The earliest stage that counts drops is the one to fix first.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .dash { fill: #ffffff; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .sm { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .smb { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .tiny { font: 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .mono { font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
  .monob { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .redt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .grnt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d6b33; }
  .tick { stroke: #8c959f; stroke-width: 1; }
  .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .arrowr { stroke: #9b1c1c; stroke-width: 1.5; fill: none; marker-end: url(#ahr); }
</style>
<rect class="bg" x="0" y="0" width="760" height="400" rx="8"/>
<text class="cap" x="24" y="28">Where did the packet die? Read the counter of that stage</text>
<text class="sub" x="24" y="46">Counters only grow. Read twice and subtract, or use nstat, which prints the change since its last run.</text>
<rect class="foc" x="15" y="62" width="140" height="40" rx="5"/>
<text class="lbl" x="85" y="87" text-anchor="middle">NIC and RX ring</text>
<rect class="lane" x="15" y="112" width="140" height="220" rx="6"/>
<text class="monob" x="23" y="132">ethtool -S IF</text>
<text class="mono" x="27" y="147">rx_missed_errors</text>
<text class="mono" x="27" y="161">rx_no_buffer_count</text>
<text class="mono" x="27" y="175">rx_fifo_errors</text>
<text class="monob" x="23" y="199">ip -s link</text>
<text class="mono" x="27" y="214">RX dropped column</text>
<text class="tiny" x="23" y="284">Names differ by driver.</text>
<text class="tiny" x="23" y="296">Any one of them growing</text>
<text class="tiny" x="23" y="308">means the NIC had no</text>
<text class="tiny" x="23" y="320">free descriptor.</text>
<path class="arrow" d="M156 82 L164 82"/>
<rect class="box" x="165" y="62" width="140" height="40" rx="5"/>
<text class="lbl" x="235" y="87" text-anchor="middle">NAPI softirq</text>
<rect class="lane" x="165" y="112" width="140" height="220" rx="6"/>
<text class="monob" x="173" y="132">softnet_stat</text>
<text class="mono" x="177" y="147">column 3:</text>
<text class="mono" x="177" y="161">time_squeeze</text>
<text class="tiny" x="173" y="284">Not a drop. The poll ran</text>
<text class="tiny" x="173" y="296">out of budget, so</text>
<text class="tiny" x="173" y="308">packets wait longer in</text>
<text class="tiny" x="173" y="320">the ring.</text>
<path class="arrow" d="M306 82 L314 82"/>
<rect class="dash" x="315" y="62" width="140" height="40" rx="5"/>
<text class="lbl" x="385" y="87" text-anchor="middle">Backlog (RPS only)</text>
<rect class="lane" x="315" y="112" width="140" height="220" rx="6"/>
<text class="monob" x="323" y="132">softnet_stat</text>
<text class="mono" x="327" y="147">column 2:</text>
<text class="mono" x="327" y="161">dropped</text>
<text class="tiny" x="323" y="296">Stays 0 unless RPS, RFS,</text>
<text class="tiny" x="323" y="308">loopback or veth put a</text>
<text class="tiny" x="323" y="320">backlog in the path.</text>
<path class="arrow" d="M456 82 L464 82"/>
<rect class="foc" x="465" y="62" width="140" height="40" rx="5"/>
<text class="lbl" x="535" y="87" text-anchor="middle">Socket</text>
<rect class="lane" x="465" y="112" width="140" height="220" rx="6"/>
<text class="monob" x="473" y="132">nstat -az</text>
<text class="mono" x="477" y="147">UdpRcvbufErrors</text>
<text class="mono" x="477" y="161">TCPRcvQDrop</text>
<text class="mono" x="477" y="175">TCPBacklogDrop</text>
<text class="mono" x="477" y="189">ListenOverflows</text>
<text class="mono" x="477" y="203">ListenDrops</text>
<text class="monob" x="473" y="227">ss -m</text>
<text class="mono" x="477" y="242">skmem ... d = drops</text>
<text class="mono" x="477" y="256">of this one socket</text>
<text class="tiny" x="473" y="296">UDP counts the lost</text>
<text class="tiny" x="473" y="308">datagram. TCP slows the</text>
<text class="tiny" x="473" y="320">sender instead.</text>
<path class="arrow" d="M606 82 L614 82"/>
<rect class="app" x="615" y="62" width="140" height="40" rx="5"/>
<text class="lbl" x="685" y="87" text-anchor="middle">Application</text>
<rect class="lane" x="615" y="112" width="140" height="220" rx="6"/>
<text class="monob" x="623" y="132">no kernel counter</text>
<text class="mono" x="627" y="147">sequence gaps</text>
<text class="mono" x="627" y="161">own queue depth</text>
<text class="tiny" x="623" y="296">Your own queue can</text>
<text class="tiny" x="623" y="308">overflow, and only your</text>
<text class="tiny" x="623" y="320">code can count it.</text>
<rect class="mut" x="15" y="346" width="730" height="40" rx="5"/>
<text class="smb" x="27" y="364">Fix the earliest stage that counts drops.</text>
<text class="sm" x="27" y="379">Later stages only see what the earlier ones let through, so a full ring hides what the socket would have done.</text>
</svg>
