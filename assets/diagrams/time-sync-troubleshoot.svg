<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 439" width="760" height="439" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting clocks: sources for chrony, lock and one owner for PTP</title>
<desc id="d">chrony problems are usually unreachable sources or a noisy path. PTP problems are usually a profile mismatch with the switches, or two daemons fighting over the system clock.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 344px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(80px, 49px); } 6% { transform: translate(80px, 49px); } 12% { transform: translate(80px, 49px); } 14.03% { transform: translate(80px, 75px); } 20.03% { transform: translate(80px, 75px); } 35.53% { transform: translate(80px, 274px); } 44.5% { transform: translate(195px, 274px); } 50.5% { transform: translate(195px, 274px); } 56.19% { transform: translate(250px, 322px); } 62.19% { transform: translate(250px, 322px); } 74% { transform: translate(400px, 344px); } 80% { transform: translate(400px, 344px); } 100% { transform: translate(400px, 344px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 13.93% { fill: #ffffff; stroke-width: 1.5; } 16.03% { fill: #ffe9a8; stroke-width: 3; } 24.03%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 44.4% { fill: #ffffff; stroke-width: 1.5; } 46.5% { fill: #ffe9a8; stroke-width: 3; } 54.5%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 56.09% { fill: #ffffff; stroke-width: 1.5; } 58.19% { fill: #ffe9a8; stroke-width: 3; } 66.19%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 8s linear infinite; }
  @keyframes p5 { 0%, 73.9% { fill: #ffc9c9; stroke-width: 1.5; } 74%, 97% { fill: #ff9b9b; stroke-width: 3; } 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="439" rx="8"/>
<path class="walk" d="M80,49 L80,75" marker-end="url(#w)"/>
<path class="wire" d="M306.5,173 L330.5,173 L330.5,146 L400,146" marker-end="url(#a)"/>
<path class="wire" d="M306.5,173 L330.5,173 L330.5,200 L400,200" marker-end="url(#a)"/>
<path class="wire" d="M80,104 L80,173 L193.5,173" marker-end="url(#a)"/>
<path class="wire" d="M305,274 L400,274" marker-end="url(#a)"/>
<path class="walk" d="M250,296 L250,322" marker-end="url(#w)"/>
<path class="walk" d="M317,344 L400,344" marker-end="url(#w)"/>
<path class="wire" d="M250,366 L250,392" marker-end="url(#a)"/>
<path class="walk" d="M80,104 L80,274 L195,274" marker-end="url(#w)"/>
<rect class="foc" x="26" y="20" width="108" height="29" rx="14.5"/><text class="lbl" x="80" y="39" text-anchor="middle">Clock problem</text>
<polygon class="step p2" points="42.5,89.5 56.5,75 103.5,75 117.5,89.5 103.5,104 56.5,104"/><text class="lbl" x="80" y="94" text-anchor="middle">Mode?</text>
<polygon class="step" points="193.5,173 207.5,151 292.5,151 306.5,173 292.5,195 207.5,195"/><text class="lbl" x="250" y="170" text-anchor="middle">Leap status</text><text class="lbl" x="250" y="185" text-anchor="middle">Normal?</text>
<rect class="box" x="400" y="124" width="234" height="44" rx="5"/><text class="lbl" x="517" y="143" text-anchor="middle">No reachable source:</text><text class="lbl" x="517" y="158" text-anchor="middle">chronyc sources -v, firewall, DNS</text>
<rect class="box" x="400" y="178" width="265" height="44" rx="5"/><text class="lbl" x="532.5" y="197" text-anchor="middle">Offset large or jumpy: more sources,</text><text class="lbl" x="532.5" y="212" text-anchor="middle">hwtimestamp, check the network path</text>
<polygon class="step p3" points="195,274 209,252 291,252 305,274 291,296 209,296"/><text class="lbl" x="250" y="271" text-anchor="middle">ptp4l state</text><text class="lbl" x="250" y="286" text-anchor="middle">s2 (locked)?</text>
<rect class="box" x="400" y="252" width="246" height="44" rx="5"/><text class="lbl" x="523" y="271" text-anchor="middle">No master seen: domain, transport,</text><text class="lbl" x="523" y="286" text-anchor="middle">VLAN, switch PTP config</text>
<polygon class="step p4" points="183,344 197,322 303,322 317,344 303,366 197,366"/><text class="lbl" x="250" y="341" text-anchor="middle">phc2sys offset</text><text class="lbl" x="250" y="356" text-anchor="middle">small?</text>
<rect class="wait p5" x="400" y="322" width="246" height="44" rx="5"/><text class="lbl" x="523" y="341" text-anchor="middle">Another daemon steering the clock:</text><text class="lbl" x="523" y="356" text-anchor="middle">chronyd running? One owner only</text>
<rect class="mut" x="178" y="392" width="144" height="29" rx="5"/><text class="lbl" x="250" y="411" text-anchor="middle">See the table below</text>
<text class="el" x="338.5" y="141" text-anchor="start">no</text>
<text class="el" x="338.5" y="195" text-anchor="start">yes</text>
<text class="el" x="90" y="167" text-anchor="start">chrony</text>
<text class="el" x="337" y="269" text-anchor="start">no</text>
<text class="el" x="256" y="313" text-anchor="start">yes</text>
<text class="el" x="349" y="339" text-anchor="start">no</text>
<text class="el" x="256" y="383" text-anchor="start">yes</text>
<text class="el" x="90" y="268" text-anchor="start">ptp</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
