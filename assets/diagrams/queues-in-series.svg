<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
<title id="t">A message crosses several queues in series, each in front of a server</title>
<desc id="d">A message goes from the wire into the NIC ring, is served by net.rx, waits in an SPSC ring, is served by event.loop, and waits in another SPSC ring for worker.0. event.loop also feeds the logger through a logger ring. The response time is the sum of every wait plus every service time.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
