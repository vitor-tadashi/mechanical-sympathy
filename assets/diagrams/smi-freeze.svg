<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="t d">
<title id="t">An SMI freezes every CPU and only the SMI counter shows it</title>
<desc id="d">Above, four isolated CPUs each run a pinned thread and all stop in the same instant when an SMI fires. Below, what the tools report: /proc/interrupts shows nothing new, rtla osnoise shows a gap it cannot attribute, and only the turbostat SMI counter goes from N to N plus 1. That is why Guide 09 pairs osnoise with turbostat and why Guide 00 sets firmware options.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .spare { fill: #e6f7ea; stroke: #1d6b33; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .off { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .role { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .mid { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .midr { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2b0a0a; text-anchor: middle; }
  .midw { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b1f33; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }

  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }

  .pw, .pb, .pg { transform-box: fill-box; transform-origin: center; animation: 6s linear infinite; }
  .pw { animation-name: cut; }
  .pb { animation-name: take; }
  .pg { animation-name: ok; }
  @keyframes cut {
    0%, 6%   { fill: #ff6b6b; transform: scaleY(1.15); }
    7%, 100% { fill: #ffc9c9; transform: scaleY(1); }
  }
  @keyframes take {
    0%, 6%   { fill: #3d7fd9; transform: scaleY(1.15); }
    7%, 100% { fill: #1f4e8c; transform: scaleY(1); }
  }
  @keyframes ok {
    0%, 6%   { fill: #7fe39a; transform: scaleY(1.15); }
    7%, 100% { fill: #c8f0d0; transform: scaleY(1); }
  }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .head, .pw, .pb, .pg, .ctr { animation: none; }
    .head { display: none; }
  }

  .gap { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .cnt { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .ctr { transform-box: fill-box; transform-origin: center; animation: 6s linear infinite; }
</style>
<rect class="bg" x="0" y="0" width="760" height="372" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="190" rx="6"/>
<text class="cap" x="24" y="34">An SMI stops every CPU at once</text>
<text class="sub" x="24" y="52">Firmware takes over for tens to hundreds of µs. The operating system is not told.</text>
<text class="lbl" x="24" y="78">CPU 3</text>
<text class="role" x="84" y="78">net.rx</text>
<rect class="app" x="150" y="66" width="570" height="22" rx="4"/>
<rect class="wait pw" style="animation-delay:-2.84s" x="420" y="64" width="60" height="26" rx="3"/>
<text class="midr" x="450.0" y="81">SMI</text>
<text class="lbl" x="24" y="110">CPU 5</text>
<text class="role" x="84" y="110">net.tx</text>
<rect class="app" x="150" y="98" width="570" height="22" rx="4"/>
<rect class="wait pw" style="animation-delay:-2.84s" x="420" y="96" width="60" height="26" rx="3"/>
<text class="midr" x="450.0" y="113">SMI</text>
<text class="lbl" x="24" y="142">CPU 7</text>
<text class="role" x="84" y="142">event.loop</text>
<rect class="app" x="150" y="130" width="570" height="22" rx="4"/>
<rect class="wait pw" style="animation-delay:-2.84s" x="420" y="128" width="60" height="26" rx="3"/>
<text class="midr" x="450.0" y="145">SMI</text>
<text class="lbl" x="24" y="174">CPU 9</text>
<text class="role" x="84" y="174">worker.0</text>
<rect class="app" x="150" y="162" width="570" height="22" rx="4"/>
<rect class="wait pw" style="animation-delay:-2.84s" x="420" y="160" width="60" height="26" rx="3"/>
<text class="midr" x="450.0" y="177">SMI</text>
<text class="axis" x="435" y="192">all four CPUs stop in the same instant</text>
<rect class="lane" x="10" y="210" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="234">What each tool reports</text>
<text class="sub" x="24" y="252">Only one of the three notices.</text>
<text class="lbl" x="24" y="280" style="font-weight:500">/proc/interrupts</text>
<text class="lbl" x="24" y="310" style="font-weight:500">rtla osnoise</text>
<text class="lbl" x="24" y="340" style="font-weight:500">turbostat SMI count</text>
<rect class="off" x="150" y="266" width="570" height="22" rx="4"/>
<text class="mid" x="435" y="281" style="fill:#444">no new interrupts, counters unchanged</text>
<rect class="app" x="150" y="296" width="270" height="22" rx="4"/>
<rect class="gap" x="420" y="296" width="60" height="22" rx="4"/>
<text class="mid" x="450.0" y="311">?</text>
<rect class="app" x="480" y="296" width="240" height="22" rx="4"/>
<text class="cnt" x="154" y="341">N</text>
<rect class="wait pw" style="animation-delay:-2.84s" x="446.0" y="326" width="8" height="22" rx="2"/>
<text class="cnt" x="500" y="341">N + 1</text>
<text class="role" x="550" y="341">the only trace</text>
<text class="role" x="412" y="311" style="text-anchor:end">an unattributed gap</text>
<line class="head" x1="150" y1="56" x2="150" y2="352"/>
</svg>
