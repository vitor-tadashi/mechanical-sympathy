<path class="wire" d="M666,269 L636,269 L636,285 L664,285" marker-end="url(#a)"/>
<rect class="foc" x="18" y="14" width="144" height="29" rx="5"/><text class="lbl" x="90" y="33" text-anchor="middle">01-grub-bootloader</text>
<rect class="box" x="251.833" y="14" width="63" height="29" rx="5"/><text class="lbl" x="283.333" y="33" text-anchor="middle">grubby</text>
<rect class="step" x="380.667" y="14" width="192" height="29" rx="5"/><text class="lbl" x="476.667" y="33" text-anchor="middle">/boot/loader/entries/*.conf</text>
<rect class="app" x="597.5" y="14" width="145" height="29" rx="5"/><text class="lbl" x="670" y="33" text-anchor="middle">Kernel at next boot</text>
<text class="el" x="186.667" y="63" text-anchor="middle">--remove-args=isolcpus</text>
<text class="el" x="186.667" y="97" text-anchor="middle">--args=isolcpus=3,5,7,...</text>
<text class="el" x="380" y="131" text-anchor="middle">rewrite the options line of every entry</text>
<text class="el" x="132" y="177" text-anchor="start">grub2-mkconfig (grub.cfg)</text>
<text class="el" x="573.333" y="235" text-anchor="middle">GRUB passes the options line</text>
