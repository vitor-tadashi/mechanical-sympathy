  @keyframes k1 { 0% { transform: translate(94px, 69px); } 6% { transform: translate(94px, 69px); } 18.92% { transform: translate(279.333px, 69px); } 21.72% { transform: translate(279.333px, 69px); } 21.92% { transform: translate(94px, 103px); } 34.84% { transform: translate(279.333px, 103px); } 37.64% { transform: translate(279.333px, 103px); } 37.84% { transform: translate(287.333px, 137px); } 50.76% { transform: translate(472.667px, 137px); } 53.56% { transform: translate(472.667px, 137px); } 53.76% { transform: translate(94px, 165px); } 55.85% { transform: translate(124px, 165px); } 56.97% { transform: translate(124px, 181px); } 58.92% { transform: translate(96px, 181px); } 61.72% { transform: translate(96px, 181px); } 61.92% { transform: translate(480.667px, 241px); } 74.84% { transform: translate(666px, 241px); } 77.64% { transform: translate(666px, 241px); } 77.84% { transform: translate(666px, 269px); } 79.93% { transform: translate(636px, 269px); } 81.05% { transform: translate(636px, 285px); } 83% { transform: translate(664px, 285px); } 85.8% { transform: translate(664px, 285px); } 100% { transform: translate(664px, 285px); } }
