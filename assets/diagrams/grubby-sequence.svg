<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 321" width="760" height="321" role="img" aria-labelledby="t d">
<title id="t">Boot arguments travel from the script through grubby to the kernel at the next boot</title>
<desc id="d">The script removes and re-adds each argument through grubby, which rewrites the options line of every BLS entry, then regenerates grub.cfg. Nothing changes until the reboot, when GRUB passes the new line to the kernel.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
