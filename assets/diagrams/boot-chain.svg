<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 433" width="760" height="433" role="img" aria-labelledby="t d">
<title id="t">From power-on to /proc/cmdline, the command line is the options line of a BLS entry</title>
<desc id="d">Firmware starts shim and GRUB2, which reads grub.cfg, and blscfg loads a BLS entry whose options line is the command line. The kernel parses the early parameters first, then the rest, passes unknown name=value pairs to init, runs the initramfs and switches root to systemd.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(300px, 388px); animation: k1 9s linear infinite; }
  @keyframes k1 { 0% { transform: translate(300px, 60px); } 8% { transform: translate(300px, 60px); } 13% { transform: translate(300px, 60px); } 15.36% { transform: translate(300px, 78px); } 20.36% { transform: translate(300px, 78px); } 28.49% { transform: translate(300px, 140px); } 33.49% { transform: translate(300px, 140px); } 43.58% { transform: translate(300px, 217px); } 48.58% { transform: translate(300px, 217px); } 56.71% { transform: translate(300px, 279px); } 61.71% { transform: translate(300px, 279px); } 69.84% { transform: translate(300px, 341px); } 74.84% { transform: translate(300px, 341px); } 81% { transform: translate(300px, 388px); } 86% { transform: translate(300px, 388px); } 100% { transform: translate(300px, 388px); } }
  .p2 { animation: p2 9s linear infinite; }
  @keyframes p2 { 0%, 28.39% { fill: #ffd166; stroke-width: 1.5; } 30.49% { fill: #ffb703; stroke-width: 3; } 40.49%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .p3 { animation: p3 9s linear infinite; }
  @keyframes p3 { 0%, 43.48% { fill: #cfe3ff; stroke-width: 1.5; } 45.58% { fill: #9cc3ff; stroke-width: 3; } 53.58%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .p4 { animation: p4 9s linear infinite; }
  @keyframes p4 { 0%, 80.9% { fill: #c8f0d0; stroke-width: 1.5; } 81%, 97% { fill: #8fe0a0; stroke-width: 3; } 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .c5 { animation: c5 9s linear infinite; }
  @keyframes c5 { 0%, 28.39% { opacity: 0; } 28.49%, 100% { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .c5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="433" rx="8"/>
<path class="wire" d="M300,60 L300,78" marker-end="url(#a)"/>
<path class="wire" d="M300,122 L300,140" marker-end="url(#a)"/>
<path class="wire" d="M300,199 L300,217" marker-end="url(#a)"/>
<path class="wire" d="M300,261 L300,279" marker-end="url(#a)"/>
<path class="wire" d="M300,323 L300,341" marker-end="url(#a)"/>
<path class="wire" d="M300,370 L300,388" marker-end="url(#a)"/>
<rect class="step" x="247" y="16" width="106" height="44" rx="5"/><text class="lbl" x="300" y="35" text-anchor="middle">Firmware</text><text class="lbl" x="300" y="50" text-anchor="middle">UEFI or BIOS</text>
<rect class="step" x="243" y="78" width="114" height="44" rx="5"/><text class="lbl" x="300" y="97" text-anchor="middle">shim + GRUB2</text><text class="lbl" x="300" y="112" text-anchor="middle">reads grub.cfg</text>
<rect class="foc p2" x="197" y="140" width="206" height="59" rx="2"/><line class="sl" x1="203" y1="140" x2="203" y2="199"/><line class="sl" x1="397" y1="140" x2="397" y2="199"/><text class="lbl" x="300" y="159" text-anchor="middle">blscfg loads a BLS entry</text><text class="lbl" x="300" y="174" text-anchor="middle">/boot/loader/entries/*.conf</text><text class="lbl" x="300" y="189" text-anchor="middle">options = the command line</text>
<rect class="box p3" x="179.5" y="217" width="241" height="44" rx="5"/><text class="lbl" x="300" y="236" text-anchor="middle">Kernel: early_param() handlers</text><text class="lbl" x="300" y="251" text-anchor="middle">memory, CPUs, IOMMU, mitigations</text>
<rect class="box" x="165" y="279" width="270" height="44" rx="5"/><text class="lbl" x="300" y="298" text-anchor="middle">Kernel: __setup() handlers</text><text class="lbl" x="300" y="313" text-anchor="middle">unknown name=value goes to init as env</text>
<rect class="step" x="188.5" y="341" width="223" height="29" rx="5"/><text class="lbl" x="300" y="360" text-anchor="middle">initramfs (dracut), switch_root</text>
<rect class="app p4" x="243.5" y="388" width="113" height="29" rx="14.5"/><text class="lbl" x="300" y="407" text-anchor="middle">systemd, PID 1</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
<text class="done c5" x="419" y="173.5" text-anchor="start">the command line is read here</text>
</svg>
