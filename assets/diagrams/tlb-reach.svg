<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="t d">
<title id="t">TLB reach with 4 KiB pages and with 2 MiB pages</title>
<desc id="d">A thread reads eight random locations in a 256 MiB working set. With 4 KiB pages the TLB covers only 8 MiB at the start of the set, so seven of the eight reads miss and each one triggers a page walk of up to four memory reads. With 2 MiB pages the same 2,048 TLB entries cover 4 GiB, the whole working set fits, and all eight reads hit.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .ws { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .reach { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .key { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .ptr { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .mk text { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
  .bad rect { fill: #ffc9c9; stroke: #9b1c1c; }
  .bad text { fill: #9b1c1c; }
  .okm rect { fill: #c8f0d0; stroke: #1d6b33; }
  .okm text { fill: #1d6b33; }
  .mk { transform-box: fill-box; transform-origin: center; animation: pop 8s linear infinite; }
  .p { transform: translateX(359.1px); animation: move 8s step-end infinite; }
  @keyframes move {
    0.00%, 12.49% { transform: translateX(296.4px); }
    12.50%, 24.99% { transform: translateX(490.2px); }
    25.00%, 37.49% { transform: translateX(8.6px); }
    37.50%, 49.99% { transform: translateX(250.8px); }
    50.00%, 62.49% { transform: translateX(444.6px); }
    62.50%, 74.99% { transform: translateX(131.1px); }
    75.00%, 87.49% { transform: translateX(540px); }
    87.50%, 99.99% { transform: translateX(359.1px); }
  }
  @keyframes pop {
    0%, 4%   { transform: scale(1.45); }
    9%, 100% { transform: scale(1); }
  }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .p, .mk { animation: none; }
    .p { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="310" rx="8"/>

<rect class="lane" x="10" y="10" width="740" height="140" rx="6"/>
<text class="cap" x="24" y="34">4 KiB pages: TLB reach 8 MiB (2,048 entries)</text>
<text class="sub" x="24" y="52">Random reads land outside the reach almost every time. Each miss (✕) costs a page walk: up to 4 memory reads.</text>
<text class="lbl" x="24" y="94">working set</text>
<text class="lbl" x="24" y="110">256 MiB</text>
<rect class="ws" x="150" y="78" width="570" height="36" rx="4"/>
<rect class="reach" x="150" y="78" width="17.8" height="36" rx="2"/>
<text class="lbl" x="172" y="101">← TLB reach</text>
<polygon class="ptr p" points="150,72 143,62 157,62"/>
<g class="mk bad" style="animation-delay:0s"><rect x="439.4" y="120" width="14" height="14" rx="3"/><text x="446.4" y="131">✕</text></g>
<g class="mk bad" style="animation-delay:-7s"><rect x="633.2" y="120" width="14" height="14" rx="3"/><text x="640.2" y="131">✕</text></g>
<g class="mk okm" style="animation-delay:-6s"><rect x="151.6" y="120" width="14" height="14" rx="3"/><text x="158.6" y="131">✓</text></g>
<g class="mk bad" style="animation-delay:-5s"><rect x="393.8" y="120" width="14" height="14" rx="3"/><text x="400.8" y="131">✕</text></g>
<g class="mk bad" style="animation-delay:-4s"><rect x="587.6" y="120" width="14" height="14" rx="3"/><text x="594.6" y="131">✕</text></g>
<g class="mk bad" style="animation-delay:-3s"><rect x="274.1" y="120" width="14" height="14" rx="3"/><text x="281.1" y="131">✕</text></g>
<g class="mk bad" style="animation-delay:-2s"><rect x="683.0" y="120" width="14" height="14" rx="3"/><text x="690.0" y="131">✕</text></g>
<g class="mk bad" style="animation-delay:-1s"><rect x="502.1" y="120" width="14" height="14" rx="3"/><text x="509.1" y="131">✕</text></g>
<text class="key" x="24" y="131">✓ hit  ✕ miss</text>

<rect class="lane" x="10" y="160" width="740" height="140" rx="6"/>
<text class="cap" x="24" y="184">2 MiB pages: TLB reach 4 GiB (the same 2,048 entries)</text>
<text class="sub" x="24" y="202">The whole working set fits inside the reach, so every read hits.</text>
<text class="lbl" x="24" y="244">working set</text>
<text class="lbl" x="24" y="260">256 MiB</text>
<rect class="reach" x="150" y="228" width="570" height="36" rx="4"/>
<text class="lbl" x="172" y="251">TLB reach covers all of it</text>
<polygon class="ptr p" points="150,222 143,212 157,212"/>
<g class="mk okm" style="animation-delay:0s"><rect x="439.4" y="270" width="14" height="14" rx="3"/><text x="446.4" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-7s"><rect x="633.2" y="270" width="14" height="14" rx="3"/><text x="640.2" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-6s"><rect x="151.6" y="270" width="14" height="14" rx="3"/><text x="158.6" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-5s"><rect x="393.8" y="270" width="14" height="14" rx="3"/><text x="400.8" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-4s"><rect x="587.6" y="270" width="14" height="14" rx="3"/><text x="594.6" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-3s"><rect x="274.1" y="270" width="14" height="14" rx="3"/><text x="281.1" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-2s"><rect x="683.0" y="270" width="14" height="14" rx="3"/><text x="690.0" y="281">✓</text></g>
<g class="mk okm" style="animation-delay:-1s"><rect x="502.1" y="270" width="14" height="14" rx="3"/><text x="509.1" y="281">✓</text></g>
</svg>
