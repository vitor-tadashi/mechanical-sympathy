<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
<title id="t">How far each change reaches, and how it is undone</title>
<desc id="d">Runtime-only changes, such as NIC coalescing and IRQ affinity, are undone by a reboot with lowlat-runtime disabled. Persistent changes, after which the host still boots, are undone by --rollback and a reboot. Only the kernel command line, on the boot path, can need the out-of-band console and GRUB before --rollback.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(133px, 154px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(133px, 87px); } 6% { transform: translate(133px, 87px); } 26.97% { transform: translate(133px, 154px); } 100% { transform: translate(133px, 154px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 26.87% { fill: #ffffff; stroke-width: 1.5; } 28.97% { fill: #ffe9a8; stroke-width: 3; } 36.97%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .k3 { transform: translate(380px, 154px); animation: k3 8s linear infinite; }
  @keyframes k3 { 0% { transform: translate(380px, 87px); } 30.67% { transform: translate(380px, 87px); } 51.63% { transform: translate(380px, 154px); } 100% { transform: translate(380px, 154px); } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 51.53% { fill: #ffffff; stroke-width: 1.5; } 53.63% { fill: #ffe9a8; stroke-width: 3; } 61.63%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .k5 { transform: translate(627px, 154px); animation: k5 8s linear infinite; }
  @keyframes k5 { 0% { transform: translate(627px, 87px); } 55.33% { transform: translate(627px, 87px); } 76.3% { transform: translate(627px, 154px); } 100% { transform: translate(627px, 154px); } }
  .p6 { animation: p6 8s linear infinite; }
  @keyframes p6 { 0%, 76.2% { fill: #ffffff; stroke-width: 1.5; } 78.3% { fill: #ffe9a8; stroke-width: 3; } 86.3%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="230" rx="8"/>
<path class="wire" d="M133,87 L133,154" marker-end="url(#a)"/>
<path class="wire" d="M380,87 L380,154" marker-end="url(#a)"/>
<path class="wire" d="M627,87 L627,154" marker-end="url(#a)"/>
<rect class="app" x="17" y="25" width="232" height="62" rx="5"/><text class="sm" x="133" y="46.5" text-anchor="middle">Runtime only</text><text class="sm" x="133" y="60.5" text-anchor="middle">NIC coalescing, offloads, IRQ affinity</text><text class="sm" x="133" y="74.5" text-anchor="middle">workqueue cpumask</text>
<rect class="step p2" x="28" y="154" width="210" height="44" rx="22"/><text class="lbl" x="133" y="173" text-anchor="middle">reboot with</text><text class="lbl" x="133" y="188" text-anchor="middle">lowlat-runtime disabled</text>
<rect class="box" x="264" y="25" width="232" height="62" rx="5"/><text class="lbl" x="380" y="45.5" text-anchor="middle">Persistent, the host still boots</text><text class="lbl" x="380" y="60.5" text-anchor="middle">sysctl.d, systemd units and limits</text><text class="lbl" x="380" y="75.5" text-anchor="middle">huge page reservation, services</text>
<rect class="step p4" x="275" y="154" width="210" height="44" rx="22"/><text class="lbl" x="380" y="180.5" text-anchor="middle">--rollback, then reboot</text>
<rect class="wait" x="511" y="25" width="232" height="62" rx="5"/><text class="lbl" x="627" y="53" text-anchor="middle">Boot path</text><text class="lbl" x="627" y="68" text-anchor="middle">kernel command line (Guide 01)</text>
<rect class="step p6" x="522" y="154" width="210" height="44" rx="22"/><text class="lbl" x="627" y="173" text-anchor="middle">out-of-band console, GRUB e,</text><text class="lbl" x="627" y="188" text-anchor="middle">then --rollback</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<circle class="tok k3" cx="0" cy="0" r="6"/>
<circle class="tok k5" cx="0" cy="0" r="6"/>
</svg>
