<text class="cap" x="24" y="34">Affinity: every process inherits it, and a thread may change it</text>
<text class="sub" x="24" y="52">systemd CPUAffinity gives PID 1 the OS CPUs, and every service it starts gets the same mask.</text>
<rect class="box" x="24" y="62" width="190" height="26" rx="5"/><text class="lbl" x="34" y="79">systemd (PID 1)</text>
<rect class="box" x="24" y="106" width="190" height="26" rx="5"/><text class="lbl" x="34" y="123">your service</text>
<line class="arr" x1="60" y1="88" x2="60" y2="106"/><text class="axis" x="70" y="101">inherits the mask</text>
