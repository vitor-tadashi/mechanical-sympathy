<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d">
<title id="t">Affinity is inherited and can be changed; a cpuset is a fence</title>
<desc id="d">Two ways to keep processes on some CPUs. Affinity, set by systemd CPUAffinity on PID 1, is inherited by every service as a default: a thread of the application can change its own mask and pin itself to isolated CPU 9, which is how critical threads reach isolated CPUs. A cpuset, set by AllowedCPUs on housekeeping.slice, is enforced by the kernel: an agent that asks for CPU 7 is refused and stays on CPUs 4 and 6.</desc>
