<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="t d">
<title id="t">tuned profiles are layered: three latency profiles start from network-latency</title>
<desc id="d">latency-performance sets PM QoS and the performance governor. network-latency includes it and adds THP never, busy polling and numa_balancing off. cpu-partitioning, realtime and the low-latency profile of Guide 07 each include network-latency and add their own settings on top.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(130px, 186.5px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(380px, 60px); } 6% { transform: translate(380px, 60px); } 7.89% { transform: translate(380px, 94px); } 10.34% { transform: translate(380px, 138px); } 11.69% { transform: translate(380px, 162.25px); } 25.62% { transform: translate(130px, 162.25px); } 26.97% { transform: translate(130px, 186.5px); } 100% { transform: translate(130px, 186.5px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 26.87% { fill: #ffd166; stroke-width: 1.5; } 28.97% { fill: #ffb703; stroke-width: 3; } 36.97%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .k3 { transform: translate(380px, 186.5px); animation: k3 8s linear infinite; }
  @keyframes k3 { 0% { transform: translate(380px, 60px); } 30.67% { transform: translate(380px, 60px); } 36.3% { transform: translate(380px, 94px); } 43.59% { transform: translate(380px, 138px); } 51.63% { transform: translate(380px, 186.5px); } 100% { transform: translate(380px, 186.5px); } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 51.53% { fill: #ffd166; stroke-width: 1.5; } 53.63% { fill: #ffb703; stroke-width: 3; } 61.63%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .k5 { transform: translate(630px, 186.5px); animation: k5 8s linear infinite; }
  @keyframes k5 { 0% { transform: translate(380px, 60px); } 55.33% { transform: translate(380px, 60px); } 57.23% { transform: translate(380px, 94px); } 59.68% { transform: translate(380px, 138px); } 61.03% { transform: translate(380px, 162.25px); } 74.95% { transform: translate(630px, 162.25px); } 76.3% { transform: translate(630px, 186.5px); } 100% { transform: translate(630px, 186.5px); } }
  .p6 { animation: p6 8s linear infinite; }
  @keyframes p6 { 0%, 76.2% { fill: #ffd166; stroke-width: 1.5; } 78.3% { fill: #ffb703; stroke-width: 3; } 86.3%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="270" rx="8"/>
<path class="wire" d="M380,60 L380,94" marker-end="url(#a)"/>
<path class="wire" d="M380,138 L380,162.25 L130,162.25 L130,186.5" marker-end="url(#a)"/>
<path class="wire" d="M380,138 L380,186.5" marker-end="url(#a)"/>
<path class="wire" d="M380,138 L380,162.25 L630,162.25 L630,186.5" marker-end="url(#a)"/>
<text class="note" x="380" y="262" text-anchor="middle">include= : each profile takes every setting of the one above and adds its own</text>
<rect class="box" x="271.5" y="16" width="217" height="44" rx="5"/><text class="lbl" x="380" y="35" text-anchor="middle">latency-performance</text><text class="lbl" x="380" y="50" text-anchor="middle">PM QoS, performance governor</text>
<rect class="box" x="232" y="94" width="296" height="44" rx="5"/><text class="lbl" x="380" y="113" text-anchor="middle">network-latency</text><text class="lbl" x="380" y="128" text-anchor="middle">THP never, busy polling, numa_balancing off</text>
<rect class="foc p2" x="25" y="186.5" width="210" height="59" rx="5"/><text class="lbl" x="130" y="205.5" text-anchor="middle">cpu-partitioning</text><text class="lbl" x="130" y="220.5" text-anchor="middle">isolated_cores: boot args,</text><text class="lbl" x="130" y="235.5" text-anchor="middle">masks, irqbalance ban</text>
<rect class="foc p4" x="275" y="186.5" width="210" height="59" rx="5"/><text class="lbl" x="380" y="205.5" text-anchor="middle">realtime</text><text class="lbl" x="380" y="220.5" text-anchor="middle">for kernel-rt: isolcpus,</text><text class="lbl" x="380" y="235.5" text-anchor="middle">RT throttling off</text>
<rect class="foc p6" x="525" y="186.5" width="210" height="59" rx="5"/><text class="lbl" x="630" y="205.5" text-anchor="middle">low-latency (Guide 07)</text><text class="lbl" x="630" y="220.5" text-anchor="middle">performance governor,</text><text class="lbl" x="630" y="235.5" text-anchor="middle">min_perf_pct</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<circle class="tok k3" cx="0" cy="0" r="6"/>
<circle class="tok k5" cx="0" cy="0" r="6"/>
</svg>
