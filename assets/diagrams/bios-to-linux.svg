  .p8 { animation: p8 8s linear infinite; }
  @keyframes p8 { 0%, 53.38% { fill: #ffffff; stroke-width: 1.5; } 55.48% { fill: #ffe9a8; stroke-width: 3; } 63.48%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .k9 { transform: translate(323px, 306px); animation: k9 8s linear infinite; }
  @keyframes k9 { 0% { transform: translate(227px, 306px); } 55.33% { transform: translate(227px, 306px); } 65.82% { transform: translate(323px, 306px); } 100% { transform: translate(323px, 306px); } }
  .p10 { animation: p10 8s linear infinite; }
  @keyframes p10 { 0%, 65.72% { fill: #ffffff; stroke-width: 1.5; } 67.82% { fill: #ffe9a8; stroke-width: 3; } 75.82%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .k11 { transform: translate(323px, 366px); animation: k11 8s linear infinite; }
  @keyframes k11 { 0% { transform: translate(227px, 366px); } 67.67% { transform: translate(227px, 366px); } 78.15% { transform: translate(323px, 366px); } 100% { transform: translate(323px, 366px); } }
  .p12 { animation: p12 8s linear infinite; }
  @keyframes p12 { 0%, 78.05% { fill: #ffffff; stroke-width: 1.5; } 80.15% { fill: #ffe9a8; stroke-width: 3; } 88.15%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6, .k7, .p8, .k9, .p10, .k11, .p12 { animation: none; }
  }
