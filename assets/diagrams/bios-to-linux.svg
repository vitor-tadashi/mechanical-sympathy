<rect class="bg" x="0" y="0" width="760" height="420" rx="8"/>
<rect class="grp" x="14" y="14" width="236" height="392" rx="6"/>
<text class="gl" x="24" y="30">BIOS setup</text>
<rect class="grp" x="300" y="14" width="446" height="392" rx="6"/>
<text class="gl" x="310" y="30">What to check from Linux</text>
<path class="wire" d="M227,66 L323,66" marker-end="url(#a)"/>
<path class="wire" d="M227,126 L323,126" marker-end="url(#a)"/>
<path class="wire" d="M227,186 L323,186" marker-end="url(#a)"/>
<path class="wire" d="M227,246 L323,246" marker-end="url(#a)"/>
<path class="wire" d="M227,306 L323,306" marker-end="url(#a)"/>
<path class="wire" d="M227,366 L323,366" marker-end="url(#a)"/>
<rect class="box" x="37" y="44" width="190" height="44" rx="5"/><text class="lbl" x="132" y="70.5" text-anchor="middle">C-states, C1E</text>
<rect class="step p2" x="323" y="44" width="400" height="44" rx="5"/><text class="lbl" x="523" y="63" text-anchor="middle">cpuidle states</text><text class="lbl" x="523" y="78" text-anchor="middle">/sys/.../cpuidle/state*/name</text>
<rect class="box" x="37" y="104" width="190" height="44" rx="5"/><text class="lbl" x="132" y="123" text-anchor="middle">Hardware P-states,</text><text class="lbl" x="132" y="138" text-anchor="middle">turbo, EPB</text>
<rect class="step p4" x="323" y="104" width="400" height="44" rx="5"/><text class="lbl" x="523" y="123" text-anchor="middle">scaling_driver, no_turbo,</text><text class="lbl" x="523" y="138" text-anchor="middle">energy_perf_bias</text>
<rect class="box" x="37" y="164" width="190" height="44" rx="5"/><text class="lbl" x="132" y="190.5" text-anchor="middle">Hyper-Threading</text>
<rect class="step p6" x="323" y="164" width="400" height="44" rx="5"/><text class="lbl" x="523" y="190.5" text-anchor="middle">/sys/devices/system/cpu/smt/active</text>
<rect class="box" x="37" y="224" width="190" height="44" rx="5"/><text class="lbl" x="132" y="243" text-anchor="middle">Node interleaving,</text><text class="lbl" x="132" y="258" text-anchor="middle">SNC / NPS</text>
<rect class="step p8" x="323" y="224" width="400" height="44" rx="5"/><text class="lbl" x="523" y="243" text-anchor="middle">numactl --hardware</text><text class="lbl" x="523" y="258" text-anchor="middle">(nodes per socket)</text>
<rect class="box" x="37" y="284" width="190" height="44" rx="5"/><text class="lbl" x="132" y="310.5" text-anchor="middle">ASPM</text>
<rect class="step p10" x="323" y="284" width="400" height="44" rx="5"/><text class="lbl" x="523" y="303" text-anchor="middle">/sys/module/pcie_aspm/parameters/policy,</text><text class="lbl" x="523" y="318" text-anchor="middle">lspci -vv LnkCtl</text>
<rect class="box" x="37" y="344" width="190" height="44" rx="5"/><text class="lbl" x="132" y="370.5" text-anchor="middle">SMI sources</text>
<rect class="step p12" x="323" y="344" width="400" height="44" rx="5"/><text class="lbl" x="523" y="370.5" text-anchor="middle">turbostat SMI column</text>
