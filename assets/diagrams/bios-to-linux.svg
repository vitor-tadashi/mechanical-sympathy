<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Each BIOS setting leaves a trace that Linux can read</title>
<desc id="d">Six BIOS settings on the left, each linked to the file or command on the right that shows it from Linux: cpuidle states, the scaling driver and turbo, SMT, NUMA nodes per socket, the ASPM policy and the SMI count. The verify step reads these traces, so a BIOS reset shows up as a warning.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
