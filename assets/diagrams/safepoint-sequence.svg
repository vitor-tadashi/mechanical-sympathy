  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .life { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .k1 { transform: translate(606px, 238px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(154px, 84px); } 6% { transform: translate(154px, 84px); } 27.49% { transform: translate(606px, 84px); } 30.29% { transform: translate(606px, 84px); } 30.49% { transform: translate(606px, 156px); } 51.99% { transform: translate(154px, 156px); } 54.79% { transform: translate(154px, 156px); } 54.99% { transform: translate(154px, 188px); } 56.41% { transform: translate(184px, 188px); } 57.17% { transform: translate(184px, 204px); } 58.51% { transform: translate(156px, 204px); } 61.31% { transform: translate(156px, 204px); } 61.51% { transform: translate(154px, 238px); } 83% { transform: translate(606px, 238px); } 85.8% { transform: translate(606px, 238px); } 100% { transform: translate(606px, 238px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="282" rx="8"/>
<line class="life" x1="150" y1="58" x2="150" y2="266"/>
<line class="life" x1="610" y1="58" x2="610" y2="266"/>
<path class="wire" d="M154,84 L606,84" marker-end="url(#a)"/>
<rect class="step" x="294.96" y="109" width="455.04" height="22" rx="4"/>
<text class="sm" x="522.48" y="124" text-anchor="middle">each thread runs until its next poll (method return, loop back-edge)</text>
<path class="wire dash" d="M606,156 L154,156" marker-end="url(#a)"/>
<path class="wire" d="M154,188 L184,188 L184,204 L156,204" marker-end="url(#a)"/>
<path class="wire" d="M154,238 L606,238" marker-end="url(#a)"/>
<rect class="box" x="107.5" y="14" width="85" height="29" rx="5"/><text class="lbl" x="150" y="33" text-anchor="middle">VM thread</text>
<rect class="app" x="506.5" y="14" width="207" height="44" rx="5"/><text class="lbl" x="610" y="33" text-anchor="middle">Java threads</text><text class="lbl" x="610" y="48" text-anchor="middle">(net.rx, event.loop, worker.N)</text>
<text class="el" x="380" y="78" text-anchor="middle">arm the safepoint poll of every thread</text>
<text class="el" x="380" y="150" text-anchor="middle">all threads stopped</text>
<text class="el" x="192" y="200" text-anchor="start">the operation itself: the "pause"</text>
<text class="el" x="380" y="232" text-anchor="middle">release</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
