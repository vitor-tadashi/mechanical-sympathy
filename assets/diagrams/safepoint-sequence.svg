<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282" role="img" aria-labelledby="t d">
<title id="t">A safepoint stops every Java thread from the request to the release</title>
<desc id="d">The VM thread arms the safepoint poll of every Java thread. Each thread runs until its next poll, at a method return or a loop back-edge, and stops. When all have stopped, the VM thread runs the operation itself, the pause, and then releases them. The slowest thread to reach a poll decides the first part.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
