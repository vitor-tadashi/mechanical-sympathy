<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-labelledby="t d">
<title id="t">An RX ring is a circle of descriptors that the NIC and the driver chase around</title>
<desc id="d">A ring of sixteen slots drawn as a circle. The NIC writes packets at the head and the driver reads them at the tail. Slots are filled, ready or being refilled. When the head reaches a slot that is not ready, the packet is dropped and rx_missed_errors goes up. Memory per queue is the number of descriptors times the buffer size: 4096 times 2 KiB is 8 MiB.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .dash { fill: #ffffff; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .sm { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .smb { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .tiny { font: 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .mono { font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
  .monob { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .redt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .grnt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d6b33; }
  .tick { stroke: #8c959f; stroke-width: 1; }
  .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .arrowr { stroke: #9b1c1c; stroke-width: 1.5; fill: none; marker-end: url(#ahr); }
.wedge { stroke-width: 1.5; }  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
</style>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#57606a"/></marker>
<marker id="ahr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9b1c1c"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="760" height="412" rx="8"/>
<text class="cap" x="24" y="30">An RX ring is a circle of descriptors that the NIC and the driver chase around</text>
<text class="sub" x="24" y="48">The NIC fills at the head, the driver empties at the tail. The head meeting a slot that is not ready means a drop.</text>
<path class="wedge" d="M202.1 96.0 A122 122 0 0 1 244.7 104.5 L225.7 152.9 A70 70 0 0 0 201.2 148.0 Z" fill="#cfe3ff" stroke="#1f4e8c"/>
<path class="wedge" d="M248.6 106.1 A122 122 0 0 1 284.7 130.2 L248.6 167.6 A70 70 0 0 0 227.9 153.8 Z" fill="#cfe3ff" stroke="#1f4e8c"/>
<path class="wedge" d="M287.8 133.3 A122 122 0 0 1 311.9 169.4 L264.2 190.1 A70 70 0 0 0 250.4 169.4 Z" fill="#cfe3ff" stroke="#1f4e8c"/>
<path class="wedge" d="M313.5 173.3 A122 122 0 0 1 322.0 215.9 L270.0 216.8 A70 70 0 0 0 265.1 192.3 Z" fill="#cfe3ff" stroke="#1f4e8c"/>
<path class="wedge" d="M322.0 220.1 A122 122 0 0 1 313.5 262.7 L265.1 243.7 A70 70 0 0 0 270.0 219.2 Z" fill="#cfe3ff" stroke="#1f4e8c"/>
<path class="wedge" d="M311.9 266.6 A122 122 0 0 1 287.8 302.7 L250.4 266.6 A70 70 0 0 0 264.2 245.9 Z" fill="#cfe3ff" stroke="#1f4e8c"/>
<path class="wedge" d="M284.7 305.8 A122 122 0 0 1 248.6 329.9 L227.9 282.2 A70 70 0 0 0 248.6 268.4 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M244.7 331.5 A122 122 0 0 1 202.1 340.0 L201.2 288.0 A70 70 0 0 0 225.7 283.1 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M197.9 340.0 A122 122 0 0 1 155.3 331.5 L174.3 283.1 A70 70 0 0 0 198.8 288.0 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M151.4 329.9 A122 122 0 0 1 115.3 305.8 L151.4 268.4 A70 70 0 0 0 172.1 282.2 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M112.2 302.7 A122 122 0 0 1 88.1 266.6 L135.8 245.9 A70 70 0 0 0 149.6 266.6 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M86.5 262.7 A122 122 0 0 1 78.0 220.1 L130.0 219.2 A70 70 0 0 0 134.9 243.7 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M78.0 215.9 A122 122 0 0 1 86.5 173.3 L134.9 192.3 A70 70 0 0 0 130.0 216.8 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M88.1 169.4 A122 122 0 0 1 112.2 133.3 L149.6 169.4 A70 70 0 0 0 135.8 190.1 Z" fill="#c8f0d0" stroke="#1d6b33"/>
<path class="wedge" d="M115.3 130.2 A122 122 0 0 1 151.4 106.1 L172.1 153.8 A70 70 0 0 0 151.4 167.6 Z" fill="#ffd166" stroke="#8a5a00"/>
<path class="wedge" d="M155.3 104.5 A122 122 0 0 1 197.9 96.0 L198.8 148.0 A70 70 0 0 0 174.3 152.9 Z" fill="#ffd166" stroke="#8a5a00"/>
<text class="lbl" x="200" y="212" text-anchor="middle">RX ring</text>
<text class="sm" x="200" y="230" text-anchor="middle">16 slots drawn</text>
<text class="tiny" x="200" y="245" text-anchor="middle">real rings: 512 to 8160</text>
<path class="arrow" d="M200.0 70.0 L200.0 94.0"/>
<text class="smb" x="200" y="64" text-anchor="middle">driver reads here (tail)</text>
<path class="arrow" d="M307.5 325.5 L287.7 305.7"/>
<text class="smb" x="313.48" y="339.48">NIC writes here</text>
<text class="smb" x="313.48" y="353.48">(head)</text>
<rect class="box" x="420" y="82" width="18" height="18" rx="3"/>
<text class="smb" x="448" y="91">Filled: the NIC wrote a packet here.</text>
<text class="sm" x="448" y="106">The driver has not read it yet.</text>
<rect class="app" x="420" y="124" width="18" height="18" rx="3"/>
<text class="smb" x="448" y="133">Ready: an empty buffer is posted.</text>
<text class="sm" x="448" y="148">The NIC uses it for the next packet.</text>
<rect class="foc" x="420" y="166" width="18" height="18" rx="3"/>
<text class="smb" x="448" y="175">Refilling: the driver read the packet</text>
<text class="sm" x="448" y="190">and is posting a new empty buffer.</text>
<text class="lbl" x="420" y="212">Three steps, in a loop</text>
<text class="sm" x="420" y="232">1  The NIC writes a packet by DMA at the head.</text>
<text class="sm" x="420" y="248">2  NAPI reads it at the tail and passes it up.</text>
<text class="sm" x="420" y="264">3  The driver posts a new empty buffer.</text>
<rect class="wait" x="420" y="288" width="325" height="44" rx="5"/>
<text class="smb" x="430" y="306">Head meets a slot that is not ready: packet dropped</text>
<text class="mono" x="430" y="322">counter: rx_missed_errors or rx_no_buffer_count</text>
<rect class="mut" x="420" y="344" width="325" height="52" rx="5"/>
<text class="smb" x="430" y="362">Memory per queue = descriptors x buffer size</text>
<text class="sm" x="430" y="378">4096 x 2 KiB = 8 MiB. With 63 queues: 504 MiB.</text>
<text class="tiny" x="430" y="391">Illustrative: sizes and queue counts depend on the driver.</text>
</svg>
