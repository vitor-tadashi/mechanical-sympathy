<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="t d">
<title id="t">Six reading lanes, one per role</title>
<desc id="d">The operator takes a baseline with Guide 09, walks Guides 00 to 07, then 10, 11 and 12, with 08 only with kernel bypass, and ends at verify-tuning. The learner follows three use cases and the layout explorer. The developer reads pinning, the Java flags and the Java example. The reviewer reads the safety page and the risks. The network engineer goes from Guide 04 to time sync. The learner of mechanisms reads every concept.</desc>
