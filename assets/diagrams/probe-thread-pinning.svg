<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
<title id="t">Only the two measuring threads are pinned, one isolated CPU each</title>
<desc id="d">The ping thread runs pinned on isolated CPU 9 and the pong thread on isolated CPU 11, both on NUMA node 1, the NIC's node, and they pass messages back and forth. The GC workers, the JIT compiler and the logging, admin and main threads keep the OS CPU mask they inherited from systemd.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(330px, 180px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(330px, 164px); } 6% { transform: translate(330px, 164px); } 18% { transform: translate(430px, 164px); } 25.8% { transform: translate(430px, 164px); } 26% { transform: translate(430px, 180px); } 38% { transform: translate(330px, 180px); } 45.8% { transform: translate(330px, 180px); } 46% { transform: translate(330px, 164px); } 58% { transform: translate(430px, 164px); } 65.8% { transform: translate(430px, 164px); } 66% { transform: translate(430px, 180px); } 78% { transform: translate(330px, 180px); } 85.8% { transform: translate(330px, 180px); } 100% { transform: translate(330px, 180px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 17.9% { fill: #c8f0d0; stroke-width: 1.5; } 20% { fill: #8fe0a0; stroke-width: 3; } 26%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 37.9% { fill: #c8f0d0; stroke-width: 1.5; } 40% { fill: #8fe0a0; stroke-width: 3; } 46%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 57.9% { fill: #c8f0d0; stroke-width: 1.5; } 60% { fill: #8fe0a0; stroke-width: 3; } 66%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .p5 { animation: p5 8s linear infinite; }
  @keyframes p5 { 0%, 77.9% { fill: #c8f0d0; stroke-width: 1.5; } 80% { fill: #8fe0a0; stroke-width: 3; } 86%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="230" rx="8"/>
<rect class="grp" x="14" y="14" width="732" height="84" rx="6"/>
<text class="gl" x="24" y="30">OS CPUs (inherited launch mask)</text>
<rect class="grp" x="14" y="118" width="732" height="98" rx="6"/>
<text class="gl" x="24" y="134">Isolated CPUs, NUMA node 1</text>
<path class="wire" d="M330,164 L430,164" marker-end="url(#a)"/>
<path class="wire" d="M430,180 L330,180" marker-end="url(#a)"/>
<rect class="box" x="70" y="47.5" width="260" height="29" rx="5"/><text class="lbl" x="200" y="66.5" text-anchor="middle">GC workers, JIT compiler</text>
<rect class="box" x="430" y="47.5" width="260" height="29" rx="5"/><text class="lbl" x="560" y="66.5" text-anchor="middle">logging, admin, main</text>
<rect class="app p3 p5" x="70" y="157.5" width="260" height="29" rx="5"/><text class="lbl" x="200" y="176.5" text-anchor="middle">CPU 9 · ping thread</text>
<rect class="app p2 p4" x="430" y="157.5" width="260" height="29" rx="5"/><text class="lbl" x="560" y="176.5" text-anchor="middle">CPU 11 · pong thread</text>
<text class="el" x="380" y="158" text-anchor="middle">ping</text>
<text class="el" x="380" y="198" text-anchor="middle">pong</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
</svg>
