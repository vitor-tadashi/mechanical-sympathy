<rect class="step" x="25" y="30" width="130" height="44" rx="22"/><text class="lbl" x="90" y="49" text-anchor="middle">PTP grandmaster</text><text class="lbl" x="90" y="64" text-anchor="middle">or NTP servers</text>
<rect class="step" x="257.5" y="30" width="145" height="44" rx="5"/><text class="lbl" x="330" y="49" text-anchor="middle">NIC hardware clock</text><text class="lbl" x="330" y="64" text-anchor="middle">PHC, /dev/ptpN</text>
<rect class="box p2 p3" x="230.5" y="150" width="199" height="44" rx="5"/><text class="lbl" x="330" y="169" text-anchor="middle">kernel timekeeping</text><text class="lbl" x="330" y="184" text-anchor="middle">REALTIME, MONOTONIC, TAI</text>
<rect class="step" x="22.5" y="150" width="135" height="44" rx="5"/><text class="lbl" x="90" y="169" text-anchor="middle">TSC</text><text class="lbl" x="90" y="184" text-anchor="middle">CPU cycle counter</text>
<rect class="foc p4" x="504.5" y="150" width="241" height="44" rx="2"/><line class="sl" x1="510.5" y1="150" x2="510.5" y2="194"/><line class="sl" x1="739.5" y1="150" x2="739.5" y2="194"/><text class="lbl" x="625" y="169" text-anchor="middle">application</text><text class="lbl" x="625" y="184" text-anchor="middle">clock_gettime, System.nanoTime</text>
<text class="el" x="336" y="116" text-anchor="start">phc2sys or chrony</text>
<text class="el" x="194" y="167" text-anchor="middle">clocksource</text>
<text class="el" x="472" y="208" text-anchor="middle">vDSO, no system call</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
