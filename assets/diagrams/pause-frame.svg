<g clip-path="url(#ca)"><g class="hold"><rect class="tb" x="-90" y="103" width="22" height="14" rx="3"/><rect class="tb" x="-50" y="103" width="22" height="14" rx="3"/><rect class="tb" x="-10" y="103" width="22" height="14" rx="3"/><rect class="tb" x="30" y="103" width="22" height="14" rx="3"/><rect class="tb" x="70" y="103" width="22" height="14" rx="3"/><rect class="tb" x="110" y="103" width="22" height="14" rx="3"/><rect class="tb" x="150" y="103" width="22" height="14" rx="3"/><rect class="tb" x="190" y="103" width="22" height="14" rx="3"/><rect class="tb" x="230" y="103" width="22" height="14" rx="3"/><rect class="tb" x="270" y="103" width="22" height="14" rx="3"/><rect class="tb" x="310" y="103" width="22" height="14" rx="3"/><rect class="tb" x="350" y="103" width="22" height="14" rx="3"/><rect class="tb" x="390" y="103" width="22" height="14" rx="3"/><rect class="tb" x="430" y="103" width="22" height="14" rx="3"/><rect class="tb" x="470" y="103" width="22" height="14" rx="3"/><rect class="tb" x="510" y="103" width="22" height="14" rx="3"/><rect class="tb" x="550" y="103" width="22" height="14" rx="3"/><rect class="tb" x="590" y="103" width="22" height="14" rx="3"/><rect class="tb" x="630" y="103" width="22" height="14" rx="3"/></g></g>
<text class="axis" x="150" y="144">green: critical flow · blue: bulk flow</text>
<g class="back"><rect class="pz" x="604" y="64" width="46" height="18" rx="4"/><text class="warn" x="627" y="77" text-anchor="middle">PAUSE</text></g>
<text class="warn" x="420" y="156" text-anchor="middle">every flow waits, the critical one too</text>
<rect class="lane" x="10" y="170" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="194">Flow control off: the switch drops a packet instead</text>
<text class="sub" x="24" y="212">Here a bulk packet is lost and TCP sends it again. Which flow loses one depends on the switch.</text>
