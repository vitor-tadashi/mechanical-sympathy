<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">PAUSE frames stop every flow of a port; without them one packet is dropped</title>
<desc id="d">Two lanes show a host sending a critical flow and a bulk flow to a congested switch port. With Ethernet flow control on, the switch sends a PAUSE frame back, and the host stops every flow from that port, the critical one too, for up to 3.3 ms per frame at 10 Gb/s. With flow control off, the switch drops a packet instead; in this illustration it is a bulk packet that TCP retransmits, while the critical flow keeps moving. Which flow loses a packet depends on the switch.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .wire { stroke: #d0d7de; stroke-width: 2; }
  .tc { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .tb { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .pz { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 2; }
  .warn { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .x { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; text-anchor: middle; }
  .run { animation: run 8s linear infinite; }
  .hold { animation: hold 8s linear infinite; }
  .back { transform: translateX(-470px); animation: back 8s linear infinite; }
  .drop { transform-box: fill-box; transform-origin: center; animation: drop 8s linear infinite; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(200px); } }
  @keyframes hold {
    0% { transform: translateX(0); }
    45% { transform: translateX(120px); }
    75% { transform: translateX(120px); }
    100% { transform: translateX(200px); }
  }
  @keyframes back {
    0%, 37% { transform: translateX(0); }
    45%, 100% { transform: translateX(-470px); }
  }
  @keyframes drop {
    0%, 44% { transform: scale(1); }
    46%, 52% { transform: scale(1.6); }
    56%, 100% { transform: scale(1); }
  }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .run, .hold, .back, .drop { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="34">Flow control on: the switch sends PAUSE</text>
<text class="sub" x="24" y="52">Every flow from this port stops, the critical one too, for up to 3.3 ms per PAUSE frame at 10 Gb/s.</text>
