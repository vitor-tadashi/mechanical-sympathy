<rect class="mut" x="650" y="62" width="86" height="64" rx="6"/><text class="mid" x="693" y="90">switch</text><text class="mid" x="693" y="106">congested</text>
<line class="wire" x1="136" y1="78" x2="650" y2="78"/>
<line class="wire" x1="136" y1="110" x2="650" y2="110"/>
