<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img" aria-labelledby="t d">
<title id="t">Memory exhaustion ends in a capped OOM kill, a global OOM kill, or silent swap stalls</title>
<desc id="d">A process that grows ends in one of three places. In a capped slice, a cgroup OOM kill inside the slice is logged and the unit restarts. Without a cap and with swap off, the global OOM killer kills the highest oom_score, the latency service last. With swap on, swap-out and swap-in stalls hit every process silently.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 112px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0%, 5.8% { transform: translate(140px, 64px); opacity: 0; } 6% { transform: translate(140px, 64px); opacity: 1; } 7.88% { transform: translate(140px, 90px); opacity: 1; } 12.12% { transform: translate(194.5px, 112px); opacity: 1; } 26.97% { transform: translate(400px, 112px); opacity: 1; } 30.47% { transform: translate(400px, 112px); opacity: 1; } 30.67%, 100% { transform: translate(400px, 112px); opacity: 0; } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 26.87% { fill: #ffd166; stroke-width: 1.5; } 28.97% { fill: #ffb703; stroke-width: 3; } 36.97%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .k3 { transform: translate(400px, 182px); animation: k3 7s linear infinite; }
  @keyframes k3 { 0%, 30.47% { transform: translate(140px, 64px); opacity: 0; } 30.67% { transform: translate(140px, 64px); opacity: 1; } 31.96% { transform: translate(140px, 90px); opacity: 1; } 34.16% { transform: translate(140px, 134px); opacity: 1; } 37.18% { transform: translate(140px, 194.5px); opacity: 1; } 39.21% { transform: translate(178px, 209px); opacity: 1; } 40.41% { transform: translate(202px, 209px); opacity: 1; } 41.75% { transform: translate(202px, 182px); opacity: 1; } 51.63% { transform: translate(400px, 182px); opacity: 1; } 55.13% { transform: translate(400px, 182px); opacity: 1; } 55.33%, 100% { transform: translate(400px, 182px); opacity: 0; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 51.53% { fill: #ffd166; stroke-width: 1.5; } 53.63% { fill: #ffb703; stroke-width: 3; } 61.63%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .k5 { transform: translate(400px, 236px); animation: k5 7s linear infinite; }
  @keyframes k5 { 0%, 55.13% { transform: translate(140px, 64px); opacity: 0; } 55.33% { transform: translate(140px, 64px); opacity: 1; } 56.63% { transform: translate(140px, 90px); opacity: 1; } 58.83% { transform: translate(140px, 134px); opacity: 1; } 61.85% { transform: translate(140px, 194.5px); opacity: 1; } 63.87% { transform: translate(178px, 209px); opacity: 1; } 65.07% { transform: translate(202px, 209px); opacity: 1; } 66.42% { transform: translate(202px, 236px); opacity: 1; } 76.3% { transform: translate(400px, 236px); opacity: 1; } 79.8% { transform: translate(400px, 236px); opacity: 1; } 80%, 100% { transform: translate(400px, 236px); opacity: 0; } }
  .p6 { animation: p6 7s linear infinite; }
  @keyframes p6 { 0%, 76.2% { fill: #ffc9c9; stroke-width: 1.5; } 78.3% { fill: #ff9b9b; stroke-width: 3; } 86.3%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="276" rx="8"/>
<path class="wire" d="M140,64 L140,90" marker-end="url(#a)"/>
<path class="wire" d="M194.5,112 L400,112" marker-end="url(#a)"/>
<path class="wire" d="M140,134 L140,194.5" marker-end="url(#a)"/>
<path class="wire" d="M178,209 L202,209 L202,182 L400,182" marker-end="url(#a)"/>
<path class="wire" d="M178,209 L202,209 L202,236 L400,236" marker-end="url(#a)"/>
<rect class="foc" x="75.5" y="20" width="129" height="44" rx="22"/><text class="lbl" x="140" y="39" text-anchor="middle">A process grows:</text><text class="lbl" x="140" y="54" text-anchor="middle">leak or burst</text>
<polygon class="step" points="85.5,112 99.5,90 180.5,90 194.5,112 180.5,134 99.5,134"/><text class="lbl" x="140" y="109" text-anchor="middle">In a capped</text><text class="lbl" x="140" y="124" text-anchor="middle">slice?</text>
<rect class="foc p2" x="400" y="90" width="197" height="44" rx="5"/><text class="lbl" x="498.5" y="109" text-anchor="middle">cgroup OOM inside the slice:</text><text class="lbl" x="498.5" y="124" text-anchor="middle">logged, restarted</text>
<polygon class="step" points="102,209 116,194.5 164,194.5 178,209 164,223.5 116,223.5"/><text class="lbl" x="140" y="213.5" text-anchor="middle">Swap?</text>
<rect class="foc p4" x="400" y="160" width="214" height="44" rx="5"/><text class="lbl" x="507" y="179" text-anchor="middle">Global OOM: highest oom_score</text><text class="lbl" x="507" y="194" text-anchor="middle">killed, latency service last</text>
<rect class="wait p6" x="400" y="214" width="213" height="44" rx="5"/><text class="lbl" x="506.5" y="233" text-anchor="middle">Swap-out, then swap-in stalls</text><text class="lbl" x="506.5" y="248" text-anchor="middle">in every process: silent</text>
<text class="el" x="226.5" y="107" text-anchor="start">yes</text>
<text class="el" x="146" y="168.25" text-anchor="start">no</text>
<text class="el" x="210" y="177" text-anchor="start">SWAP_POLICY=off</text>
<text class="el" x="210" y="231" text-anchor="start">swap on</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<circle class="tok k3" cx="0" cy="0" r="6"/>
<circle class="tok k5" cx="0" cy="0" r="6"/>
</svg>
