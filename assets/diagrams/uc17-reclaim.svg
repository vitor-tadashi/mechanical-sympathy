<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 261" width="760" height="261" role="img" aria-labelledby="t d">
<title id="t">Stalls when the journal rotates: inline reclaim, the watermarks, PSI</title>
<desc id="d">Count inline reclaim with allocstall at the stall, compare the zone's free pages with its min watermark, and confirm with PSI and the slice limits.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
