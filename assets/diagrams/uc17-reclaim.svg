<polygon class="step p2" points="74,97 88,75 192,75 206,97 192,119 88,119"/><text class="lbl" x="140" y="94" text-anchor="middle">allocstall rises</text><text class="lbl" x="140" y="109" text-anchor="middle">at the stall?</text>
<rect class="mut" x="400" y="75" width="211" height="44" rx="5"/><text class="lbl" x="505.5" y="94" text-anchor="middle">Not reclaim: look at fsync and</text><text class="lbl" x="505.5" y="109" text-anchor="middle">the logger (use case 16)</text>
<polygon class="step p3" points="74.5,194 88.5,172 191.5,172 205.5,194 191.5,216 88.5,216"/><text class="lbl" x="140" y="191" text-anchor="middle">Zone free near</text><text class="lbl" x="140" y="206" text-anchor="middle">its min?</text>
<rect class="box p4" x="400" y="145" width="169" height="44" rx="5"/><text class="lbl" x="484.5" y="164" text-anchor="middle">Raise min_free_kbytes,</text><text class="lbl" x="484.5" y="179" text-anchor="middle">fence the writer (§3)</text>
<rect class="box" x="400" y="199" width="209" height="44" rx="5"/><text class="lbl" x="504.5" y="218" text-anchor="middle">Check PSI and the slice limits</text><text class="lbl" x="504.5" y="233" text-anchor="middle">(Guide 12 §4.6)</text>
