  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 15.15% { transform: translate(140px, 75px); } 21.15% { transform: translate(140px, 75px); } 32.9% { transform: translate(140px, 172px); } 38.9% { transform: translate(140px, 172px); } 50.07% { transform: translate(229.5px, 194px); } 53.34% { transform: translate(229.5px, 167px); } 74% { transform: translate(400px, 167px); } 80% { transform: translate(400px, 167px); } 100% { transform: translate(400px, 167px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.05% { fill: #ffffff; stroke-width: 1.5; } 17.15% { fill: #ffe9a8; stroke-width: 3; } 25.15%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 32.8% { fill: #ffffff; stroke-width: 1.5; } 34.9% { fill: #ffe9a8; stroke-width: 3; } 42.9%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
