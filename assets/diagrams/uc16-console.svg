  .p6 { animation: p6 7s linear infinite; }
  @keyframes p6 { 0%, 74.9% { fill: #cfe3ff; stroke-width: 1.5; } 75%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5, .p6 { animation: none; }
  }
</style>
