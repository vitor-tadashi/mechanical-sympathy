<rect class="foc" x="57" y="20" width="166" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Rare ms stalls on CPU 1</text>
<polygon class="step p2" points="73,97 87,75 193,75 207,97 193,119 87,119"/><text class="lbl" x="140" y="94" text-anchor="middle">Kernel message</text><text class="lbl" x="140" y="109" text-anchor="middle">at that time?</text>
<rect class="mut" x="380" y="75" width="204" height="44" rx="5"/><text class="lbl" x="482" y="94" text-anchor="middle">Not the console: rtla osnoise</text><text class="lbl" x="482" y="109" text-anchor="middle">on CPU 1 (Guide 09)</text>
<polygon class="step p3" points="81.5,194 95.5,172 184.5,172 198.5,194 184.5,216 95.5,216"/><text class="lbl" x="140" y="191" text-anchor="middle">Console level</text><text class="lbl" x="140" y="206" text-anchor="middle">above 1?</text>
<rect class="mut" x="380" y="145" width="248" height="44" rx="5"/><text class="lbl" x="504" y="164" text-anchor="middle">The message is filtered, so it is not</text><text class="lbl" x="504" y="179" text-anchor="middle">the console: back to rtla osnoise</text>
<rect class="box p4" x="380" y="199" width="155" height="44" rx="5"/><text class="lbl" x="457.5" y="218" text-anchor="middle">kernel.printk = 1 4 1 7</text><text class="lbl" x="457.5" y="233" text-anchor="middle">(Guide 06 §2)</text>
<polygon class="step p5" points="371.5,295 385.5,273 506.5,273 520.5,295 506.5,317 385.5,317"/><text class="lbl" x="446" y="292" text-anchor="middle">Graphical console</text><text class="lbl" x="446" y="307" text-anchor="middle">in /proc/consoles?</text>
<rect class="box p6" x="566" y="273" width="184" height="44" rx="5"/><text class="lbl" x="658" y="292" text-anchor="middle">Also remove console=tty0</text><text class="lbl" x="658" y="307" text-anchor="middle">(Guide 01 §5.7)</text>
<text class="el" x="239" y="92" text-anchor="start">no</text>
<text class="el" x="146" y="149.5" text-anchor="start">yes</text>
