<path class="wire" d="M140,119 L140,172" marker-end="url(#a)"/>
<path class="wire" d="M198.5,194 L222.5,194 L222.5,167 L380,167" marker-end="url(#a)"/>
<path class="wire" d="M198.5,194 L222.5,194 L222.5,221 L380,221" marker-end="url(#a)"/>
<path class="wire" d="M446,243 L446,273" marker-end="url(#a)"/>
