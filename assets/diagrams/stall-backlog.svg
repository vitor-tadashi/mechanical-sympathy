<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
<title id="t">During a stall, requests due at a fixed rate pile up and each one is late; a closed-loop client records one slow sample</title>
<desc id="d">Two timelines of the same 20 ms server stall. The closed-loop client sends a request, waits for the answer, and only then sends the next one, so during the stall it sends nothing and records a single slow sample. An open-loop client keeps sending at the production rate: every request due during the stall waits in a backlog, the first one for the whole stall and each later one a little less, and the backlog takes a moment to drain after the stall ends. Timed from each intended send time, the stall becomes thousands of slow samples, which is what the users see.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .stall { fill: #ffc9c9; fill-opacity: 0.45; stroke: #9b1c1c; stroke-dasharray: 4 3; }
  .send { stroke: #1f4e8c; stroke-width: 2; }
  .base { stroke: #57606a; stroke-width: 1; }
  .bar { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1; }
  .slow { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .st { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .ev { transform-box: fill-box; transform-origin: bottom; animation: flash 6s linear infinite; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes flash {
    0%, 4%   { transform: scaleY(1.12); stroke-width: 3; }
    8%, 100% { transform: scaleY(1); stroke-width: 1.5; }
  }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ev, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="340" rx="8"/>

<!-- Lane 1: closed loop -->
<rect class="lane" x="10" y="10" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="34">Closed loop: send, wait for the answer, then send the next one</text>
<text class="sub" x="24" y="52">During the stall the client waits too. It sends nothing, and the stall becomes one slow sample.</text>
<rect class="stall" x="300" y="60" width="200" height="90"/>
<text class="st" x="400" y="94">server stall, 20 ms</text>
<text class="lbl" x="24" y="72">sends</text>
<path class="send" d="M160 62 v10 M180 62 v10 M200 62 v10 M220 62 v10 M240 62 v10 M260 62 v10 M280 62 v10 M300 62 v10 M510 62 v10 M530 62 v10 M550 62 v10 M570 62 v10 M590 62 v10 M610 62 v10 M630 62 v10 M650 62 v10 M670 62 v10 M690 62 v10 M710 62 v10"/>
<text class="lbl" x="24" y="122">latency</text>
<text class="lbl" x="24" y="137">recorded</text>
