<rect class="bar" x="686" y="142" width="8" height="4"/>
<rect class="bar" x="706" y="142" width="8" height="4"/>
<text class="axis" x="610" y="94">one sample</text>

<!-- Lane 2: open loop -->
<rect class="lane" x="10" y="170" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="194">Open loop at the production rate, timed from each intended send</text>
<text class="sub" x="24" y="212">Requests keep coming. Each one due during the stall waits in the backlog, and the backlog drains after it.</text>
<rect class="stall" x="300" y="220" width="200" height="90"/>
<text class="st" x="400" y="254">server stall, 20 ms</text>
<text class="lbl" x="24" y="232">sends</text>
<path class="send" d="M160 222 v10 M180 222 v10 M200 222 v10 M220 222 v10 M240 222 v10 M260 222 v10 M280 222 v10 M300 222 v10 M320 222 v10 M340 222 v10 M360 222 v10 M380 222 v10 M400 222 v10 M420 222 v10 M440 222 v10 M460 222 v10 M480 222 v10 M500 222 v10 M520 222 v10 M540 222 v10 M560 222 v10 M580 222 v10 M600 222 v10 M620 222 v10 M640 222 v10 M660 222 v10 M680 222 v10 M700 222 v10"/>
<text class="lbl" x="24" y="282">latency</text>
<text class="lbl" x="24" y="297">recorded</text>
