<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">One kernel update, with and without the verify timer</title>
<desc id="d">Day 0: dnf update installs a kernel whose boot entry lacks isolcpus. Day 3: a planned reboot boots the new kernel untuned. With the timer, lowlat-verify fails ten minutes later and the entry is fixed the same day. Without it, weeks later p99.9 has crept up and nobody knows since when.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .tick { fill: #57606a; }
  .h1 { transform: translateX(712px); animation: h1 10s linear infinite; }
  @keyframes h1 { 0%, 4% { transform: translateX(0); } 92%, 100% { transform: translateX(712px); } }
  .p2 { animation: p2 10s linear infinite; }
  @keyframes p2 { 0%, 15.15% { fill: #ffffff; stroke-width: 1.5; } 17.25% { fill: #ffe9a8; stroke-width: 3; } 27.25%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 10s linear infinite; }
  @keyframes p3 { 0%, 37.39% { fill: #ffc9c9; stroke-width: 1.5; } 39.49% { fill: #ff9b9b; stroke-width: 3; } 49.49%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  .p4 { animation: p4 10s linear infinite; }
  @keyframes p4 { 0%, 59.64% { fill: #c8f0d0; stroke-width: 1.5; } 61.74% { fill: #8fe0a0; stroke-width: 3; } 71.74%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .p5 { animation: p5 10s linear infinite; }
  @keyframes p5 { 0%, 81.89% { fill: #ffc9c9; stroke-width: 1.5; } 83.99% { fill: #ff9b9b; stroke-width: 3; } 93.99%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .h1, .p2, .p3, .p4, .p5 { animation: none; }
    .h1 { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="300" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="280" rx="6"/>
<text class="cap" x="24" y="34">One kernel update, with and without the timer</text>
<text class="sub" x="24" y="52">Nothing fails on its own: the tail just slowly gets worse.</text>
<line class="wire" x1="30" y1="86" x2="730" y2="86"/>
<circle class="tick" cx="115" cy="86" r="5"/>
<text class="lbl" x="115" y="76" text-anchor="middle">Day 0</text>
<line class="wire" x1="115" y1="91" x2="115" y2="108"/>
<circle class="tick" cx="295" cy="86" r="5"/>
<text class="lbl" x="295" y="76" text-anchor="middle">Day 3</text>
<line class="wire" x1="295" y1="91" x2="295" y2="108"/>
<circle class="tick" cx="475" cy="86" r="5"/>
<text class="lbl" x="475" y="76" text-anchor="middle">Day 3 + 10 min</text>
<line class="wire" x1="475" y1="91" x2="475" y2="108"/>
<circle class="tick" cx="655" cy="86" r="5"/>
<text class="lbl" x="655" y="76" text-anchor="middle">Weeks later</text>
<line class="wire" x1="655" y1="91" x2="655" y2="108"/>
<text class="note" x="380" y="270" text-anchor="middle">Day 3 + 10 min happens only with the timer, and weeks later only without it.</text>
<rect class="step p2" x="35" y="108" width="160" height="44" rx="5"/><text class="lbl" x="115" y="127" text-anchor="middle">dnf update installs</text><text class="lbl" x="115" y="142" text-anchor="middle">a kernel</text>
<rect class="step" x="35" y="174" width="160" height="44" rx="5"/><text class="lbl" x="115" y="193" text-anchor="middle">its boot entry</text><text class="lbl" x="115" y="208" text-anchor="middle">lacks isolcpus</text>
<rect class="wait p3" x="215" y="108" width="160" height="44" rx="5"/><text class="lbl" x="295" y="134.5" text-anchor="middle">planned reboot</text>
<rect class="step" x="215" y="174" width="160" height="44" rx="5"/><text class="lbl" x="295" y="193" text-anchor="middle">the new kernel</text><text class="lbl" x="295" y="208" text-anchor="middle">boots untuned</text>
<rect class="app p4" x="395" y="108" width="160" height="44" rx="5"/><text class="lbl" x="475" y="127" text-anchor="middle">with the timer,</text><text class="lbl" x="475" y="142" text-anchor="middle">lowlat-verify FAILs</text>
<rect class="step" x="395" y="174" width="160" height="44" rx="5"/><text class="lbl" x="475" y="193" text-anchor="middle">you fix the entry</text><text class="lbl" x="475" y="208" text-anchor="middle">the same day</text>
<rect class="wait p5" x="575" y="108" width="160" height="44" rx="5"/><text class="lbl" x="655" y="127" text-anchor="middle">without it, p99.9</text><text class="lbl" x="655" y="142" text-anchor="middle">has crept up</text>
<rect class="step" x="575" y="174" width="160" height="44" rx="5"/><text class="lbl" x="655" y="193" text-anchor="middle">nobody knows</text><text class="lbl" x="655" y="208" text-anchor="middle">since when</text>
<line class="head h1" x1="24" y1="64" x2="24" y2="230"/>
</svg>
