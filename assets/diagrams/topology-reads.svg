  .p7 { animation: p7 9s linear infinite; }
  @keyframes p7 { 0%, 80.9% { fill: #ffd166; stroke-width: 1.5; } 81%, 97% { fill: #ffb703; stroke-width: 3; } 100% { fill: #ffd166; stroke-width: 1.5; } }
