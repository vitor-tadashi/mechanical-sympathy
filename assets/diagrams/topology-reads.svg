  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(566.5px, 160px); animation: k1 9s linear infinite; }
  @keyframes k1 { 0% { transform: translate(204px, 56px); } 8% { transform: translate(204px, 56px); } 13% { transform: translate(204px, 56px); } 16.14% { transform: translate(296px, 56px); } 21.14% { transform: translate(296px, 56px); } 28.68% { transform: translate(517px, 56px); } 33.68% { transform: translate(517px, 56px); } 37.62% { transform: translate(620px, 108px); } 54.69% { transform: translate(120px, 108px); } 55.71% { transform: translate(120px, 138px); } 60.71% { transform: translate(120px, 138px); } 67.04% { transform: translate(304px, 160px); } 72.04% { transform: translate(304px, 160px); } 81% { transform: translate(566.5px, 160px); } 86% { transform: translate(566.5px, 160px); } 100% { transform: translate(566.5px, 160px); } }
