  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5, .p6, .p7 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="210" rx="8"/>
<path class="wire" d="M204,56 L296,56" marker-end="url(#a)"/>
<path class="wire" d="M444,56 L517,56" marker-end="url(#a)"/>
<path class="wire" d="M620,78 L620,108 L120,108 L120,138" marker-end="url(#a)"/>
<path class="wire" d="M200,160 L304,160" marker-end="url(#a)"/>
<path class="wire" d="M436,160 L566.5,160" marker-end="url(#a)"/>
<rect class="step p2" x="36" y="34" width="168" height="44" rx="5"/><text class="lbl" x="120" y="53" text-anchor="middle">lscpu -e</text><text class="lbl" x="120" y="68" text-anchor="middle">CPU, core, socket, node</text>
<rect class="step p3" x="296" y="34" width="148" height="44" rx="5"/><text class="lbl" x="370" y="53" text-anchor="middle">thread_siblings_list</text><text class="lbl" x="370" y="68" text-anchor="middle">who shares a core</text>
<rect class="step p4" x="517" y="34" width="206" height="44" rx="5"/><text class="lbl" x="620" y="53" text-anchor="middle">cache/index3/shared_cpu_list</text><text class="lbl" x="620" y="68" text-anchor="middle">who shares an L3</text>
<rect class="step p5" x="40" y="138" width="160" height="44" rx="5"/><text class="lbl" x="120" y="157" text-anchor="middle">numactl --hardware</text><text class="lbl" x="120" y="172" text-anchor="middle">memory and distances</text>
<rect class="step p6" x="304" y="138" width="132" height="44" rx="5"/><text class="lbl" x="370" y="157" text-anchor="middle">device/numa_node</text><text class="lbl" x="370" y="172" text-anchor="middle">where the NIC is</text>
<rect class="foc p7" x="566.5" y="138" width="107" height="44" rx="2"/><line class="sl" x1="572.5" y1="138" x2="572.5" y2="182"/><line class="sl" x1="667.5" y1="138" x2="667.5" y2="182"/><text class="lbl" x="620" y="157" text-anchor="middle">plan-layout</text><text class="lbl" x="620" y="172" text-anchor="middle">a proposal</text>
