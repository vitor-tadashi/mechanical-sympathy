<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-labelledby="t d">
<title id="t">Each execution context can interrupt every context below it on the same CPU</title>
<desc id="d">From most urgent to least: NMIs, hard interrupts and IPIs, softirqs that run on interrupt exit, kernel threads, and user threads by scheduling class. A user thread, however urgent, runs only when nothing above it wants the CPU.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(260px, 264px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(260px, 60px); } 8% { transform: translate(260px, 60px); } 14% { transform: translate(260px, 60px); } 18.24% { transform: translate(260px, 78px); } 24.24% { transform: translate(260px, 78px); } 38.82% { transform: translate(260px, 140px); } 44.82% { transform: translate(260px, 140px); } 59.41% { transform: translate(260px, 202px); } 65.41% { transform: translate(260px, 202px); } 80% { transform: translate(260px, 264px); } 86% { transform: translate(260px, 264px); } 100% { transform: translate(260px, 264px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 7.9% { fill: #ffc9c9; stroke-width: 1.5; } 10% { fill: #ff9b9b; stroke-width: 3; } 18%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 18.14% { fill: #ffc9c9; stroke-width: 1.5; } 20.24% { fill: #ff9b9b; stroke-width: 3; } 28.24%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 38.72% { fill: #cfe3ff; stroke-width: 1.5; } 40.82% { fill: #9cc3ff; stroke-width: 3; } 48.82%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .p5 { animation: p5 8s linear infinite; }
  @keyframes p5 { 0%, 59.31% { fill: #cfe3ff; stroke-width: 1.5; } 61.41% { fill: #9cc3ff; stroke-width: 3; } 69.41%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .p6 { animation: p6 8s linear infinite; }
  @keyframes p6 { 0%, 79.9% { fill: #c8f0d0; stroke-width: 1.5; } 80%, 97% { fill: #8fe0a0; stroke-width: 3; } 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .c7 { animation: c7 8s linear infinite; }
  @keyframes c7 { 0%, 79.9% { opacity: 0; } 80%, 100% { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5, .p6, .c7 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="324" rx="8"/>
<path class="wire" d="M260,60 L260,78" marker-end="url(#a)"/>
<path class="wire" d="M260,122 L260,140" marker-end="url(#a)"/>
<path class="wire" d="M260,184 L260,202" marker-end="url(#a)"/>
<path class="wire" d="M260,246 L260,264" marker-end="url(#a)"/>
<text class="note" x="500" y="42">most urgent</text>
<text class="note" x="500" y="290">least urgent</text>
<line class="wire" x1="480" y1="48" x2="480" y2="274" marker-end="url(#a)"/>
<rect class="wait p2" x="152.5" y="16" width="215" height="44" rx="5"/><text class="lbl" x="260" y="35" text-anchor="middle">NMI</text><text class="lbl" x="260" y="50" text-anchor="middle">watchdog, perf, machine check</text>
<rect class="wait p3" x="152.5" y="78" width="215" height="44" rx="5"/><text class="lbl" x="260" y="97" text-anchor="middle">Hard IRQ</text><text class="lbl" x="260" y="112" text-anchor="middle">device interrupt handler, IPIs</text>
<rect class="box p4" x="138" y="140" width="244" height="44" rx="5"/><text class="lbl" x="260" y="159" text-anchor="middle">Softirq</text><text class="lbl" x="260" y="174" text-anchor="middle">NET_RX, TIMER, RCU, ... on IRQ exit</text>
<rect class="box p5" x="147" y="202" width="226" height="44" rx="5"/><text class="lbl" x="260" y="221" text-anchor="middle">Kernel threads</text><text class="lbl" x="260" y="236" text-anchor="middle">ksoftirqd, kworker, rcuo, irq/NN</text>
<rect class="app p6" x="130" y="264" width="260" height="44" rx="5"/><text class="lbl" x="260" y="283" text-anchor="middle">User threads</text><text class="lbl" x="260" y="298" text-anchor="middle">by scheduling class: FIFO, then OTHER</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
<text class="done c7" x="500" y="306" text-anchor="start">runs when nothing above wants the CPU</text>
</svg>
