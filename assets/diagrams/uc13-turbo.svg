<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 261" width="760" height="261" role="img" aria-labelledby="t d">
<title id="t">Two identical hosts with different tails: turbo, thermal limits, measure both ways</title>
<desc id="d">Read the turbo state, watch the busy clock through a warm-up while the package temperature rises, and decide by measuring p99.9 with turbo on and off.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 167px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 16.06% { transform: translate(140px, 82.5px); } 22.06% { transform: translate(140px, 82.5px); } 32.91% { transform: translate(140px, 172px); } 38.91% { transform: translate(140px, 172px); } 50.97% { transform: translate(237px, 194px); } 54.24% { transform: translate(237px, 167px); } 74% { transform: translate(400px, 167px); } 80% { transform: translate(400px, 167px); } 100% { transform: translate(400px, 167px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.96% { fill: #ffffff; stroke-width: 1.5; } 18.06% { fill: #ffe9a8; stroke-width: 3; } 26.06%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 32.81% { fill: #ffffff; stroke-width: 1.5; } 34.91% { fill: #ffe9a8; stroke-width: 3; } 42.91%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #ffc9c9; stroke-width: 1.5; } 74%, 97% { fill: #ff9b9b; stroke-width: 3; } 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="261" rx="8"/>
<path class="walk" d="M140,49 L140,82.5" marker-end="url(#w)"/>
<path class="wire" d="M189,97 L400,97" marker-end="url(#a)"/>
<path class="walk" d="M140,111.5 L140,172" marker-end="url(#w)"/>
<path class="walk" d="M213,194 L237,194 L237,167 L400,167" marker-end="url(#w)"/>
<path class="wire" d="M213,194 L237,194 L237,221 L400,221" marker-end="url(#a)"/>
<rect class="foc" x="16.5" y="20" width="247" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Two identical hosts, different tails</text>
<polygon class="step p2" points="91,97 105,82.5 175,82.5 189,97 175,111.5 105,111.5"/><text class="lbl" x="140" y="101.5" text-anchor="middle">Turbo on?</text>
<rect class="mut" x="400" y="75" width="229" height="44" rx="5"/><text class="lbl" x="514.5" y="94" text-anchor="middle">Not turbo: compare the BIOS</text><text class="lbl" x="514.5" y="109" text-anchor="middle">and firmware versions (Guide 00)</text>
<polygon class="step p3" points="67,194 81,172 199,172 213,194 199,216 81,216"/><text class="lbl" x="140" y="191" text-anchor="middle">Bzy_MHz falls</text><text class="lbl" x="140" y="206" text-anchor="middle">as PkgTmp rises?</text>
<rect class="wait p4" x="400" y="145" width="244" height="44" rx="5"/><text class="lbl" x="522" y="164" text-anchor="middle">Thermal limit: cooling first,</text><text class="lbl" x="522" y="179" text-anchor="middle">then turbo off or a fixed clock (§3)</text>
<rect class="box" x="400" y="199" width="185" height="44" rx="5"/><text class="lbl" x="492.5" y="218" text-anchor="middle">Measure p99.9 with turbo</text><text class="lbl" x="492.5" y="233" text-anchor="middle">on and off (Guide 00 §4.3)</text>
<text class="el" x="221" y="92" text-anchor="start">no</text>
<text class="el" x="146" y="145.75" text-anchor="start">yes</text>
<text class="el" x="245" y="162" text-anchor="start">yes</text>
<text class="el" x="245" y="216" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
