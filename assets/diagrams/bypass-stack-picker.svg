<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 371" width="760" height="371" role="img" aria-labelledby="t d">
<title id="t">Pick a kernel-bypass stack from the NIC and whether the application can change</title>
<desc id="d">The NIC decides the family of stacks, and whether the application can change decides the stack. Solarflare or AMD: Onload, or ef_vi and DPDK. NVIDIA ConnectX: XLIO, or bifurcated DPDK. Intel: busy polling, ADQ or Onload over AF_XDP for an unmodified application, DPDK or AF_XDP otherwise. Virtio or cloud: the kernel stack with busy polling.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
