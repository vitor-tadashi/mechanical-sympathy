<path class="walk" d="M388,258.25 L406,258.25 L406,236 L470,236" marker-end="url(#w)"/>
<rect class="foc" x="17.5" y="15.5" width="97" height="29" rx="14.5"/><text class="lbl" x="66" y="34.5" text-anchor="middle">Pick a stack</text>
<polygon class="step p2" points="32.5,96 46.5,81.5 85.5,81.5 99.5,96 85.5,110.5 46.5,110.5"/><text class="lbl" x="66" y="100.5" text-anchor="middle">NIC?</text>
<rect class="app" x="470" y="38" width="88" height="29" rx="5"/><text class="lbl" x="514" y="57" text-anchor="middle">Onload (§5)</text>
<rect class="step" x="470" y="75" width="107" height="29" rx="5"/><text class="lbl" x="523.5" y="94" text-anchor="middle">ef_vi or DPDK</text>
<polygon class="step" points="302,71 316,49 374,49 388,71 374,93 316,93"/><text class="lbl" x="345" y="68" text-anchor="middle">App can</text><text class="lbl" x="345" y="83" text-anchor="middle">change?</text>
<rect class="step" x="470" y="126" width="79" height="29" rx="5"/><text class="lbl" x="509.5" y="145" text-anchor="middle">XLIO (§7)</text>
<rect class="step" x="470" y="163" width="128" height="29" rx="5"/><text class="lbl" x="534" y="182" text-anchor="middle">DPDK, bifurcated</text>
<polygon class="step" points="302,159 316,137 374,137 388,159 374,181 316,181"/><text class="lbl" x="345" y="156" text-anchor="middle">App can</text><text class="lbl" x="345" y="171" text-anchor="middle">change?</text>
<rect class="step p4" x="470" y="214" width="275" height="44" rx="5"/><text class="lbl" x="607.5" y="233" text-anchor="middle">Kernel stack + busy polling, ADQ on E810,</text><text class="lbl" x="607.5" y="248" text-anchor="middle">or evaluate Onload over AF_XDP (§7)</text>
<rect class="step" x="470" y="266" width="148" height="29" rx="5"/><text class="lbl" x="544" y="285" text-anchor="middle">DPDK (§6) or AF_XDP</text>
<polygon class="step p3" points="302,258.25 316,236.25 374,236.25 388,258.25 374,280.25 316,280.25"/><text class="lbl" x="345" y="255.25" text-anchor="middle">App can</text><text class="lbl" x="345" y="270.25" text-anchor="middle">change?</text>
<rect class="step" x="470" y="316.5" width="189" height="29" rx="5"/><text class="lbl" x="564.5" y="335.5" text-anchor="middle">Kernel stack + busy polling</text>
<text class="el" x="76" y="65" text-anchor="start">Solarflare / AMD (sfc)</text>
