<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Each NIC role sends its interrupts to a chosen housekeeping CPU</title>
<desc id="d">Both critical NICs sit on NUMA node 1 and send their interrupts to CPU 1, the node's only housekeeping CPU. The timing and management NICs on node 0 interrupt CPU 0, and the two bulk NICs interrupt CPU 30, away from everything critical.</desc>
