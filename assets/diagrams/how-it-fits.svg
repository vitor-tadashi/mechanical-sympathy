<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" width="760" height="398" role="img" aria-labelledby="t d">
<title id="t">One config file drives everything, applied once, re-applied every boot, then verified</title>
<desc id="d">lowlat.conf holds the CPU layout, the NIC roles and the huge pages per node. Persistent settings are applied once and take effect at the next boot. Runtime settings are re-applied at every boot by lowlat-runtime.service. The application launcher pins its threads last, verify-tuning checks the result, and the day-2 timer repeats that check daily and after every boot.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
