<path class="foc" d="M215,20 a165,6 0 0 1 330,0 v30 a165,6 0 0 1 -330,0 z"/><path class="sl" d="M215,20 a165,6 0 0 0 330,0"/><text class="sm" x="380" y="32.5" text-anchor="middle">/etc/lowlat/lowlat.conf</text><text class="sm" x="380" y="46.5" text-anchor="middle">CPU layout · NIC roles · huge pages per node</text>
<rect class="box p2" x="30" y="78" width="700" height="84" rx="5"/><text class="sm" x="380" y="96.5" text-anchor="middle">Apply once, then reboot (persistent)</text><text class="sm" x="380" y="110.5" text-anchor="middle">00 BIOS setup (by hand) · 01 kernel command line: isolcpus, nohz_full, rcu_nocbs, idle=poll, THP off</text><text class="sm" x="380" y="124.5" text-anchor="middle">02 systemd CPUAffinity, RT limits · 03 huge pages per NUMA node</text><text class="sm" x="380" y="138.5" text-anchor="middle">05 housekeeping.slice · 06 sysctl profile · 07 services, limits, noatime, tuned · 10 time sync</text><text class="sm" x="380" y="152.5" text-anchor="middle">12 swap off, OOM order and memlock of the latency services</text>
<rect class="box p3" x="30" y="184" width="700" height="56" rx="5"/><text class="sm" x="380" y="202.5" text-anchor="middle">Every boot: lowlat-runtime.service</text><text class="sm" x="380" y="216.5" text-anchor="middle">00 PCIe power policy · 02 workqueue cpumask · 08 DPDK port binding</text><text class="sm" x="380" y="230.5" text-anchor="middle">04 NIC coalescing, offloads, IRQ affinity · 05 pin agents · 07 opt-in firewall and modules · 12 zswap off</text>
<rect class="app p4" x="30" y="262" width="700" height="56" rx="5"/><text class="sm" x="380" y="280.5" text-anchor="middle">Application launcher</text><text class="sm" x="380" y="294.5" text-anchor="middle">JVM options by host class · large pages, NUMA, pre-touch when pinned</text><text class="sm" x="380" y="308.5" text-anchor="middle">threads pinned to isolated CPUs · busy-spin idle strategy</text>
<polygon class="step p5" points="158.5,361 172.5,340 307.5,340 321.5,361 307.5,382 172.5,382"/><text class="sm" x="240" y="358.5" text-anchor="middle">scripts/verify-tuning</text><text class="sm" x="240" y="372.5" text-anchor="middle">PASS / WARN / FAIL</text>
<rect class="box p6" x="454" y="340" width="212" height="42" rx="5"/><text class="sm" x="560" y="358.5" text-anchor="middle">11 Day-2: lowlat-verify.timer</text><text class="sm" x="560" y="372.5" text-anchor="middle">daily and 10 min after every boot</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
