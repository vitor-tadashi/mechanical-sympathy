<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 158" width="760" height="158" role="img" aria-labelledby="t d">
<title id="t">Where Guide 08 sits in the tuning order</title>
<desc id="d">The tuning order starts with a baseline measurement from Guide 09, then runs Guides 00 to 08. Guide 08 is highlighted as the current step. Guide 08, kernel bypass, is optional.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(722px, 74px); animation: k1 6s linear infinite; }
  @keyframes k1 { 0% { transform: translate(58px, 74px); } 8% { transform: translate(58px, 74px); } 75.5% { transform: translate(722px, 74px); } 100% { transform: translate(722px, 74px); } }
  .p2 { animation: p2 6s linear infinite; }
  @keyframes p2 { 0%, 75.4% { fill: #ffd166; stroke-width: 1.5; } 75.5%, 97% { fill: #ffb703; stroke-width: 3; } 100% { fill: #ffd166; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="158" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="138" rx="6"/>
<text class="cap" x="24" y="34">Tuning order: measure first, then 00 to 08</text>
<text class="sub" x="24" y="52">The highlighted box is this guide, 08. The dotted arrow marks Guide 08 as optional.</text>
<path class="wire" d="M96,100 L107,100" marker-end="url(#a)"/>
<path class="wire" d="M169,100 L180,100" marker-end="url(#a)"/>
<path class="wire" d="M242,100 L253,100" marker-end="url(#a)"/>
<path class="wire" d="M315,100 L326,100" marker-end="url(#a)"/>
<path class="wire" d="M388,100 L399,100" marker-end="url(#a)"/>
<path class="wire" d="M461,100 L472,100" marker-end="url(#a)"/>
<path class="wire" d="M534,100 L545,100" marker-end="url(#a)"/>
<path class="wire" d="M607,100 L618,100" marker-end="url(#a)"/>
<path class="wire dash" d="M680,100 L691,100" marker-end="url(#a)"/>
<rect class="step" x="20" y="74" width="76" height="52" rx="26"/><text class="sm" x="58" y="97.5" text-anchor="middle">Step 0</text><text class="sm" x="58" y="111.5" text-anchor="middle">09 Measure</text>
<rect class="step" x="107" y="74" width="62" height="52" rx="5"/><text class="lbl" x="138" y="97" text-anchor="middle">00</text><text class="lbl" x="138" y="112" text-anchor="middle">BIOS</text>
<rect class="step" x="180" y="74" width="62" height="52" rx="5"/><text class="lbl" x="211" y="97" text-anchor="middle">01</text><text class="lbl" x="211" y="112" text-anchor="middle">GRUB</text>
<rect class="step" x="253" y="74" width="62" height="52" rx="5"/><text class="lbl" x="284" y="97" text-anchor="middle">02</text><text class="lbl" x="284" y="112" text-anchor="middle">CPUs</text>
<rect class="step" x="326" y="74" width="62" height="52" rx="5"/><text class="sm" x="357" y="90.5" text-anchor="middle">03</text><text class="sm" x="357" y="104.5" text-anchor="middle">Huge</text><text class="sm" x="357" y="118.5" text-anchor="middle">pages</text>
<rect class="step" x="399" y="74" width="62" height="52" rx="5"/><text class="sm" x="430" y="97.5" text-anchor="middle">04</text><text class="sm" x="430" y="111.5" text-anchor="middle">Network</text>
<rect class="step" x="472" y="74" width="62" height="52" rx="5"/><text class="sm" x="503" y="97.5" text-anchor="middle">05</text><text class="sm" x="503" y="111.5" text-anchor="middle">cgroups</text>
<rect class="step" x="545" y="74" width="62" height="52" rx="5"/><text class="lbl" x="576" y="97" text-anchor="middle">06</text><text class="lbl" x="576" y="112" text-anchor="middle">sysctl</text>
<rect class="step" x="618" y="74" width="62" height="52" rx="5"/><text class="lbl" x="649" y="97" text-anchor="middle">07</text><text class="lbl" x="649" y="112" text-anchor="middle">Hygiene</text>
<rect class="foc p2" x="691" y="74" width="62" height="52" rx="5"/><text class="lbl" x="722" y="97" text-anchor="middle">08</text><text class="lbl" x="722" y="112" text-anchor="middle">Bypass</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
</svg>
