<path class="walk" d="M140,119 L140,164.5" marker-end="url(#w)"/>
<path class="wire" d="M189,186.5 L213,186.5 L213,159.5 L440,159.5" marker-end="url(#a)"/>
<path class="walk" d="M189,186.5 L213,186.5 L213,206 L440,206" marker-end="url(#w)"/>
<rect class="foc" x="77" y="20" width="126" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">One latency host</text>
<polygon class="step p2" points="96.5,97 110.5,75 169.5,75 183.5,97 169.5,119 110.5,119"/><text class="lbl" x="140" y="94" text-anchor="middle">Threads</text><text class="lbl" x="140" y="109" text-anchor="middle">block?</text>
<rect class="foc" x="440" y="75" width="199" height="44" rx="5"/><text class="lbl" x="539.5" y="94" text-anchor="middle">kernel-rt + realtime profile</text><text class="lbl" x="539.5" y="109" text-anchor="middle">+ Guides 00, 03 to 12</text>
<polygon class="step p3" points="91,186.5 105,164.5 175,164.5 189,186.5 175,208.5 105,208.5"/><text class="lbl" x="140" y="183.5" text-anchor="middle">Only CPU</text><text class="lbl" x="140" y="198.5" text-anchor="middle">isolation?</text>
<rect class="foc" x="440" y="145" width="125" height="29" rx="5"/><text class="lbl" x="502.5" y="164" text-anchor="middle">cpu-partitioning</text>
<rect class="foc p4" x="440" y="184" width="152" height="44" rx="5"/><text class="lbl" x="516" y="203" text-anchor="middle">Guides 00 to 12</text><text class="lbl" x="516" y="218" text-anchor="middle">(low-latency profile)</text>
<text class="el" x="215.5" y="92" text-anchor="start">yes, worst wake-up matters most</text>
<text class="el" x="146" y="145.75" text-anchor="start">no, they spin</text>
<text class="el" x="221" y="154.5" text-anchor="start">yes, vendor support required</text>
<text class="el" x="221" y="201" text-anchor="start">no: NICs, huge pages, agents, drift</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
