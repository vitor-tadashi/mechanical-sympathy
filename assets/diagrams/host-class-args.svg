<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="t d">
<title id="t">The host class decides which boot parameters the script writes</title>
<desc id="d">The script detects the host class. Bare metal gets the latency subset and the isolation set, a VM gets only the latency subset, and a container is refused because its kernel belongs to the host.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 42px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0%, 5.8% { transform: translate(164.5px, 96px); opacity: 0; } 6% { transform: translate(164.5px, 96px); opacity: 1; } 7.74% { transform: translate(188.5px, 96px); opacity: 1; } 11.65% { transform: translate(188.5px, 42px); opacity: 1; } 26.97% { transform: translate(400px, 42px); opacity: 1; } 30.47% { transform: translate(400px, 42px); opacity: 1; } 30.67%, 100% { transform: translate(400px, 42px); opacity: 0; } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 26.87% { fill: #c8f0d0; stroke-width: 1.5; } 28.97% { fill: #8fe0a0; stroke-width: 3; } 36.97%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .k3 { transform: translate(400px, 96px); animation: k3 7s linear infinite; }
  @keyframes k3 { 0%, 30.47% { transform: translate(164.5px, 96px); opacity: 0; } 30.67% { transform: translate(164.5px, 96px); opacity: 1; } 51.63% { transform: translate(400px, 96px); opacity: 1; } 55.13% { transform: translate(400px, 96px); opacity: 1; } 55.33%, 100% { transform: translate(400px, 96px); opacity: 0; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 51.53% { fill: #cfe3ff; stroke-width: 1.5; } 53.63% { fill: #9cc3ff; stroke-width: 3; } 61.63%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k5 { transform: translate(400px, 150px); animation: k5 7s linear infinite; }
  @keyframes k5 { 0%, 55.13% { transform: translate(164.5px, 96px); opacity: 0; } 55.33% { transform: translate(164.5px, 96px); opacity: 1; } 57.07% { transform: translate(188.5px, 96px); opacity: 1; } 60.98% { transform: translate(188.5px, 150px); opacity: 1; } 76.3% { transform: translate(400px, 150px); opacity: 1; } 79.8% { transform: translate(400px, 150px); opacity: 1; } 80%, 100% { transform: translate(400px, 150px); opacity: 0; } }
  .p6 { animation: p6 7s linear infinite; }
  @keyframes p6 { 0%, 76.2% { fill: #eeeeee; stroke-width: 1.5; } 78.3% { fill: #d4d4d4; stroke-width: 3; } 86.3%, 100% { fill: #eeeeee; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="190" rx="8"/>
<path class="wire" d="M164.5,96 L188.5,96 L188.5,42 L400,42" marker-end="url(#a)"/>
<path class="wire" d="M164.5,96 L400,96" marker-end="url(#a)"/>
<path class="wire" d="M164.5,96 L188.5,96 L188.5,150 L400,150" marker-end="url(#a)"/>
<polygon class="step" points="55.5,96 69.5,81.5 150.5,81.5 164.5,96 150.5,110.5 69.5,110.5"/><text class="lbl" x="110" y="100.5" text-anchor="middle">Host class?</text>
<rect class="app p2" x="400" y="20" width="118" height="44" rx="5"/><text class="lbl" x="459" y="39" text-anchor="middle">Latency subset</text><text class="lbl" x="459" y="54" text-anchor="middle">+ isolation set</text>
<rect class="box p4" x="400" y="74" width="221" height="44" rx="5"/><text class="lbl" x="510.5" y="93" text-anchor="middle">Latency subset only:</text><text class="lbl" x="510.5" y="108" text-anchor="middle">idle=poll, C-state caps, THP off</text>
<rect class="mut p6" x="400" y="128" width="202" height="44" rx="5"/><text class="lbl" x="501" y="147" text-anchor="middle">Refuse:</text><text class="lbl" x="501" y="162" text-anchor="middle">tune the host kernel instead</text>
<text class="el" x="196.5" y="37" text-anchor="start">bare_metal</text>
<text class="el" x="196.5" y="91" text-anchor="start">virtual_machine</text>
<text class="el" x="196.5" y="145" text-anchor="start">container / unknown</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<circle class="tok k3" cx="0" cy="0" r="6"/>
<circle class="tok k5" cx="0" cy="0" r="6"/>
</svg>
