<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting memory: swap that came back, a kill, or pressure without a kill</title>
<desc id="d">Start from what the host shows: swap that came back after a reboot, an OOM kill in the journal, or pressure without a kill. Each branch ends at a fix.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 167px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 15.15% { transform: translate(140px, 75px); } 21.15% { transform: translate(140px, 75px); } 32.9% { transform: translate(140px, 172px); } 38.9% { transform: translate(140px, 172px); } 50.07% { transform: translate(229.5px, 194px); } 53.34% { transform: translate(229.5px, 167px); } 74% { transform: translate(400px, 167px); } 80% { transform: translate(400px, 167px); } 100% { transform: translate(400px, 167px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.05% { fill: #ffffff; stroke-width: 1.5; } 17.15% { fill: #ffe9a8; stroke-width: 3; } 25.15%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 32.8% { fill: #ffffff; stroke-width: 1.5; } 34.9% { fill: #ffe9a8; stroke-width: 3; } 42.9%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="386" rx="8"/>
<path class="walk" d="M140,49 L140,75" marker-end="url(#w)"/>
<path class="wire" d="M203,97 L400,97" marker-end="url(#a)"/>
<path class="walk" d="M140,119 L140,172" marker-end="url(#w)"/>
<path class="walk" d="M205.5,194 L229.5,194 L229.5,167 L400,167" marker-end="url(#w)"/>
<path class="wire" d="M205.5,194 L229.5,194 L229.5,221 L400,221" marker-end="url(#a)"/>
<path class="wire" d="M140,216 L140,269" marker-end="url(#a)"/>
<path class="wire" d="M202.5,291 L400,291" marker-end="url(#a)"/>
<path class="wire" d="M140,313 L140,339" marker-end="url(#a)"/>
<rect class="foc" x="75" y="20" width="130" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Memory symptom</text>
<polygon class="step p2" points="77,97 91,75 189,75 203,97 189,119 91,119"/><text class="lbl" x="140" y="94" text-anchor="middle">Swap active</text><text class="lbl" x="140" y="109" text-anchor="middle">after reboot?</text>
<rect class="box" x="400" y="75" width="246" height="44" rx="5"/><text class="lbl" x="523" y="94" text-anchor="middle">A swap unit not in fstab: systemctl</text><text class="lbl" x="523" y="109" text-anchor="middle">list-units --type=swap, mask it</text>
<polygon class="step p3" points="74.5,194 88.5,172 191.5,172 205.5,194 191.5,216 88.5,216"/><text class="lbl" x="140" y="191" text-anchor="middle">OOM kills</text><text class="lbl" x="140" y="206" text-anchor="middle">in the journal?</text>
<rect class="box p4" x="400" y="145" width="249" height="44" rx="5"/><text class="lbl" x="524.5" y="164" text-anchor="middle">Working as intended:</text><text class="lbl" x="524.5" y="179" text-anchor="middle">raise its MemoryMax or fix the leak</text>
<rect class="wait" x="400" y="199" width="251" height="44" rx="5"/><text class="lbl" x="525.5" y="218" text-anchor="middle">It is the one growing:</text><text class="lbl" x="525.5" y="233" text-anchor="middle">check its heap and off-heap memory</text>
<polygon class="step" points="77.5,291 91.5,269 188.5,269 202.5,291 188.5,313 91.5,313"/><text class="lbl" x="140" y="288" text-anchor="middle">PSI or pswpin</text><text class="lbl" x="140" y="303" text-anchor="middle">WARN?</text>
<rect class="box" x="400" y="269" width="166" height="44" rx="5"/><text class="lbl" x="483" y="288" text-anchor="middle">Pressure without OOM:</text><text class="lbl" x="483" y="303" text-anchor="middle">size the host, §3</text>
<rect class="mut" x="68" y="339" width="144" height="29" rx="5"/><text class="lbl" x="140" y="358" text-anchor="middle">See the table below</text>
<text class="el" x="235" y="92" text-anchor="start">yes</text>
<text class="el" x="146" y="149.5" text-anchor="start">no</text>
<text class="el" x="237.5" y="162" text-anchor="start">an agent</text>
<text class="el" x="237.5" y="216" text-anchor="start">the latency service</text>
<text class="el" x="146" y="246.5" text-anchor="start">no</text>
<text class="el" x="234.5" y="286" text-anchor="start">yes</text>
<text class="el" x="146" y="330" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
