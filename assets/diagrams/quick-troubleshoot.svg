<path class="wire" d="M189.5,256.5 L213.5,256.5 L213.5,229.5 L400,229.5" marker-end="url(#a)"/>
<path class="wire" d="M189.5,256.5 L213.5,256.5 L213.5,276 L400,276" marker-end="url(#a)"/>
<path class="wire" d="M140,271 L140,324" marker-end="url(#a)"/>
<path class="wire" d="M200,346 L400,346" marker-end="url(#a)"/>
<path class="wire" d="M140,368 L140,394" marker-end="url(#a)"/>
<rect class="foc" x="26.5" y="20" width="227" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Something is wrong after tuning</text>
<polygon class="step p2" points="100,97 114,82.5 166,82.5 180,97 166,111.5 114,111.5"/><text class="lbl" x="140" y="101.5" text-anchor="middle">Boots?</text>
<rect class="wait" x="400" y="75" width="327" height="44" rx="5"/><text class="lbl" x="563.5" y="94" text-anchor="middle">GRUB menu, e, remove the last added arguments,</text><text class="lbl" x="563.5" y="109" text-anchor="middle">Ctrl-x. Then 01-grub-bootloader --rollback</text>
<polygon class="step p3" points="90.5,167 104.5,152.5 175.5,152.5 189.5,167 175.5,181.5 104.5,181.5"/><text class="lbl" x="140" y="171.5" text-anchor="middle">SSH slow?</text>
<rect class="box p4" x="400" y="145" width="278" height="44" rx="5"/><text class="lbl" x="539" y="164" text-anchor="middle">Too few OS CPUs: check mpstat -P ALL 1,</text><text class="lbl" x="539" y="179" text-anchor="middle">give CPUs back in lowlat.conf</text>
<polygon class="step" points="90.5,256.5 104.5,242 175.5,242 189.5,256.5 175.5,271 104.5,271"/><text class="lbl" x="140" y="261" text-anchor="middle">App fails?</text>
<rect class="box" x="400" y="215" width="188" height="29" rx="5"/><text class="lbl" x="494" y="234" text-anchor="middle">cpuset trap: Guide 05 §4.4</text>
<rect class="box" x="400" y="254" width="250" height="44" rx="5"/><text class="lbl" x="525" y="273" text-anchor="middle">Pool on the wrong node or too small:</text><text class="lbl" x="525" y="288" text-anchor="middle">Guide 03 §9</text>
<polygon class="step" points="80,346 94,324 186,324 200,346 186,368 94,368"/><text class="lbl" x="140" y="343" text-anchor="middle">NIC settings</text><text class="lbl" x="140" y="358" text-anchor="middle">lost at boot?</text>
<rect class="box" x="400" y="331.5" width="233" height="29" rx="5"/><text class="lbl" x="516.5" y="350.5" text-anchor="middle">systemctl status lowlat-runtime</text>
<rect class="mut" x="31" y="394" width="218" height="29" rx="5"/><text class="lbl" x="140" y="413" text-anchor="middle">Find the row in the table below</text>
<text class="el" x="212" y="92" text-anchor="start">no</text>
<text class="el" x="146" y="136" text-anchor="start">yes</text>
<text class="el" x="221.5" y="162" text-anchor="start">yes</text>
<text class="el" x="146" y="215.75" text-anchor="start">no</text>
<text class="el" x="221.5" y="224.5" text-anchor="start">cannot pin threads</text>
<text class="el" x="221.5" y="271" text-anchor="start">JVM large pages fail</text>
<text class="el" x="146" y="301.5" text-anchor="start">no</text>
<text class="el" x="232" y="341" text-anchor="start">yes</text>
<text class="el" x="146" y="385" text-anchor="start">no</text>
