<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d">
<title id="t">Software timestamps land late by a varying delay; hardware timestamps sit on the wire</title>
<desc id="d">Three PTP packets cross the wire at even intervals. A software timestamp is taken only after the interrupt, the softirq and the scheduling delay, which differ for every packet, so the stamps are late and uneven. A hardware timestamp is taken by the NIC as the packet crosses the wire, so every stamp matches the real crossing time.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .wire { stroke: #57606a; stroke-width: 2; }
  .guide { stroke: #57606a; stroke-width: 1; stroke-dasharray: 2 3; }
  .pkt { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .sw { fill: #9b1c1c; }
  .hw { fill: #1d6b33; }
  .late { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; text-anchor: middle; }
  .ok { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d6b33; text-anchor: middle; }

  /* The picture is always complete. A playhead sweeps both lanes, and each event pulses as it passes:
     the packet on the wire, the hardware stamp at the same moment, the software stamp later. */
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  .pkt, .sw, .hw, .wait { transform-box: fill-box; transform-origin: center; animation: 6s linear infinite; }
  .pkt { animation-name: pkt; }
  .sw { animation-name: sw; }
  .hw { animation-name: hw; }
  .w1 { animation-name: w1; }
  .w2 { animation-name: w2; }
  .w3 { animation-name: w3; }

  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes pkt {
    0%, 3%   { fill: #ffb000; transform: scale(1.5); }
    6%, 100% { fill: #8a5a00; transform: scale(1); }
  }
  @keyframes sw {
    0%, 3%   { fill: #ff3b3b; transform: scaleY(1.3); }
    6%, 100% { fill: #9b1c1c; transform: scaleY(1); }
  }
  @keyframes hw {
    0%, 3%   { fill: #2fbf5a; transform: scaleY(1.3); }
    6%, 100% { fill: #1d6b33; transform: scaleY(1); }
  }
  /* Each delay bar stays lit while the playhead crosses it: the time the packet waits for its software stamp. */
  @keyframes w1 { 0%, 6.6% { fill: #ff6b6b; } 7.6%, 100% { fill: #ffc9c9; } }
  @keyframes w2 { 0%, 15% { fill: #ff6b6b; } 16%, 100% { fill: #ffc9c9; } }
  @keyframes w3 { 0%, 3.1% { fill: #ff6b6b; } 4.1%, 100% { fill: #ffc9c9; } }

  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .head, .pkt, .sw, .hw, .wait, .w1, .w2, .w3 { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="290" rx="8"/>

<!-- Lane 1: software timestamps -->
<rect class="lane" x="10" y="10" width="740" height="125" rx="6"/>
<text class="cap" x="24" y="34">Software timestamps</text>
<text class="sub" x="24" y="52">The kernel stamps the packet after the IRQ, the softirq and scheduling: late, and by a different amount each time.</text>
<text class="lbl" x="24" y="82">wire</text>
<text class="lbl" x="24" y="112">stamp</text>
<line class="wire" x1="150" y1="78" x2="720" y2="78"/>
<line class="guide" x1="230" y1="86" x2="230" y2="118"/>
<line class="guide" x1="420" y1="86" x2="420" y2="118"/>
<line class="guide" x1="610" y1="86" x2="610" y2="118"/>
<rect class="wait w1" style="animation-delay:-5.16s" x="230" y="102" width="38" height="12" rx="2"/>
<rect class="wait w2" style="animation-delay:-3.16s" x="420" y="102" width="86" height="12" rx="2"/>
<rect class="wait w3" style="animation-delay:-1.16s" x="610" y="102" width="18" height="12" rx="2"/>
<rect class="sw" style="animation-delay:-4.75s" x="267" y="94" width="4" height="26" rx="1"/>
<rect class="sw" style="animation-delay:-2.24s" x="505" y="94" width="4" height="26" rx="1"/>
<rect class="sw" style="animation-delay:-0.96s" x="627" y="94" width="4" height="26" rx="1"/>
<path class="pkt" style="animation-delay:-5.16s" d="M230 71 l7 7 l-7 7 l-7 -7 z"/>
<path class="pkt" style="animation-delay:-3.16s" d="M420 71 l7 7 l-7 7 l-7 -7 z"/>
<path class="pkt" style="animation-delay:-1.16s" d="M610 71 l7 7 l-7 7 l-7 -7 z"/>
<text class="late" x="463" y="130">red = how late each software stamp is: never the same twice</text>

<!-- Lane 2: hardware timestamps -->
<rect class="lane" x="10" y="150" width="740" height="125" rx="6"/>
<text class="cap" x="24" y="174">Hardware timestamps (ethtool -T: hardware-receive)</text>
<text class="sub" x="24" y="192">The NIC stamps the packet as it crosses the wire. The stack's delays never reach the stamp.</text>
<text class="lbl" x="24" y="222">wire</text>
<text class="lbl" x="24" y="252">stamp</text>
<line class="wire" x1="150" y1="218" x2="720" y2="218"/>
<line class="guide" x1="230" y1="226" x2="230" y2="258"/>
<line class="guide" x1="420" y1="226" x2="420" y2="258"/>
<line class="guide" x1="610" y1="226" x2="610" y2="258"/>
<rect class="hw" style="animation-delay:-5.16s" x="228" y="234" width="4" height="26" rx="1"/>
<rect class="hw" style="animation-delay:-3.16s" x="418" y="234" width="4" height="26" rx="1"/>
<rect class="hw" style="animation-delay:-1.16s" x="608" y="234" width="4" height="26" rx="1"/>
<path class="pkt" style="animation-delay:-5.16s" d="M230 211 l7 7 l-7 7 l-7 -7 z"/>
<path class="pkt" style="animation-delay:-3.16s" d="M420 211 l7 7 l-7 7 l-7 -7 z"/>
<path class="pkt" style="animation-delay:-1.16s" d="M610 211 l7 7 l-7 7 l-7 -7 z"/>
<text class="ok" x="463" y="270">every stamp is exactly on the wire crossing</text>

<line class="head" x1="150" y1="62" x2="150" y2="262"/>
</svg>
