<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 463" width="760" height="463" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting bypass: is it accelerated, where are its interrupts, are the ports bound</title>
<desc id="d">For Onload, first check that the process is accelerated at all, then where its interrupts land. For DPDK, check the IOMMU, then the IOMMU group, then huge pages on the NIC's node.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(455px, 231px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(80px, 49px); } 6% { transform: translate(80px, 49px); } 12% { transform: translate(80px, 49px); } 14.3% { transform: translate(80px, 75px); } 20.3% { transform: translate(80px, 75px); } 27.23% { transform: translate(80px, 153.5px); } 34.38% { transform: translate(161px, 153.5px); } 40.38% { transform: translate(161px, 153.5px); } 48.91% { transform: translate(240px, 209px); } 54.91% { transform: translate(240px, 209px); } 74% { transform: translate(455px, 231px); } 80% { transform: translate(455px, 231px); } 100% { transform: translate(455px, 231px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 14.2% { fill: #ffffff; stroke-width: 1.5; } 16.3% { fill: #ffe9a8; stroke-width: 3; } 24.3%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 34.28% { fill: #ffffff; stroke-width: 1.5; } 36.38% { fill: #ffe9a8; stroke-width: 3; } 44.38%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 48.81% { fill: #ffffff; stroke-width: 1.5; } 50.91% { fill: #ffe9a8; stroke-width: 3; } 58.91%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 8s linear infinite; }
  @keyframes p5 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="463" rx="8"/>
<path class="walk" d="M80,49 L80,75" marker-end="url(#w)"/>
<path class="wire" d="M319,153.5 L455,153.5" marker-end="url(#a)"/>
<path class="walk" d="M240,175.5 L240,209" marker-end="url(#w)"/>
<path class="walk" d="M301,231 L455,231" marker-end="url(#w)"/>
<path class="wire" d="M240,253 L240,279" marker-end="url(#a)"/>
<path class="walk" d="M80,104 L80,153.5 L161,153.5" marker-end="url(#w)"/>
<path class="wire" d="M300,391.5 L324,391.5 L324,352.5 L455,352.5" marker-end="url(#a)"/>
<path class="wire" d="M300,391.5 L455,391.5" marker-end="url(#a)"/>
<path class="wire" d="M300,391.5 L324,391.5 L324,430.5 L455,430.5" marker-end="url(#a)"/>
<path class="wire" d="M80,104 L80,391.5 L180,391.5" marker-end="url(#a)"/>
<rect class="foc" x="8" y="20" width="144" height="29" rx="14.5"/><text class="lbl" x="80" y="39" text-anchor="middle">Bypass not working</text>
<polygon class="step p2" points="20.5,89.5 34.5,75 125.5,75 139.5,89.5 125.5,104 34.5,104"/><text class="lbl" x="80" y="94" text-anchor="middle">Which stack?</text>
<polygon class="step p3" points="161,153.5 175,131.5 305,131.5 319,153.5 305,175.5 175,175.5"/><text class="lbl" x="240" y="150.5" text-anchor="middle">Stack in</text><text class="lbl" x="240" y="165.5" text-anchor="middle">onload_stackdump?</text>
<rect class="box" x="455" y="124" width="261" height="59" rx="5"/><text class="lbl" x="585.5" y="143" text-anchor="middle">Not accelerated: the launcher skipped</text><text class="lbl" x="585.5" y="158" text-anchor="middle">the prefix; check LD_PRELOAD</text><text class="lbl" x="585.5" y="173" text-anchor="middle">in /proc/pid/environ</text>
<polygon class="step p4" points="179,231 193,209 287,209 301,231 287,253 193,253"/><text class="lbl" x="240" y="228" text-anchor="middle">IRQs on an</text><text class="lbl" x="240" y="243" text-anchor="middle">isolated CPU?</text>
<rect class="box p5" x="455" y="209" width="266" height="44" rx="5"/><text class="lbl" x="588" y="228" text-anchor="middle">Onload vectors created late:</text><text class="lbl" x="588" y="243" text-anchor="middle">04-network --runtime after start-up</text>
<rect class="mut" x="168" y="279" width="144" height="29" rx="5"/><text class="lbl" x="240" y="298" text-anchor="middle">See the table below</text>
<polygon class="step" points="180,391.5 194,377 286,377 300,391.5 286,406 194,406"/><text class="lbl" x="240" y="396" text-anchor="middle">Ports bound?</text>
<rect class="box" x="455" y="338" width="262" height="29" rx="5"/><text class="lbl" x="586" y="357" text-anchor="middle">Reboot with intel_iommu=on iommu=pt</text>
<rect class="box" x="455" y="377" width="200" height="29" rx="5"/><text class="lbl" x="555" y="396" text-anchor="middle">Bind the whole IOMMU group</text>
<rect class="box" x="455" y="416" width="228" height="29" rx="5"/><text class="lbl" x="569" y="435" text-anchor="middle">--socket-mem on the NIC's node</text>
<text class="el" x="351" y="148.5" text-anchor="start">no</text>
<text class="el" x="246" y="196.25" text-anchor="start">yes</text>
<text class="el" x="333" y="226" text-anchor="start">yes</text>
<text class="el" x="246" y="270" text-anchor="start">no</text>
<text class="el" x="90" y="147.5" text-anchor="start">Onload</text>
<text class="el" x="332" y="347.5" text-anchor="start">IOMMU off warning</text>
<text class="el" x="332" y="386.5" text-anchor="start">group not viable</text>
<text class="el" x="332" y="425.5" text-anchor="start">yes, no hugepages</text>
<text class="el" x="90" y="385.5" text-anchor="start">DPDK</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
