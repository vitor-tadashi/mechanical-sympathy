  .p9 { animation: p9 10s linear infinite; }
  @keyframes p9 { 0%, 72.84% { fill: #c8f0d0; stroke-width: 1.5; } 74.94% { fill: #8fe0a0; stroke-width: 3; } 80.94%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .h1, .p2, .p3, .p4, .p5, .p6, .p7, .p8, .p9 { animation: none; }
    .h1 { display: none; }
  }
</style>
