<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Stock to tuned in one afternoon: prepare, apply with one reboot, check</title>
<desc id="d">Scenario A, first host, from 09:00: about two hours to take the baseline, design the CPU layout and check the security sign-off, under an hour to dry-run, apply and reboot once for Guides 01, 02 and 03, then about 90 minutes to verify and run the application against the baseline. The times are indicative.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
