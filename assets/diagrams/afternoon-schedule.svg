<text class="sm" x="26" y="218">Reboot (01, 02, 03)</text>
<text class="cap" x="18" y="244">Check</text>
<text class="sm" x="26" y="266">verify-tuning and rtla osnoise</text>
<text class="sm" x="26" y="292">Application launch and latency run</text>
