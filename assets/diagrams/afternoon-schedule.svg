<text class="cap" x="18" y="44">Prepare</text>
<text class="sm" x="26" y="66">Baseline and verify-tuning report</text>
<text class="sm" x="26" y="92">CPU layout and lowlat.conf</text>
<text class="sm" x="26" y="118">Security sign-off check</text>
<text class="cap" x="18" y="144">Apply</text>
<text class="sm" x="26" y="166">apply-all --dry-run and review</text>
