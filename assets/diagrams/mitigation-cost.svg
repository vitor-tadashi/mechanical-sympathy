  .p8 { animation: p8 8s linear infinite; }
  @keyframes p8 { 0%, 77.12% { fill: #ffc9c9; stroke-width: 1.5; } 79.22% { fill: #ff9b9b; stroke-width: 3; } 87.22%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
