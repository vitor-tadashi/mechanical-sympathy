<rect class="step" x="200" y="28" width="200" height="46" rx="5"/><text class="lbl" x="300" y="48" text-anchor="middle">spins in user space,</text><text class="lbl" x="300" y="63" text-anchor="middle">kernel bypass</text>
<rect class="app p2" x="455" y="28" width="230" height="46" rx="5"/><text class="lbl" x="570" y="55.5" text-anchor="middle">almost no cost</text>
<rect class="step" x="200" y="90" width="200" height="46" rx="5"/><text class="lbl" x="300" y="110" text-anchor="middle">one syscall per message</text><text class="lbl" x="300" y="125" text-anchor="middle">recv, send, epoll</text>
<rect class="wait p4" x="455" y="90" width="230" height="46" rx="5"/><text class="lbl" x="570" y="110" text-anchor="middle">entry and exit cost</text><text class="lbl" x="570" y="125" text-anchor="middle">on every message</text>
<rect class="step" x="200" y="152" width="200" height="46" rx="5"/><text class="lbl" x="300" y="172" text-anchor="middle">blocks and wakes</text><text class="lbl" x="300" y="187" text-anchor="middle">context switch</text>
