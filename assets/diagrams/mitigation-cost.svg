<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" role="img" aria-labelledby="t d">
<title id="t">The cost of mitigations follows the crossings a thread makes</title>
<desc id="d">A thread that spins in user space or uses kernel bypass pays almost nothing. One system call per message pays the entry and exit cost on every message, a thread that blocks and wakes also pays the context switch, and a thread in a VM pays the VM entry and exit cost too.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
