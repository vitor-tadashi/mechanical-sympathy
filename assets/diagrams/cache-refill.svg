<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">After another task runs, the next events pay for cold caches</title>
<desc id="d">Two timelines of the time each event takes on one CPU. On a shared CPU, another task runs briefly; afterward the thread's data is gone from its L1 and L2 caches, and the next several events take ten to twenty times longer until the caches are warm again. On an isolated CPU nothing else runs, the caches stay warm, and every event takes about 2 microseconds. The heights are illustrative.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .ev { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.2; }
  .slow { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.2; }
  .base { stroke: #57606a; stroke-width: 1.5; }
  .tag { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; text-anchor: middle; }
  .warn { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .ok { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d6b33; }
  .pk { transform-box: fill-box; transform-origin: center bottom; animation: pop 8s linear infinite; }
  @keyframes pop { 0%, 3% { transform: scaleY(1.12); } 7%, 100% { transform: scaleY(1); } }
  .head { transform: translateX(570px); animation: sweep 8s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pk, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="34">Shared CPU: another task runs for a moment</text>
<text class="sub" x="24" y="52">Afterward the thread's data is gone from L1 and L2, and the next events run from L3 and memory.</text>
<line class="base" x1="150" y1="140" x2="720" y2="140"/>
