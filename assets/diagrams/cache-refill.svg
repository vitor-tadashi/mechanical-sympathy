<rect class="ev pk" x="496" y="130.0" width="14" height="10.0" rx="2" style="animation-delay:-3.05s"/>
<rect class="ev pk" x="520" y="132.0" width="14" height="8.0" rx="2" style="animation-delay:-2.71s"/>
<rect class="ev pk" x="544" y="132.0" width="14" height="8.0" rx="2" style="animation-delay:-2.37s"/>
<rect class="ev pk" x="568" y="132.0" width="14" height="8.0" rx="2" style="animation-delay:-2.04s"/>
<rect class="ev pk" x="592" y="132.0" width="14" height="8.0" rx="2" style="animation-delay:-1.7s"/>
<rect class="ev pk" x="616" y="132.0" width="14" height="8.0" rx="2" style="animation-delay:-1.36s"/>
<text class="warn" x="510" y="86">cold caches: the next events</text><text class="warn" x="510" y="102">take 10 to 20 times longer</text>
<text class="lbl" x="24" y="122">time per</text><text class="lbl" x="24" y="138">event</text>
<rect class="lane" x="10" y="170" width="740" height="150" rx="6"/>
<text class="cap" x="24" y="194">Isolated CPU: nothing else ever runs here</text>
<text class="sub" x="24" y="212">The caches stay warm, and every event takes the same short time.</text>
<line class="base" x1="150" y1="300" x2="720" y2="300"/>
