<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d">
<title id="t">How bin/launch builds the java command</title>
<desc id="d">bin/launch picks jvm.options on bare metal or jvm-low-resource.options elsewhere. When affinity is enabled it adds the NUMA, large-page and pre-touch flags. When APP_NUMA_NODE is set it prefixes numactl --membind, and when a bypass launcher is installed it prefixes the bypass command, then it runs java.</desc>
