<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting a JVM that will not use large pages</title>
<desc id="d">Walk from the boot unit to the per-node pool to the JVM flags. Most failures are a pool on the wrong node or a launcher that did not add the flags.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(420px, 237px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 15.3% { transform: translate(140px, 82.5px); } 21.3% { transform: translate(140px, 82.5px); } 27.45% { transform: translate(140px, 145px); } 33.45% { transform: translate(140px, 145px); } 40.35% { transform: translate(140px, 215px); } 46.35% { transform: translate(140px, 215px); } 74% { transform: translate(420px, 237px); } 80% { transform: translate(420px, 237px); } 100% { transform: translate(420px, 237px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.2% { fill: #ffffff; stroke-width: 1.5; } 17.3% { fill: #ffe9a8; stroke-width: 3; } 25.3%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 27.35% { fill: #ffffff; stroke-width: 1.5; } 29.45% { fill: #ffe9a8; stroke-width: 3; } 37.45%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 40.25% { fill: #ffffff; stroke-width: 1.5; } 42.35% { fill: #ffe9a8; stroke-width: 3; } 50.35%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 7s linear infinite; }
  @keyframes p5 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="402" rx="8"/>
<path class="walk" d="M140,49 L140,82.5" marker-end="url(#w)"/>
<path class="wire" d="M187.5,97 L420,97" marker-end="url(#a)"/>
<path class="walk" d="M140,111.5 L140,145" marker-end="url(#w)"/>
<path class="wire" d="M196,167 L420,167" marker-end="url(#a)"/>
<path class="walk" d="M140,189 L140,215" marker-end="url(#w)"/>
<path class="walk" d="M209.5,237 L420,237" marker-end="url(#w)"/>
<path class="wire" d="M140,259 L140,285" marker-end="url(#a)"/>
<path class="wire" d="M200,307 L420,307" marker-end="url(#a)"/>
<path class="wire" d="M140,329 L140,355" marker-end="url(#a)"/>
<rect class="foc" x="40" y="20" width="200" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">JVM will not use large pages</text>
<polygon class="step p2" points="92.5,97 106.5,82.5 173.5,82.5 187.5,97 173.5,111.5 106.5,111.5"/><text class="lbl" x="140" y="101.5" text-anchor="middle">Unit ran?</text>
<rect class="box" x="420" y="75" width="172" height="44" rx="5"/><text class="lbl" x="506" y="94" text-anchor="middle">hugepagesz=2M missing:</text><text class="lbl" x="506" y="109" text-anchor="middle">apply Guide 01, reboot</text>
<polygon class="step p3" points="84,167 98,145 182,145 196,167 182,189 98,189"/><text class="lbl" x="140" y="164" text-anchor="middle">Pool short</text><text class="lbl" x="140" y="179" text-anchor="middle">after boot?</text>
<rect class="box" x="420" y="145" width="288" height="44" rx="5"/><text class="lbl" x="564" y="164" text-anchor="middle">Fragmented or too little RAM on the node:</text><text class="lbl" x="564" y="179" text-anchor="middle">journalctl -b -u hugetlb-reserve-pages</text>
<polygon class="step p4" points="70.5,237 84.5,215 195.5,215 209.5,237 195.5,259 84.5,259"/><text class="lbl" x="140" y="234" text-anchor="middle">Enough free on</text><text class="lbl" x="140" y="249" text-anchor="middle">the JVM's node?</text>
<rect class="box p5" x="420" y="215" width="295" height="44" rx="5"/><text class="lbl" x="567.5" y="234" text-anchor="middle">numastat -p: bind with numactl --membind,</text><text class="lbl" x="567.5" y="249" text-anchor="middle">or size both nodes (§5.3)</text>
<polygon class="step" points="80,307 94,285 186,285 200,307 186,329 94,329"/><text class="lbl" x="140" y="304" text-anchor="middle">Flags on the</text><text class="lbl" x="140" y="319" text-anchor="middle">running JVM?</text>
<rect class="box" x="420" y="285" width="291" height="44" rx="5"/><text class="lbl" x="565.5" y="304" text-anchor="middle">Launcher did not see affinity.enable=true:</text><text class="lbl" x="565.5" y="319" text-anchor="middle">jcmd pid VM.flags</text>
<rect class="mut" x="68" y="355" width="144" height="29" rx="5"/><text class="lbl" x="140" y="374" text-anchor="middle">See the table below</text>
<text class="el" x="219.5" y="92" text-anchor="start">condition failed</text>
<text class="el" x="146" y="132.25" text-anchor="start">yes</text>
<text class="el" x="228" y="162" text-anchor="start">yes</text>
<text class="el" x="146" y="206" text-anchor="start">no</text>
<text class="el" x="241.5" y="232" text-anchor="start">no</text>
<text class="el" x="146" y="276" text-anchor="start">yes</text>
<text class="el" x="232" y="302" text-anchor="start">no</text>
<text class="el" x="146" y="346" text-anchor="start">yes</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
