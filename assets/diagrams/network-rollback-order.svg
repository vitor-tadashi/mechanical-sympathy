<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" width="760" height="172" role="img" aria-labelledby="t d">
<title id="t">Network rollback order: stop the re-apply, channels first, IRQ placement last</title>
<desc id="d">The rollback stops lowlat-runtime.service first, then restores the channel count, because that can create new interrupt vectors, then the rings, coalescing, PAUSE, offloads and txqueuelen, and last the IRQ CPU lists on the vectors that exist then.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(607px, 108px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(192px, 108px); } 8% { transform: translate(192px, 108px); } 16% { transform: translate(192px, 108px); } 22.17% { transform: translate(247.667px, 108px); } 30.17% { transform: translate(247.667px, 108px); } 49.31% { transform: translate(420.333px, 108px); } 57.31% { transform: translate(420.333px, 108px); } 78% { transform: translate(607px, 108px); } 86% { transform: translate(607px, 108px); } 100% { transform: translate(607px, 108px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 7.9% { fill: #eeeeee; stroke-width: 1.5; } 10% { fill: #d4d4d4; stroke-width: 3; } 18%, 100% { fill: #eeeeee; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 22.07% { fill: #ffd166; stroke-width: 1.5; } 24.17% { fill: #ffb703; stroke-width: 3; } 32.17%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 49.21% { fill: #ffffff; stroke-width: 1.5; } 51.31% { fill: #ffe9a8; stroke-width: 3; } 59.31%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 7s linear infinite; }
  @keyframes p5 { 0%, 77.9% { fill: #cfe3ff; stroke-width: 1.5; } 78%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="172" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="152" rx="6"/>
<text class="cap" x="24" y="34">Rollback, in this order</text>
<text class="sub" x="24" y="52">Channels can re-create IRQ vectors, so IRQ placement goes back last.</text>
<path class="wire" d="M192,108 L247.667,108" marker-end="url(#a)"/>
<path class="wire" d="M364.667,108 L420.333,108" marker-end="url(#a)"/>
<path class="wire" d="M551.333,108 L607,108" marker-end="url(#a)"/>
<rect class="mut p2" x="24" y="78.5" width="168" height="59" rx="5"/><text class="lbl" x="108" y="97.5" text-anchor="middle">Stop</text><text class="lbl" x="108" y="112.5" text-anchor="middle">lowlat-runtime.service</text><text class="lbl" x="108" y="127.5" text-anchor="middle">(no re-apply at boot)</text>
<rect class="foc p3" x="247.667" y="78.5" width="117" height="59" rx="5"/><text class="lbl" x="306.167" y="97.5" text-anchor="middle">Channels first</text><text class="lbl" x="306.167" y="112.5" text-anchor="middle">(may re-create</text><text class="lbl" x="306.167" y="127.5" text-anchor="middle">IRQ vectors)</text>
<rect class="step p4" x="420.333" y="78.5" width="131" height="59" rx="5"/><text class="lbl" x="485.833" y="97.5" text-anchor="middle">Rings, coalescing,</text><text class="lbl" x="485.833" y="112.5" text-anchor="middle">PAUSE, offloads,</text><text class="lbl" x="485.833" y="127.5" text-anchor="middle">txqueuelen</text>
<rect class="box p5" x="607" y="86" width="129" height="44" rx="5"/><text class="lbl" x="671.5" y="105" text-anchor="middle">IRQ CPU lists,</text><text class="lbl" x="671.5" y="120" text-anchor="middle">vector by vector</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
