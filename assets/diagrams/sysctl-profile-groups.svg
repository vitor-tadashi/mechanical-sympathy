<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
<title id="t">The sysctl profile has seven groups, and three hold values to check</title>
<desc id="d">The file 90-lowlat.conf has seven groups, one section each: logging, TCP, buffers, queues, endpoint, BPF and memory. The three groups marked risky value hold the values to check against your host: SYN retries, IPv6 and min_free_kbytes.</desc>
