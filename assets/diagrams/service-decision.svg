<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" role="img" aria-labelledby="t d">
<title id="t">Confine security agents, move periodic jobs to timers, disable only what is not needed</title>
<desc id="d">For each service found running: a security agent is kept and confined in housekeeping.slice with the security team. A needed periodic job becomes a systemd timer in housekeeping.slice, an always-on service such as sshd is kept, and only what the host does not need is added to DISABLE_SERVICES.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 167px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 14.97% { transform: translate(140px, 75px); } 20.97% { transform: translate(140px, 75px); } 33.44% { transform: translate(140px, 184px); } 39.44% { transform: translate(140px, 184px); } 48.38% { transform: translate(215px, 206px); } 52.84% { transform: translate(215px, 167px); } 74% { transform: translate(400px, 167px); } 80% { transform: translate(400px, 167px); } 100% { transform: translate(400px, 167px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 14.87% { fill: #ffffff; stroke-width: 1.5; } 16.97% { fill: #ffe9a8; stroke-width: 3; } 24.97%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 33.34% { fill: #ffffff; stroke-width: 1.5; } 35.44% { fill: #ffe9a8; stroke-width: 3; } 43.44%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="285" rx="8"/>
<path class="walk" d="M140,49 L140,75" marker-end="url(#w)"/>
<path class="wire" d="M185.5,97 L400,97" marker-end="url(#a)"/>
<path class="walk" d="M140,119 L140,184" marker-end="url(#w)"/>
<path class="walk" d="M191,206 L215,206 L215,167 L400,167" marker-end="url(#w)"/>
<path class="wire" d="M191,206 L215,206 L215,213.5 L400,213.5" marker-end="url(#a)"/>
<path class="wire" d="M191,206 L215,206 L215,252.5 L400,252.5" marker-end="url(#a)"/>
<rect class="foc" x="60.5" y="20" width="159" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Service found running</text>
<polygon class="step p2" points="94.5,97 108.5,75 171.5,75 185.5,97 171.5,119 108.5,119"/><text class="lbl" x="140" y="94" text-anchor="middle">Security</text><text class="lbl" x="140" y="109" text-anchor="middle">agent?</text>
<rect class="wait" x="400" y="75" width="300" height="44" rx="5"/><text class="lbl" x="550" y="94" text-anchor="middle">Keep it. Confine it in housekeeping.slice</text><text class="lbl" x="550" y="109" text-anchor="middle">and pin it (Guide 05), with the security team</text>
<polygon class="step p3" points="89,206 103,184 177,184 191,206 177,228 103,228"/><text class="lbl" x="140" y="203" text-anchor="middle">Needed on</text><text class="lbl" x="140" y="218" text-anchor="middle">this host?</text>
<rect class="box p4" x="400" y="145" width="223" height="44" rx="5"/><text class="lbl" x="511.5" y="164" text-anchor="middle">Keep the work: a systemd timer</text><text class="lbl" x="511.5" y="179" text-anchor="middle">in housekeeping.slice</text>
<rect class="box" x="400" y="199" width="219" height="29" rx="5"/><text class="lbl" x="509.5" y="218" text-anchor="middle">Keep it (sshd, rsyslog, chronyd)</text>
<rect class="app" x="400" y="238" width="206" height="29" rx="5"/><text class="lbl" x="503" y="257" text-anchor="middle">Add it to DISABLE_SERVICES</text>
<text class="el" x="217.5" y="92" text-anchor="start">yes</text>
<text class="el" x="146" y="155.5" text-anchor="start">no</text>
<text class="el" x="223" y="162" text-anchor="start">yes, periodic job</text>
<text class="el" x="223" y="208.5" text-anchor="start">yes, always on</text>
<text class="el" x="223" y="247.5" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
