<path class="wire" d="M137.5,178 L161.5,178 L161.5,259 L410,259" marker-end="url(#a)"/>
<rect class="foc" x="7.5" y="20" width="185" height="29" rx="14.5"/><text class="lbl" x="100" y="39" text-anchor="middle">Something broke after 07</text>
<polygon class="step p2" points="62.5,178 76.5,163.5 123.5,163.5 137.5,178 123.5,192.5 76.5,192.5"/><text class="lbl" x="100" y="182.5" text-anchor="middle">What?</text>
<rect class="box" x="410" y="75" width="231" height="44" rx="5"/><text class="lbl" x="525.5" y="94" text-anchor="middle">RHEL 8: logrotate ran from cron.</text><text class="lbl" x="525.5" y="109" text-anchor="middle">Enable logrotate.timer</text>
<rect class="box p3" x="410" y="129" width="178" height="44" rx="5"/><text class="lbl" x="499" y="148" text-anchor="middle">Services ignore limits.d:</text><text class="lbl" x="499" y="163" text-anchor="middle">LimitNOFILE= in the unit</text>
<rect class="box" x="410" y="183" width="247" height="44" rx="5"/><text class="lbl" x="533.5" y="202" text-anchor="middle">Another profile or a manual change:</text><text class="lbl" x="533.5" y="217" text-anchor="middle">tuned-adm profile low-latency</text>
<rect class="wait" x="410" y="237" width="251" height="44" rx="5"/><text class="lbl" x="535.5" y="256" text-anchor="middle">Firewall flush: out-of-band console,</text><text class="lbl" x="535.5" y="271" text-anchor="middle">systemctl start firewalld</text>
<text class="el" x="169.5" y="92" text-anchor="start">logs not rotated</text>
<text class="el" x="169.5" y="146" text-anchor="start">ulimit still 1024 in a service</text>
<text class="el" x="169.5" y="200" text-anchor="start">tuned-adm verify fails</text>
<text class="el" x="169.5" y="254" text-anchor="start">remote access lost</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
