<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-labelledby="t d">
<title id="t">A received packet crosses six stages, and the coalescing timer is where it waits</title>
<desc id="d">A packet goes from the NIC through the interrupt coalescing timer, the hard interrupt and the softirq on housekeeping CPU X, into the socket queue, and to the application thread on isolated CPU Y. Most of the avoidable waiting happens at the coalescing timer.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(691.5px, 78px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(98px, 78px); } 6% { transform: translate(98px, 78px); } 15.89% { transform: translate(231.4px, 78px); } 45.89% { transform: translate(231.4px, 78px); } 80% { transform: translate(691.5px, 78px); } 100% { transform: translate(691.5px, 78px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.79% { fill: #ffc9c9; stroke-width: 1.5; } 17.89% { fill: #ff9b9b; stroke-width: 3; } 45.89%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 79.9% { fill: #c8f0d0; stroke-width: 1.5; } 80%, 97% { fill: #8fe0a0; stroke-width: 3; } 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .c4 { animation: c4 7s linear infinite; }
  @keyframes c4 { 0%, 15.79% { opacity: 0; } 15.89%, 100% { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .c4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="150" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="130" rx="6"/>
<text class="cap" x="24" y="34">Receive path</text>
<text class="sub" x="24" y="52">IRQ CPU X is never the application's isolated CPU Y.</text>
<path class="wire" d="M172,100 L188.4,100" marker-end="url(#a)"/>
<path class="wire" d="M274.4,100 L290.8,100" marker-end="url(#a)"/>
<path class="wire" d="M367.8,100 L384.2,100" marker-end="url(#a)"/>
<path class="wire" d="M551.2,100 L567.6,100" marker-end="url(#a)"/>
<path class="wire" d="M630.6,100 L647,100" marker-end="url(#a)"/>
<rect class="step" x="24" y="78" width="148" height="44" rx="5"/><text class="lbl" x="98" y="97" text-anchor="middle">NIC</text><text class="lbl" x="98" y="112" text-anchor="middle">MAC, DMA to RX ring</text>
<rect class="wait p2" x="188.4" y="78" width="86" height="44" rx="5"/><text class="lbl" x="231.4" y="97" text-anchor="middle">coalescing</text><text class="lbl" x="231.4" y="112" text-anchor="middle">timer</text>
<rect class="box" x="290.8" y="78" width="77" height="44" rx="5"/><text class="lbl" x="329.3" y="97" text-anchor="middle">hard IRQ</text><text class="lbl" x="329.3" y="112" text-anchor="middle">CPU X</text>
<rect class="box" x="384.2" y="78" width="167" height="44" rx="5"/><text class="lbl" x="467.7" y="97" text-anchor="middle">softirq, CPU X</text><text class="lbl" x="467.7" y="112" text-anchor="middle">NAPI, GRO, IP, UDP/TCP</text>
<rect class="step" x="567.6" y="78" width="63" height="44" rx="5"/><text class="lbl" x="599.1" y="97" text-anchor="middle">socket</text><text class="lbl" x="599.1" y="112" text-anchor="middle">queue</text>
<rect class="app p3" x="647" y="78" width="89" height="44" rx="5"/><text class="lbl" x="691.5" y="97" text-anchor="middle">app thread</text><text class="lbl" x="691.5" y="112" text-anchor="middle">CPU Y</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<text class="done c4" x="231.4" y="136" text-anchor="middle">waits</text>
</svg>
