<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" width="760" height="246" role="img" aria-labelledby="t d">
<title id="t">One CPU slower than its peers: SMT, then a thread on its sibling</title>
<desc id="d">Confirm that Hyper-Threading is active, find the sibling of the slow CPU 15, CPU 39, and look for a thread on it. Move that thread or count cores in affinity.properties, or turn HT off in the BIOS.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 152px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 15.27% { transform: translate(140px, 75px); } 21.27% { transform: translate(140px, 75px); } 31.57% { transform: translate(140px, 157px); } 37.57% { transform: translate(140px, 157px); } 47.81% { transform: translate(218.5px, 179px); } 51.2% { transform: translate(218.5px, 152px); } 74% { transform: translate(400px, 152px); } 80% { transform: translate(400px, 152px); } 100% { transform: translate(400px, 152px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.17% { fill: #ffffff; stroke-width: 1.5; } 17.27% { fill: #ffe9a8; stroke-width: 3; } 25.27%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 31.47% { fill: #ffffff; stroke-width: 1.5; } 33.57% { fill: #ffe9a8; stroke-width: 3; } 41.57%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="246" rx="8"/>
<path class="walk" d="M140,49 L140,75" marker-end="url(#w)"/>
<path class="wire" d="M196.5,89.5 L400,89.5" marker-end="url(#a)"/>
<path class="walk" d="M140,104 L140,157" marker-end="url(#w)"/>
<path class="walk" d="M194.5,179 L218.5,179 L218.5,152 L400,152" marker-end="url(#w)"/>
<path class="wire" d="M194.5,179 L218.5,179 L218.5,206 L400,206" marker-end="url(#a)"/>
<rect class="foc" x="39" y="20" width="202" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">CPU 15 slower than its peers</text>
<polygon class="step p2" points="83.5,89.5 97.5,75 182.5,75 196.5,89.5 182.5,104 97.5,104"/><text class="lbl" x="140" y="94" text-anchor="middle">SMT active?</text>
<rect class="mut" x="400" y="75" width="194" height="29" rx="5"/><text class="lbl" x="497" y="94" text-anchor="middle">Not a sibling: see use case 1</text>
<polygon class="step p3" points="85.5,179 99.5,157 180.5,157 194.5,179 180.5,201 99.5,201"/><text class="lbl" x="140" y="176" text-anchor="middle">A thread on</text><text class="lbl" x="140" y="191" text-anchor="middle">CPU 39?</text>
<rect class="box p4" x="400" y="130" width="186" height="44" rx="5"/><text class="lbl" x="493" y="149" text-anchor="middle">Move it, or count cores</text><text class="lbl" x="493" y="164" text-anchor="middle">in affinity.properties (§3)</text>
<rect class="box" x="400" y="184" width="171" height="44" rx="5"/><text class="lbl" x="485.5" y="203" text-anchor="middle">Turn HT off in the BIOS</text><text class="lbl" x="485.5" y="218" text-anchor="middle">(Guide 00 §4.4)</text>
<text class="el" x="228.5" y="84.5" text-anchor="start">no</text>
<text class="el" x="146" y="134.5" text-anchor="start">yes</text>
<text class="el" x="226.5" y="147" text-anchor="start">yes</text>
<text class="el" x="226.5" y="201" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
