  .pl14 { animation: pl14 10s linear infinite; }
  @keyframes pl14 { 0%, 76.83% { fill: #cfe3ff; } 78.93% { fill: #9cc3ff; stroke-width: 3; } 82.93%, 100% { fill: #cfe3ff; } }
