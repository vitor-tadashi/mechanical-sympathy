  @keyframes tk5 { 0% { transform: translate(256px, 166px); } 28% { transform: translate(256px, 166px); } 28.93% { transform: translate(300px, 166px); } 31.93% { transform: translate(300px, 166px); } 37.11% { transform: translate(546px, 166px); } 38% { transform: translate(588px, 166px); } 100% { transform: translate(588px, 166px); } }
  .pl6 { animation: pl6 10s linear infinite; }
