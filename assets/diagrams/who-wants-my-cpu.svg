<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Seven things take a CPU away from a critical thread, and each one has a knob</title>
<desc id="d">Seven sources of interference, each with its typical cost, and the setting that removes it: other tasks (isolcpus and CPUAffinity), the scheduler tick (nohz_full), RCU callbacks (rcu_nocbs), kernel workers (workqueue cpumask), device interrupts (IRQ affinity), third-party agents (housekeeping.slice) and migration (one pinned thread per CPU). With all seven removed, the isolated CPU runs its one pinned thread uninterrupted.</desc>
<style>
