  .midr { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2b0a0a; text-anchor: middle; }
  .midw { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b1f33; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }

  .hdr { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-transform: uppercase; letter-spacing: 0.04em; }
  .arr { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .ok { stroke: #1d6b33; stroke-width: 2; fill: none; }
  .big { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b2613; text-anchor: middle; }
  .bigs { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b2613; text-anchor: middle; }
  .tk1 { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; transform: translate(588px, 66px); animation: tk1 10s linear infinite; }
  @keyframes tk1 { 0% { transform: translate(256px, 66px); } 4% { transform: translate(256px, 66px); } 4.93% { transform: translate(300px, 66px); } 7.93% { transform: translate(300px, 66px); } 13.11% { transform: translate(546px, 66px); } 14% { transform: translate(588px, 66px); } 100% { transform: translate(588px, 66px); } }
  .pl2 { animation: pl2 10s linear infinite; }
  @keyframes pl2 { 0%, 4.83% { fill: #cfe3ff; } 6.93% { fill: #9cc3ff; stroke-width: 3; } 10.93%, 100% { fill: #cfe3ff; } }
  .tk3 { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; transform: translate(588px, 116px); animation: tk3 10s linear infinite; }
  @keyframes tk3 { 0% { transform: translate(256px, 116px); } 16% { transform: translate(256px, 116px); } 16.93% { transform: translate(300px, 116px); } 19.93% { transform: translate(300px, 116px); } 25.11% { transform: translate(546px, 116px); } 26% { transform: translate(588px, 116px); } 100% { transform: translate(588px, 116px); } }
  .pl4 { animation: pl4 10s linear infinite; }
  @keyframes pl4 { 0%, 16.83% { fill: #cfe3ff; } 18.93% { fill: #9cc3ff; stroke-width: 3; } 22.93%, 100% { fill: #cfe3ff; } }
