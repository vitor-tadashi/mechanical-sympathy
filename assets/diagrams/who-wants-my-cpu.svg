  .pl10 { animation: pl10 10s linear infinite; }
  @keyframes pl10 { 0%, 52.83% { fill: #cfe3ff; } 54.93% { fill: #9cc3ff; stroke-width: 3; } 58.93%, 100% { fill: #cfe3ff; } }
  .tk11 { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; transform: translate(588px, 316px); animation: tk11 10s linear infinite; }
  @keyframes tk11 { 0% { transform: translate(256px, 316px); } 64% { transform: translate(256px, 316px); } 64.93% { transform: translate(300px, 316px); } 67.93% { transform: translate(300px, 316px); } 73.11% { transform: translate(546px, 316px); } 74% { transform: translate(588px, 316px); } 100% { transform: translate(588px, 316px); } }
  .pl12 { animation: pl12 10s linear infinite; }
  @keyframes pl12 { 0%, 64.83% { fill: #cfe3ff; } 66.93% { fill: #9cc3ff; stroke-width: 3; } 70.93%, 100% { fill: #cfe3ff; } }
