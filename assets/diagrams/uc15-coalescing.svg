  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(547px, 280px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 11% { transform: translate(140px, 49px); } 13.01% { transform: translate(140px, 75px); } 18.01% { transform: translate(140px, 75px); } 24.95% { transform: translate(140px, 164.5px); } 29.95% { transform: translate(140px, 164.5px); } 35.92% { transform: translate(214px, 186.5px); } 38.02% { transform: translate(214px, 213.5px); } 50.87% { transform: translate(380px, 213.5px); } 55.87% { transform: translate(380px, 213.5px); } 62.3% { transform: translate(450px, 258px); } 67.3% { transform: translate(450px, 258px); } 75% { transform: translate(547px, 280px); } 80% { transform: translate(547px, 280px); } 100% { transform: translate(547px, 280px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 12.91% { fill: #ffffff; stroke-width: 1.5; } 15.01% { fill: #ffe9a8; stroke-width: 3; } 23.01%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 24.85% { fill: #ffffff; stroke-width: 1.5; } 26.95% { fill: #ffe9a8; stroke-width: 3; } 34.95%, 100% { fill: #ffffff; stroke-width: 1.5; } }
