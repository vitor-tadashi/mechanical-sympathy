<path class="wire" d="M214.5,97 L380,97" marker-end="url(#a)"/>
<path class="wire" d="M140,119 L140,164.5" marker-end="url(#a)"/>
<path class="wire" d="M190,186.5 L214,186.5 L214,167 L380,167" marker-end="url(#a)"/>
