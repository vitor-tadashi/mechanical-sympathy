<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d">
<title id="t">One feed slow at light load: coalescing, the NIC list, where the interrupts land</title>
<desc id="d">Read the coalescing settings: adaptive-rx on or rx-usecs above 0. Then find out why the script skipped the NIC: it is not listed in NICS, or 04-network did not run on it. After adding it, check that its interrupts do not land on an isolated CPU.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
