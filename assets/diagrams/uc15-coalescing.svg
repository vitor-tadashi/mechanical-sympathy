<path class="walk" d="M511,280 L547,280" marker-end="url(#w)"/>
<rect class="foc" x="45.5" y="20" width="189" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">One feed slow at light load</text>
<polygon class="step p2" points="65.5,97 79.5,75 200.5,75 214.5,97 200.5,119 79.5,119"/><text class="lbl" x="140" y="94" text-anchor="middle">adaptive-rx on or</text><text class="lbl" x="140" y="109" text-anchor="middle">rx-usecs &gt; 0?</text>
<rect class="mut" x="380" y="75" width="164" height="44" rx="5"/><text class="lbl" x="462" y="94" text-anchor="middle">Not coalescing: look at</text><text class="lbl" x="462" y="109" text-anchor="middle">C-states (use case 11)</text>
<polygon class="step p3" points="90,186.5 104,164.5 176,164.5 190,186.5 176,208.5 104,208.5"/><text class="lbl" x="140" y="183.5" text-anchor="middle">NIC listed</text><text class="lbl" x="140" y="198.5" text-anchor="middle">in NICS?</text>
<rect class="box" x="380" y="145" width="208" height="44" rx="5"/><text class="lbl" x="484" y="164" text-anchor="middle">04-network did not run on it:</text><text class="lbl" x="484" y="179" text-anchor="middle">check lowlat-runtime.service</text>
<rect class="box p4" x="380" y="199" width="224" height="29" rx="5"/><text class="lbl" x="492" y="218" text-anchor="middle">Add it with the critical role (§3)</text>
<polygon class="step p5" points="389,280 403,258 497,258 511,280 497,302 403,302"/><text class="lbl" x="450" y="277" text-anchor="middle">IRQs on an</text><text class="lbl" x="450" y="292" text-anchor="middle">isolated CPU?</text>
<rect class="box p6" x="547" y="265.5" width="203" height="29" rx="5"/><text class="lbl" x="648.5" y="284.5" text-anchor="middle">irq_cpus: the node's IRQ CPU</text>
<text class="el" x="246.5" y="92" text-anchor="start">no</text>
<text class="el" x="146" y="145.75" text-anchor="start">yes</text>
<text class="el" x="222" y="162" text-anchor="start">yes</text>
<text class="el" x="222" y="208.5" text-anchor="start">no</text>
<text class="el" x="517" y="274" text-anchor="start">yes</text>
