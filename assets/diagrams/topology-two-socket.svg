<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="t d">
<title id="t">How far another CPU, the memory and the NIC are from one thread</title>
<desc id="d">A two-socket server where each socket has two last-level cache domains, its own memory and its own PCIe root. Seen from the net.rx thread on socket 1, a core in the same cache domain is about 20 to 40 nanoseconds away, a core in the other domain of the same socket about 60 to 120 nanoseconds, and a core on the other socket about 130 to 200 nanoseconds. The critical NIC hangs off socket 1, so its packets land in socket 1's cache.</desc>
