  @keyframes tk1 { 0% { transform: translate(474px, 104px); } 4% { transform: translate(474px, 104px); } 4.56% { transform: translate(477.9px, 101.4px); } 5.1% { transform: translate(481.8px, 99.2px); } 5.61% { transform: translate(485.6px, 97.3px); } 6.11% { transform: translate(489.5px, 95.8px); } 6.6% { transform: translate(493.4px, 94.5px); } 7.06% { transform: translate(497.2px, 93.7px); } 7.53% { transform: translate(501.1px, 93.2px); } 8% { transform: translate(505px, 93px); } 8.47% { transform: translate(508.9px, 93.2px); } 8.94% { transform: translate(512.8px, 93.7px); } 9.4% { transform: translate(516.6px, 94.5px); } 9.89% { transform: translate(520.5px, 95.8px); } 10.39% { transform: translate(524.4px, 97.3px); } 10.9% { transform: translate(528.2px, 99.2px); } 11.44% { transform: translate(532.1px, 101.4px); } 12% { transform: translate(536px, 104px); } 100% { transform: translate(536px, 104px); } }
  .tk2 { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; transform: translate(624px, 104px); animation: tk2 9s linear infinite; }
  @keyframes tk2 { 0% { transform: translate(474px, 104px); } 18% { transform: translate(474px, 104px); } 19.4% { transform: translate(483.4px, 97.7px); } 20.74% { transform: translate(492.8px, 92.2px); } 22.03% { transform: translate(502.1px, 87.5px); } 23.27% { transform: translate(511.5px, 83.8px); } 24.49% { transform: translate(520.9px, 80.8px); } 25.67% { transform: translate(530.2px, 78.7px); } 26.84% { transform: translate(539.6px, 77.4px); } 28% { transform: translate(549px, 77px); } 29.16% { transform: translate(558.4px, 77.4px); } 30.33% { transform: translate(567.8px, 78.7px); } 31.51% { transform: translate(577.1px, 80.8px); } 32.73% { transform: translate(586.5px, 83.8px); } 33.97% { transform: translate(595.9px, 87.5px); } 35.26% { transform: translate(605.2px, 92.2px); } 36.6% { transform: translate(614.6px, 97.7px); } 38% { transform: translate(624px, 104px); } 100% { transform: translate(624px, 104px); } }
