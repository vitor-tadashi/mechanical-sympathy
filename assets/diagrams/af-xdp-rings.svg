<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">AF_XDP passes frame numbers through four rings; the frames stay in the UMEM</title>
<desc id="d">Your program puts empty frames on the fill ring, the driver returns filled frames on the RX ring, your program puts frames to send on the TX ring, and the driver returns sent frames on the completion ring. The frames themselves never move: they live in one shared block of memory, the UMEM.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(210px, 168px); animation: k1 9s linear infinite; }
  @keyframes k1 { 0% { transform: translate(210px, 56px); } 6% { transform: translate(210px, 56px); } 20% { transform: translate(550px, 56px); } 25.8% { transform: translate(550px, 56px); } 26% { transform: translate(550px, 90px); } 40% { transform: translate(210px, 90px); } 45.8% { transform: translate(210px, 90px); } 46% { transform: translate(210px, 134px); } 60% { transform: translate(550px, 134px); } 65.8% { transform: translate(550px, 134px); } 66% { transform: translate(550px, 168px); } 80% { transform: translate(210px, 168px); } 85.8% { transform: translate(210px, 168px); } 100% { transform: translate(210px, 168px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="300" rx="8"/>
<path class="wire" d="M210,56 L550,56" marker-end="url(#a)"/>
<path class="wire" d="M550,90 L210,90" marker-end="url(#a)"/>
<path class="wire" d="M210,134 L550,134" marker-end="url(#a)"/>
<path class="wire" d="M550,168 L210,168" marker-end="url(#a)"/>
<path class="wire dash" d="M130,187 L130,250 L260,250"/>
<path class="wire dash" d="M630,187 L630,250 L500,250"/>
<rect class="app" x="50" y="37" width="160" height="150" rx="5"/><text class="lbl" x="130" y="116.5" text-anchor="middle">your program</text>
<rect class="box" x="550" y="37" width="160" height="150" rx="5"/><text class="lbl" x="630" y="109" text-anchor="middle">NIC driver</text><text class="lbl" x="630" y="124" text-anchor="middle">XDP hook</text>
<path class="foc" d="M260,229 a120,6 0 0 1 240,0 v42 a120,6 0 0 1 -240,0 z"/><path class="sl" d="M260,229 a120,6 0 0 0 240,0"/><text class="lbl" x="380" y="247" text-anchor="middle">UMEM</text><text class="lbl" x="380" y="262" text-anchor="middle">one block, frames of 2 or 4 KiB</text>
<text class="el" x="380" y="50" text-anchor="middle">fill ring: empty frames</text>
<text class="el" x="380" y="84" text-anchor="middle">RX ring: filled frames</text>
<text class="el" x="380" y="128" text-anchor="middle">TX ring: frames to send</text>
<text class="el" x="380" y="162" text-anchor="middle">completion ring: sent frames</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
