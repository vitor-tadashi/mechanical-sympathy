<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" width="760" height="178" role="img" aria-labelledby="t d">
<title id="t">At boot the last writer of a sysctl value wins</title>
<desc id="d">systemd-sysctl applies every sysctl.d file sorted by name, then tuned applies its profile and re-applies sysctl.d, and the udev rule sets the per-interface keys only when each NIC appears. The value that sticks is the one written last.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(557px, 112px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(196px, 112px); } 8% { transform: translate(196px, 112px); } 20% { transform: translate(196px, 112px); } 29.13% { transform: translate(274.5px, 112px); } 41.13% { transform: translate(274.5px, 112px); } 74% { transform: translate(557px, 112px); } 86% { transform: translate(557px, 112px); } 100% { transform: translate(557px, 112px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 7.9% { fill: #cfe3ff; stroke-width: 1.5; } 10% { fill: #9cc3ff; stroke-width: 3; } 18%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 29.03% { fill: #cfe3ff; stroke-width: 1.5; } 31.13% { fill: #9cc3ff; stroke-width: 3; } 39.13%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #ffd166; stroke-width: 1.5; } 74%, 97% { fill: #ffb703; stroke-width: 3; } 100% { fill: #ffd166; stroke-width: 1.5; } }
  .c5 { animation: c5 8s linear infinite; }
  @keyframes c5 { 0%, 73.9% { opacity: 0; } 74%, 100% { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .c5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="178" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="158" rx="6"/>
<text class="cap" x="24" y="34">Load order at boot</text>
<text class="sub" x="24" y="52">The last writer wins. Per-interface keys land only once each NIC exists.</text>
<path class="wire" d="M196,112 L274.5,112" marker-end="url(#a)"/>
<path class="wire" d="M478.5,112 L557,112" marker-end="url(#a)"/>
<rect class="box p2" x="24" y="82.5" width="172" height="59" rx="5"/><text class="lbl" x="110" y="101.5" text-anchor="middle">systemd-sysctl.service</text><text class="lbl" x="110" y="116.5" text-anchor="middle">all sysctl.d files,</text><text class="lbl" x="110" y="131.5" text-anchor="middle">sorted by name</text>
<rect class="box p3" x="274.5" y="75" width="204" height="74" rx="5"/><text class="lbl" x="376.5" y="94" text-anchor="middle">tuned</text><text class="lbl" x="376.5" y="109" text-anchor="middle">its profile's [sysctl] section,</text><text class="lbl" x="376.5" y="124" text-anchor="middle">then sysctl.d again</text><text class="lbl" x="376.5" y="139" text-anchor="middle">(reapply_sysctl)</text>
<rect class="foc p4" x="557" y="82.5" width="179" height="59" rx="5"/><text class="lbl" x="646.5" y="101.5" text-anchor="middle">udev rule</text><text class="lbl" x="646.5" y="116.5" text-anchor="middle">per-interface keys when</text><text class="lbl" x="646.5" y="131.5" text-anchor="middle">each NIC appears</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
<text class="done c5" x="646.5" y="158" text-anchor="middle">written last</text>
</svg>
