<rect class="bg" x="0" y="0" width="760" height="220" rx="8"/>
<path class="wire" d="M207.5,56 L293,56" marker-end="url(#a)"/>
<path class="wire" d="M427,56 L505.5,56" marker-end="url(#a)"/>
<path class="wire" d="M600,78 L600,111 L130,111 L130,144" marker-end="url(#a)"/>
<path class="wire" d="M200.5,166 L292.5,166" marker-end="url(#a)"/>
<path class="wire" d="M467.5,166 L526,166" marker-end="url(#a)"/>
<rect class="step" x="12.5" y="34" width="195" height="44" rx="22"/><text class="lbl" x="110" y="53" text-anchor="middle">A change: kernel, firmware,</text><text class="lbl" x="110" y="68" text-anchor="middle">driver, agent, application</text>
<rect class="wait p2" x="293" y="34" width="134" height="44" rx="5"/><text class="lbl" x="360" y="53" text-anchor="middle">Drift: one setting</text><text class="lbl" x="360" y="68" text-anchor="middle">silently reverts</text>
<rect class="foc p3" x="505.5" y="34" width="189" height="44" rx="5"/><text class="lbl" x="600" y="53" text-anchor="middle">lowlat-verify.timer</text><text class="lbl" x="600" y="68" text-anchor="middle">daily and 10 min after boot</text>
<rect class="box" x="59.5" y="144" width="141" height="44" rx="5"/><text class="lbl" x="130" y="163" text-anchor="middle">verify-tuning</text><text class="lbl" x="130" y="178" text-anchor="middle">PASS / WARN / FAIL</text>
<rect class="box" x="292.5" y="144" width="175" height="44" rx="5"/><text class="lbl" x="380" y="163" text-anchor="middle">Journal and a failed unit</text><text class="lbl" x="380" y="178" text-anchor="middle">systemctl --failed</text>
<rect class="app p4" x="526" y="144" width="188" height="44" rx="22"/><text class="lbl" x="620" y="163" text-anchor="middle">Your alerting</text><text class="lbl" x="620" y="178" text-anchor="middle">and the fix from the guide</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
