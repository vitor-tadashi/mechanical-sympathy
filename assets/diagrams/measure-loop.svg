<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d">
<title id="t">Baseline, change one thing, measure the same way, keep only what improves the tail</title>
<desc id="d">The loop starts from a baseline. Change one thing, measure with the same load and duration, and compare the tail. A better tail is kept and becomes the new baseline. No improvement or a worse tail is rolled back. Either way, the next change starts the loop again.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(220px, 82px); animation: k1 10s linear infinite; }
  @keyframes k1 { 0% { transform: translate(108px, 60px); } 6% { transform: translate(108px, 60px); } 7.97% { transform: translate(181px, 60px); } 10.08% { transform: translate(259px, 60px); } 11.46% { transform: translate(310.5px, 60px); } 16.3% { transform: translate(489.5px, 60px); } 18.2% { transform: translate(560px, 60px); } 19.43% { transform: translate(600px, 82px); } 20.19% { transform: translate(600px, 110px); } 23.69% { transform: translate(470px, 110px); } 24.45% { transform: translate(470px, 138px); } 29.25% { transform: translate(470px, 138px); } 29.45% { transform: translate(470px, 182px); } 30.34% { transform: translate(470px, 215px); } 37.09% { transform: translate(220px, 215px); } 40.68% { transform: translate(220px, 82px); } 45.48% { transform: translate(220px, 82px); } 45.68% { transform: translate(259px, 60px); } 47.07% { transform: translate(310.5px, 60px); } 51.9% { transform: translate(489.5px, 60px); } 53.8% { transform: translate(560px, 60px); } 55.03% { transform: translate(600px, 82px); } 55.89% { transform: translate(600px, 113.75px); } 58.05% { transform: translate(680px, 113.75px); } 58.9% { transform: translate(680px, 145.5px); } 63.7% { transform: translate(680px, 145.5px); } 63.9% { transform: translate(680px, 174.5px); } 65% { transform: translate(680px, 215px); } 70.66% { transform: translate(470px, 215px); } 77.41% { transform: translate(220px, 215px); } 81% { transform: translate(220px, 82px); } 85.8% { transform: translate(220px, 82px); } 100% { transform: translate(220px, 82px); } }
  .p2 { animation: p2 10s linear infinite; }
  @keyframes p2 { 0%, 24.35% { fill: #c8f0d0; stroke-width: 1.5; } 26.45% { fill: #8fe0a0; stroke-width: 3; } 34.45%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .p3 { animation: p3 10s linear infinite; }
  @keyframes p3 { 0%, 58.8% { fill: #ffc9c9; stroke-width: 1.5; } 60.9% { fill: #ff9b9b; stroke-width: 3; } 68.9%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="250" rx="8"/>
<path class="wire" d="M108,60 L181,60" marker-end="url(#a)"/>
<path class="wire" d="M259,60 L310.5,60" marker-end="url(#a)"/>
<path class="wire" d="M489.5,60 L560,60" marker-end="url(#a)"/>
<path class="wire" d="M600,82 L600,110 L470,110 L470,138" marker-end="url(#a)"/>
<path class="wire" d="M600,82 L600,113.75 L680,113.75 L680,145.5" marker-end="url(#a)"/>
<path class="wire" d="M470,182 L470,215 L220,215 L220,82" marker-end="url(#a)"/>
<path class="wire" d="M680,174.5 L680,215 L470,215" marker-end="url(#a)"/>
<rect class="foc" x="32" y="38" width="76" height="44" rx="22"/><text class="lbl" x="70" y="57" text-anchor="middle">Baseline</text><text class="lbl" x="70" y="72" text-anchor="middle">09 --run</text>
<rect class="step" x="181" y="38" width="78" height="44" rx="5"/><text class="lbl" x="220" y="57" text-anchor="middle">Change</text><text class="lbl" x="220" y="72" text-anchor="middle">one thing</text>
<rect class="step" x="310.5" y="38" width="179" height="44" rx="5"/><text class="lbl" x="400" y="57" text-anchor="middle">Measure</text><text class="lbl" x="400" y="72" text-anchor="middle">same load, same duration</text>
<polygon class="step" points="560,60 574,38 626,38 640,60 626,82 574,82"/><text class="lbl" x="600" y="57" text-anchor="middle">Better</text><text class="lbl" x="600" y="72" text-anchor="middle">tail?</text>
<rect class="app p2" x="386.5" y="138" width="167" height="44" rx="5"/><text class="lbl" x="470" y="157" text-anchor="middle">Keep it, and it becomes</text><text class="lbl" x="470" y="172" text-anchor="middle">the new baseline</text>
<rect class="wait p3" x="634.5" y="145.5" width="91" height="29" rx="5"/><text class="lbl" x="680" y="164.5" text-anchor="middle">Roll it back</text>
<text class="el" x="535" y="105" text-anchor="middle">yes</text>
<text class="el" x="640" y="108.75" text-anchor="middle">no or worse</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
