  .k9 { transform: translate(490px, 256px); animation: k9 9s linear infinite; }
  @keyframes k9 { 0% { transform: translate(250px, 228px); } 48.29% { transform: translate(250px, 228px); } 52.31% { transform: translate(370px, 228px); } 53.25% { transform: translate(370px, 256px); } 57.27% { transform: translate(490px, 256px); } 100% { transform: translate(490px, 256px); } }
  .p10 { animation: p10 9s linear infinite; }
  @keyframes p10 { 0%, 57.17% { fill: #cfe3ff; stroke-width: 1.5; } 59.27% { fill: #9cc3ff; stroke-width: 3; } 67.27%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k11 { transform: translate(490px, 311px); animation: k11 9s linear infinite; }
  @keyframes k11 { 0% { transform: translate(250px, 228px); } 58.86% { transform: translate(250px, 228px); } 62.2% { transform: translate(370px, 228px); } 64.5% { transform: translate(370px, 311px); } 67.84% { transform: translate(490px, 311px); } 100% { transform: translate(490px, 311px); } }
  .p12 { animation: p12 9s linear infinite; }
  @keyframes p12 { 0%, 67.74% { fill: #cfe3ff; stroke-width: 1.5; } 69.84% { fill: #9cc3ff; stroke-width: 3; } 77.84%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k13 { transform: translate(490px, 209px); animation: k13 9s linear infinite; }
  @keyframes k13 { 0% { transform: translate(250px, 312px); } 69.43% { transform: translate(250px, 312px); } 73.88% { transform: translate(420px, 312px); } 76.58% { transform: translate(420px, 209px); } 78.41% { transform: translate(490px, 209px); } 100% { transform: translate(490px, 209px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6, .k7, .p8, .k9, .p10, .k11, .p12, .k13 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="350" rx="8"/>
