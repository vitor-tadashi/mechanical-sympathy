<rect class="box p2" x="490" y="15" width="220" height="42" rx="5"/><text class="sm" x="600" y="33.5" text-anchor="middle">domain</text><text class="sm" x="600" y="47.5" text-anchor="middle">load balancing</text>
<rect class="box p4" x="490" y="70" width="220" height="42" rx="5"/><text class="sm" x="600" y="88.5" text-anchor="middle">managed_irq</text><text class="sm" x="600" y="102.5" text-anchor="middle">managed IRQ vectors</text>
<rect class="box p6" x="490" y="125" width="220" height="42" rx="5"/><text class="sm" x="600" y="143.5" text-anchor="middle">timer</text><text class="sm" x="600" y="157.5" text-anchor="middle">unbound timers, do_timer</text>
