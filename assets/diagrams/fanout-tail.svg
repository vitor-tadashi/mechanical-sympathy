<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">Fan-out turns a backend tail into the common case</title>
<desc id="d">A chart of the share of user requests that meet at least one slow backend call, against the number of calls per request. If each call is slow one percent of the time, a request with 10 calls meets a slow one 10 percent of the time, and a request with 100 calls 63 percent of the time. If each call is slow only 0.1 percent of the time, 100 calls meet one about 10 percent of the time.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .plot { fill: #ffffff; stroke: #d0d7de; }
  .grid { stroke: #d0d7de; stroke-dasharray: 3 3; }
  .c99 { fill: none; stroke: #9b1c1c; stroke-width: 2.5; }
  .c999 { fill: none; stroke: #1f4e8c; stroke-width: 2.5; }
  .ax { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .axr { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .l99 { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .l999 { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f4e8c; }
  .pt { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .mk { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="350" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="330" rx="6"/>
<text class="cap" x="24" y="34">One user request fans out to n backend calls</text>
<text class="sub" x="24" y="52">It is slow if any one call is slow. The chance of that grows fast with n.</text>
<rect class="plot" x="150" y="70" width="570" height="220"/>
<line class="grid" x1="150" y1="235.0" x2="720" y2="235.0"/><text class="axr" x="144" y="239.0">25 %</text>
<line class="grid" x1="150" y1="180.0" x2="720" y2="180.0"/><text class="axr" x="144" y="184.0">50 %</text>
<line class="grid" x1="150" y1="125.0" x2="720" y2="125.0"/><text class="axr" x="144" y="129.0">75 %</text>
<line class="grid" x1="150" y1="70.0" x2="720" y2="70.0"/><text class="axr" x="144" y="74.0">100 %</text>
<text class="axr" x="144" y="294.0">0 %</text>
<text class="ax" x="150.0" y="306">1</text>
<text class="ax" x="288.2" y="306">25</text>
<text class="ax" x="432.1" y="306">50</text>
<text class="ax" x="576.1" y="306">75</text>
<text class="ax" x="720.0" y="306">100</text>
<text class="ax" x="435.0" y="324">calls per request (n)</text>
