<text class="l99" x="489.7" y="178.4">each call slow 1 % of the time (its p99)</text>
<text class="l999" x="460.9" y="268.2">each call slow 0.1 % of the time (its p99.9)</text>
<circle class="pt" cx="201.8" cy="269.0" r="5"/><text class="mk" x="209.8" y="287.0" text-anchor="start">10 calls: 10 %</text>
