<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<title id="t">A poll-mode core never sleeps, so the mempool and the ring are what run out</title>
<desc id="d">Two timelines of a DPDK poll-mode core. In the healthy one, each pass reads up to 32 packets, works on them and sends them, and the mempool of packet buffers stays nearly full. In the second, the application holds buffers longer than the mempool can lend: the mempool reaches zero, rx_burst returns nothing and rx_nombuf counts up, the RX ring fills, and the NIC drops packets and imissed counts up. The shapes are illustrative.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .dash { fill: #ffffff; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .sm { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .smb { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .tiny { font: 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .mono { font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
  .monob { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .redt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .grnt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d6b33; }
  .tick { stroke: #8c959f; stroke-width: 1; }
  .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .arrowr { stroke: #9b1c1c; stroke-width: 1.5; fill: none; marker-end: url(#ahr); }

  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  .evt { fill: #ff3b3b; stroke: #9b1c1c; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pop 6s linear infinite; }
  @keyframes pop { 0%, 4% { transform: scale(1.9); } 8%, 100% { transform: scale(1); } }
  .free { fill: none; stroke: #1f4e8c; stroke-width: 2.5; }
  .fill { fill: none; stroke: #9b1c1c; stroke-width: 2.5; stroke-dasharray: 6 3; }
  .zero { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .ok { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .rxb { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  @media (prefers-reduced-motion: reduce) {
    .head, .evt { animation: none; }
    .head { display: none; }
  }
</style>
