<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">The shape of the tail points at its cause</title>
<desc id="d">Spikes at a fixed period point at timers: every second the residual tick or RT throttling, every millisecond a full tick, every few seconds vmstat, a watchdog or an agent. Two humps point at two paths. Slowness only at the start points at faults and warm-up. A rare millisecond maximum points at SMIs, direct reclaim or a GC pause.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
