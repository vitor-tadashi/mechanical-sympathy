<polygon class="step" points="190,92 204,70 296,70 310,92 296,114 204,114"/><text class="lbl" x="250" y="89" text-anchor="middle">Spikes at a</text><text class="lbl" x="250" y="104" text-anchor="middle">fixed period?</text>
<rect class="box p2" x="470" y="16" width="209" height="44" rx="5"/><text class="lbl" x="574.5" y="35" text-anchor="middle">Residual tick or RT throttling</text><text class="lbl" x="574.5" y="50" text-anchor="middle">(Guide 01 §7, Guide 02 §4.4)</text>
<rect class="box" x="470" y="70" width="233" height="44" rx="5"/><text class="lbl" x="586.5" y="89" text-anchor="middle">Full tick: nohz_full not active</text><text class="lbl" x="586.5" y="104" text-anchor="middle">or more than one task on the CPU</text>
<rect class="box" x="470" y="124" width="227" height="44" rx="5"/><text class="lbl" x="583.5" y="143" text-anchor="middle">vmstat, a watchdog or an agent:</text><text class="lbl" x="583.5" y="158" text-anchor="middle">find it with rtla osnoise</text>
