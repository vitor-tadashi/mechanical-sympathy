<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="t d">
<title id="t">A SCHED_FIFO spinner starves the kernel threads of its CPU; a SCHED_OTHER spinner lets them run</title>
<desc id="d">Two timelines of isolated CPU 3, which runs the busy-spinning net.rx thread with RT throttling off. When net.rx runs as SCHED_FIFO, a ksoftirqd wake-up and a queued kworker become runnable on CPU 3 and never get the CPU, so packets and kernel work pile up behind the spinner. When net.rx runs as SCHED_OTHER and the NIC interrupt sits on a housekeeping CPU, nothing wakes ksoftirqd on CPU 3, and the kworker runs for a few microseconds and is done.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .track { fill: #ffffff; stroke: #d0d7de; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .muted { fill: #eeeeee; stroke: #777777; stroke-dasharray: 4 3; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .in { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .ev { transform-box: fill-box; transform-origin: center; animation: flash 6s linear infinite; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes flash {
    0%, 4%   { transform: scaleY(1.3); stroke-width: 3; }
    8%, 100% { transform: scaleY(1); stroke-width: 1.5; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ev, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="310" rx="8"/>

<!-- Lane 1: SCHED_FIFO spinner -->
<rect class="lane" x="10" y="10" width="740" height="140" rx="6"/>
<text class="cap" x="24" y="34">net.rx as SCHED_FIFO 99, RT throttling off (-1)</text>
<text class="sub" x="24" y="52">A FIFO thread keeps the CPU until it blocks, and a spinner never blocks. Kernel threads wait forever.</text>
<text class="lbl" x="24" y="84">CPU 3</text>
<rect class="app" x="150" y="68" width="570" height="22" rx="3"/>
<text class="in" x="200" y="84">net.rx spins</text>
<text class="lbl" x="24" y="119">waiting</text>
<rect class="track" x="150" y="103" width="570" height="22" rx="3"/>
<rect class="wait ev" x="250" y="103" width="470" height="22" rx="2" style="animation-delay:-4.95s"/>
<text class="in" x="350" y="119">ksoftirqd/3 waits: packets pile up</text>
<rect class="wait ev" x="450" y="100" width="4" height="28" rx="1" style="animation-delay:-2.84s"/>
<text class="in" x="587" y="119">+ kworker/3 waits too</text>
<text class="axis" x="435" y="142">schematic · red: runnable on CPU 3 but never scheduled, growing for as long as net.rx spins</text>

<!-- Lane 2: SCHED_OTHER spinner -->
<rect class="lane" x="10" y="160" width="740" height="140" rx="6"/>
<text class="cap" x="24" y="184">net.rx as SCHED_OTHER, NIC interrupt on housekeeping CPU 1</text>
<text class="sub" x="24" y="202">Nothing raises softirqs on CPU 3. The one kworker gets a few µs, like any other task, and is done.</text>
<text class="lbl" x="24" y="234">CPU 3</text>
<rect class="app" x="150" y="218" width="570" height="22" rx="3"/>
<text class="in" x="200" y="234">net.rx spins</text>
<rect class="box ev" x="450" y="216" width="10" height="26" rx="2" style="animation-delay:-2.84s"/>
<text class="in" x="530" y="234">kworker/3: a few µs</text>
<text class="lbl" x="24" y="269">waiting</text>
<rect class="muted" x="150" y="253" width="570" height="22" rx="3"/>
<text class="in" x="435" y="269">nothing waits</text>
<text class="axis" x="435" y="292">on an isolated CPU with one thread, SCHED_OTHER and SCHED_FIFO spin the same</text>

<line class="head" x1="150" y1="62" x2="150" y2="280"/>
</svg>
