<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting a failed verify: the section of the first FAIL names the guide</title>
<desc id="d">Read the section header of the first FAIL in the journal. It names the guide that owns the setting, and that guide's own troubleshooting section has the fix.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(380px, 97px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(120px, 49px); } 6% { transform: translate(120px, 49px); } 12% { transform: translate(120px, 49px); } 27.81% { transform: translate(120px, 202.5px); } 33.81% { transform: translate(120px, 202.5px); } 43.05% { transform: translate(207px, 224.5px); } 56.18% { transform: translate(207px, 97px); } 74% { transform: translate(380px, 97px); } 80% { transform: translate(380px, 97px); } 100% { transform: translate(380px, 97px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 27.71% { fill: #ffffff; stroke-width: 1.5; } 29.81% { fill: #ffe9a8; stroke-width: 3; } 37.81%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="392" rx="8"/>
<path class="walk" d="M120,49 L120,202.5" marker-end="url(#w)"/>
<path class="walk" d="M183,224.5 L207,224.5 L207,97 L380,97" marker-end="url(#w)"/>
<path class="wire" d="M183,224.5 L207,224.5 L207,151 L380,151" marker-end="url(#a)"/>
<path class="wire" d="M183,224.5 L207,224.5 L207,205 L380,205" marker-end="url(#a)"/>
<path class="wire" d="M183,224.5 L207,224.5 L207,259 L380,259" marker-end="url(#a)"/>
<path class="wire" d="M183,224.5 L207,224.5 L207,313 L380,313" marker-end="url(#a)"/>
<path class="wire" d="M183,224.5 L207,224.5 L207,359.5 L380,359.5" marker-end="url(#a)"/>
<rect class="foc" x="20.5" y="20" width="199" height="29" rx="14.5"/><text class="lbl" x="120" y="39" text-anchor="middle">lowlat-verify.service failed</text>
<polygon class="step p2" points="57,224.5 71,202.5 169,202.5 183,224.5 169,246.5 71,246.5"/><text class="lbl" x="120" y="221.5" text-anchor="middle">Which section</text><text class="lbl" x="120" y="236.5" text-anchor="middle">has the FAIL?</text>
<rect class="box p3" x="380" y="75" width="228" height="44" rx="5"/><text class="lbl" x="494" y="94" text-anchor="middle">Boot arguments or affinity lost:</text><text class="lbl" x="494" y="109" text-anchor="middle">kernel entries (§3), Guide 01</text>
<rect class="box" x="380" y="129" width="248" height="44" rx="5"/><text class="lbl" x="504" y="148" text-anchor="middle">NIC defaults after a driver change:</text><text class="lbl" x="504" y="163" text-anchor="middle">apply-all --runtime</text>
<rect class="box" x="380" y="183" width="181" height="44" rx="5"/><text class="lbl" x="470.5" y="202" text-anchor="middle">Firmware reset or SMIs:</text><text class="lbl" x="470.5" y="217" text-anchor="middle">Guide 00 §8</text>
<rect class="box" x="380" y="237" width="222" height="44" rx="5"/><text class="lbl" x="491" y="256" text-anchor="middle">Swap back or memory pressure:</text><text class="lbl" x="491" y="271" text-anchor="middle">Guide 12 §7</text>
<rect class="box" x="380" y="291" width="238" height="44" rx="5"/><text class="lbl" x="499" y="310" text-anchor="middle">The timer itself:</text><text class="lbl" x="499" y="325" text-anchor="middle">systemctl status, the table below</text>
<rect class="mut" x="380" y="345" width="287" height="29" rx="5"/><text class="lbl" x="523.5" y="364" text-anchor="middle">Open that guide's troubleshooting section</text>
<text class="el" x="215" y="92" text-anchor="start">01 or 02</text>
<text class="el" x="215" y="146" text-anchor="start">04</text>
<text class="el" x="215" y="200" text-anchor="start">00 or 09</text>
<text class="el" x="215" y="254" text-anchor="start">12</text>
<text class="el" x="215" y="308" text-anchor="start">11</text>
<text class="el" x="215" y="354.5" text-anchor="start">other</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
