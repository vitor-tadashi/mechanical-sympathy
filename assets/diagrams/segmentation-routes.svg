<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" width="760" height="184" role="img" aria-labelledby="t d">
<title id="t">Every network gets an explicit route to its own NIC</title>
<desc id="d">Peers in 10.200.0.0/16 go out ens1f0, the backend in 10.10.2.0/24 ens1f1, replicas in 10.201.0.0/16 the bulk NIC ens2f0, and only unknown destinations fall through to the management default route on eno2. The addresses are made up.</desc>
