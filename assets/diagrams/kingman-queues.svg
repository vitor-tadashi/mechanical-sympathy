<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Same average service time, different variability: the erratic server builds the queue</title>
<desc id="d">Two charts of the number of waiting customers over time, for the same random arrivals at 80 percent utilization. A steady server that takes the same time for everyone keeps the queue near zero, with a mean wait of about 0.7 time units. An erratic server with the same average time but a few very slow customers builds queues that take long to clear, with a mean wait of about 1.7 units. The simulation is illustrative.</desc>
