<rect class="wait" x="200" y="28" width="200" height="46" rx="5"/><text class="lbl" x="300" y="48" text-anchor="middle">Asleep</text><text class="lbl" x="300" y="63" text-anchor="middle">C-states</text>
<rect class="box p2" x="455" y="28" width="230" height="46" rx="5"/><text class="lbl" x="570" y="48" text-anchor="middle">idle=poll, C-state caps,</text><text class="lbl" x="570" y="63" text-anchor="middle">PM QoS, BIOS</text>
<rect class="wait" x="200" y="90" width="200" height="46" rx="5"/><text class="lbl" x="300" y="110" text-anchor="middle">Slow clock</text><text class="lbl" x="300" y="125" text-anchor="middle">P-states, HWP</text>
<rect class="box p4" x="455" y="90" width="230" height="46" rx="5"/><text class="lbl" x="570" y="110" text-anchor="middle">acpi-cpufreq +</text><text class="lbl" x="570" y="125" text-anchor="middle">performance governor</text>
