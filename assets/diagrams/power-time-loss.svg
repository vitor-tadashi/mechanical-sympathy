  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(455px, 51px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(162.5px, 144px); } 6% { transform: translate(162.5px, 144px); } 6.76% { transform: translate(181.25px, 144px); } 10.56% { transform: translate(181.25px, 51px); } 11.32% { transform: translate(200px, 51px); } 19.48% { transform: translate(400px, 51px); } 21.72% { transform: translate(455px, 51px); } 100% { transform: translate(455px, 51px); } }
