<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" role="img" aria-labelledby="t d">
<title id="t">Four ways a CPU loses time to power and firmware management</title>
<desc id="d">A CPU loses time asleep in C-states, fixed by idle=poll, C-state caps, PM QoS and the BIOS; at a slow clock with P-states and HWP, fixed by acpi-cpufreq and the performance governor; at a varying clock with turbo and power limits, measured on and off or capped; and stopped by firmware SMIs, fixed by turning BIOS sources off and counting with turbostat.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
