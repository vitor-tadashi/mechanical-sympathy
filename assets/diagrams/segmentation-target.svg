<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
<title id="t">Each peer group reaches the host through its own NIC, and each NIC interrupts a chosen CPU</title>
<desc id="d">Clients reach ens1f0 and internal services ens1f1, the two critical NICs, which interrupt CPU 1 on node 1. The PTP grandmaster reaches eno1 and operators reach eno2, the management NIC with the default route, both interrupting CPU 0. Replication and log traffic reach the two bulk NICs, which interrupt CPU 30.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
