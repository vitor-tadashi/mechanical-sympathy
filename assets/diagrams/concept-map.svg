<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">The concepts build on each other from the hardware up</title>
<desc id="d">Hardware sets the costs. The kernel and CPU, and memory, decide who pays them. The network and the application are where a message spends its time, and measurement, with tail latency and queueing, tells you whether any of it worked.</desc>
