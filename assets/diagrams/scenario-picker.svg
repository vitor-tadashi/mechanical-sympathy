  .p6 { animation: p6 7s linear infinite; }
  @keyframes p6 { 0%, 58.63% { fill: #ffd166; stroke-width: 1.5; } 60.73% { fill: #ffb703; stroke-width: 3; } 68.73%, 100% { fill: #ffd166; stroke-width: 1.5; } }
