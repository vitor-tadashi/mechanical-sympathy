<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 299" width="760" height="299" role="img" aria-labelledby="t d">
<title id="t">Which scenario am I: A, B or C</title>
<desc id="d">A virtual machine goes to Scenario B. A physical host shared by several tenants, or one whose application cannot pin its threads, goes to Scenario C. A dedicated physical host with pinnable threads, one per CPU, gets the full treatment, Scenario A.</desc>
