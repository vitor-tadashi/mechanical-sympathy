<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting the measurement itself</title>
<desc id="d">Start from what failed: a missing tool, a missing SMI counter, or results that change between runs.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(420px, 237px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 15.25% { transform: translate(140px, 82.5px); } 21.25% { transform: translate(140px, 82.5px); } 28.03% { transform: translate(140px, 152.5px); } 34.03% { transform: translate(140px, 152.5px); } 40.82% { transform: translate(140px, 222.5px); } 46.82% { transform: translate(140px, 222.5px); } 74% { transform: translate(420px, 237px); } 80% { transform: translate(420px, 237px); } 100% { transform: translate(420px, 237px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 15.15% { fill: #ffffff; stroke-width: 1.5; } 17.25% { fill: #ffe9a8; stroke-width: 3; } 25.25%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 27.93% { fill: #ffffff; stroke-width: 1.5; } 30.03% { fill: #ffe9a8; stroke-width: 3; } 38.03%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 40.72% { fill: #ffffff; stroke-width: 1.5; } 42.82% { fill: #ffe9a8; stroke-width: 3; } 50.82%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 7s linear infinite; }
  @keyframes p5 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="332" rx="8"/>
<path class="walk" d="M140,49 L140,82.5" marker-end="url(#w)"/>
<path class="wire" d="M200,97 L420,97" marker-end="url(#a)"/>
<path class="walk" d="M140,111.5 L140,152.5" marker-end="url(#w)"/>
<path class="wire" d="M207.5,167 L420,167" marker-end="url(#a)"/>
<path class="walk" d="M140,181.5 L140,222.5" marker-end="url(#w)"/>
<path class="walk" d="M205.5,237 L420,237" marker-end="url(#w)"/>
<path class="wire" d="M140,251.5 L140,285" marker-end="url(#a)"/>
<rect class="foc" x="37" y="20" width="206" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">The measurement itself fails</text>
<polygon class="step p2" points="80,97 94,82.5 186,82.5 200,97 186,111.5 94,111.5"/><text class="lbl" x="140" y="101.5" text-anchor="middle">Tool missing?</text>
<rect class="box" x="420" y="75" width="202" height="44" rx="5"/><text class="lbl" x="521" y="94" text-anchor="middle">Enable the repository,</text><text class="lbl" x="521" y="109" text-anchor="middle">or use the tracer in tracefs</text>
<polygon class="step p3" points="72.5,167 86.5,152.5 193.5,152.5 207.5,167 193.5,181.5 86.5,181.5"/><text class="lbl" x="140" y="171.5" text-anchor="middle">No SMI column?</text>
<rect class="box" x="420" y="145" width="186" height="44" rx="5"/><text class="lbl" x="513" y="164" text-anchor="middle">VM: expected.</text><text class="lbl" x="513" y="179" text-anchor="middle">Bare metal: modprobe msr</text>
<polygon class="step p4" points="74.5,237 88.5,222.5 191.5,222.5 205.5,237 191.5,251.5 88.5,251.5"/><text class="lbl" x="140" y="241.5" text-anchor="middle">Runs disagree?</text>
<rect class="box p5" x="420" y="215" width="189" height="44" rx="5"/><text class="lbl" x="514.5" y="234" text-anchor="middle">Hold the load, the duration</text><text class="lbl" x="514.5" y="249" text-anchor="middle">and the environment (§3.5)</text>
<rect class="mut" x="68" y="285" width="144" height="29" rx="5"/><text class="lbl" x="140" y="304" text-anchor="middle">See the table below</text>
<text class="el" x="232" y="92" text-anchor="start">rtla or rt-tests</text>
<text class="el" x="146" y="136" text-anchor="start">no</text>
<text class="el" x="239.5" y="162" text-anchor="start">yes</text>
<text class="el" x="146" y="206" text-anchor="start">no</text>
<text class="el" x="237.5" y="232" text-anchor="start">yes</text>
<text class="el" x="146" y="272.25" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
