<path class="wire" d="M190.5,165 L300.25,165 L300.25,290 L410,290" marker-end="url(#a)"/>
<rect class="foc" x="49.5" y="143" width="141" height="44" rx="2"/><line class="sl" x1="55.5" y1="143" x2="55.5" y2="187"/><line class="sl" x1="184.5" y1="143" x2="184.5" y2="187"/><text class="lbl" x="120" y="162" text-anchor="middle">a cgroup</text><text class="lbl" x="120" y="177" text-anchor="middle">(slice or service)</text>
