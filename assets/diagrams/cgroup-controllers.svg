  .p8 { animation: p8 8s linear infinite; }
  @keyframes p8 { 0%, 62.88% { fill: #cfe3ff; stroke-width: 1.5; } 64.98% { fill: #9cc3ff; stroke-width: 3; } 72.98%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k9 { transform: translate(410px, 290px); animation: k9 8s linear infinite; }
  @keyframes k9 { 0% { transform: translate(190.5px, 165px); } 65.2% { transform: translate(190.5px, 165px); } 69.21% { transform: translate(300.25px, 165px); } 73.77% { transform: translate(300.25px, 290px); } 77.78% { transform: translate(410px, 290px); } 100% { transform: translate(410px, 290px); } }
  .p10 { animation: p10 8s linear infinite; }
  @keyframes p10 { 0%, 77.68% { fill: #eeeeee; stroke-width: 1.5; } 79.78% { fill: #d4d4d4; stroke-width: 3; } 87.78%, 100% { fill: #eeeeee; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6, .k7, .p8, .k9, .p10 { animation: none; }
  }
</style>
