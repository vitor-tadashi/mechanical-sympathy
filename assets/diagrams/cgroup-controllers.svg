  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(410px, 38px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(190.5px, 165px); } 6% { transform: translate(190.5px, 165px); } 9.98% { transform: translate(300.25px, 165px); } 14.6% { transform: translate(300.25px, 38px); } 18.58% { transform: translate(410px, 38px); } 100% { transform: translate(410px, 38px); } }
  .p2 { animation: p2 8s linear infinite; }
