<rect class="box p4" x="410" y="74" width="260" height="54" rx="5"/><text class="sm" x="540" y="91.5" text-anchor="middle">cpu</text><text class="sm" x="540" y="105.5" text-anchor="middle">weight, max (quota)</text><text class="sm" x="540" y="119.5" text-anchor="middle">CPUWeight=, CPUQuota=</text>
<rect class="box p6" x="410" y="137" width="260" height="54" rx="5"/><text class="sm" x="540" y="154.5" text-anchor="middle">memory</text><text class="sm" x="540" y="168.5" text-anchor="middle">max, high, low, min</text><text class="sm" x="540" y="182.5" text-anchor="middle">MemoryMax=, MemoryHigh=</text>
