<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-labelledby="t d">
<title id="t">The pool is reserved early in boot, before other services fragment memory</title>
<desc id="d">The kernel boots with hugepagesz=2M, then hugetlb-reserve-pages.service writes nr_hugepages per node in sysinit.target, then the mount and the other services start and fragment memory, and finally the application maps and pre-touches the pool it was given.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(452px, 150px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(152.5px, 56px); } 8% { transform: translate(152.5px, 56px); } 14% { transform: translate(152.5px, 56px); } 17.15% { transform: translate(223.5px, 56px); } 23.15% { transform: translate(223.5px, 56px); } 37.28% { transform: translate(541.5px, 56px); } 43.28% { transform: translate(541.5px, 56px); } 47.26% { transform: translate(620px, 99.25px); } 63.7% { transform: translate(250px, 99.25px); } 64.97% { transform: translate(250px, 128px); } 70.97% { transform: translate(250px, 128px); } 80% { transform: translate(452px, 150px); } 86% { transform: translate(452px, 150px); } 100% { transform: translate(452px, 150px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 17.05% { fill: #ffd166; stroke-width: 1.5; } 19.15% { fill: #ffb703; stroke-width: 3; } 31.15%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 79.9% { fill: #c8f0d0; stroke-width: 1.5; } 80%, 97% { fill: #8fe0a0; stroke-width: 3; } 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .c4 { animation: c4 8s linear infinite; }
  @keyframes c4 { 0%, 19.05% { opacity: 0; } 19.15%, 100% { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .c4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="210" rx="8"/>
<path class="wire" d="M152.5,56 L223.5,56" marker-end="url(#a)"/>
<path class="wire" d="M456.5,56 L541.5,56" marker-end="url(#a)"/>
<path class="wire" d="M620,70.5 L620,99.25 L250,99.25 L250,128" marker-end="url(#a)"/>
<path class="wire" d="M329.5,150 L452,150" marker-end="url(#a)"/>
<rect class="step" x="27.5" y="34" width="125" height="44" rx="5"/><text class="lbl" x="90" y="53" text-anchor="middle">Kernel boots</text><text class="lbl" x="90" y="68" text-anchor="middle">(hugepagesz=2M)</text>
<rect class="foc p2" x="223.5" y="34" width="233" height="44" rx="2"/><line class="sl" x1="229.5" y1="34" x2="229.5" y2="78"/><line class="sl" x1="450.5" y1="34" x2="450.5" y2="78"/><text class="lbl" x="340" y="53" text-anchor="middle">hugetlb-reserve-pages.service</text><text class="lbl" x="340" y="68" text-anchor="middle">writes nr_hugepages per node</text>
<rect class="step" x="541.5" y="41.5" width="157" height="29" rx="5"/><text class="lbl" x="620" y="60.5" text-anchor="middle">dev-hugepages.mount</text>
<rect class="mut" x="170.5" y="128" width="159" height="44" rx="5"/><text class="lbl" x="250" y="147" text-anchor="middle">Other services start,</text><text class="lbl" x="250" y="162" text-anchor="middle">memory fragments</text>
<rect class="app p3" x="452" y="128" width="216" height="44" rx="5"/><text class="lbl" x="560" y="147" text-anchor="middle">Application starts,</text><text class="lbl" x="560" y="162" text-anchor="middle">maps and pre-touches the pool</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
<text class="done c4" x="330" y="20" text-anchor="middle">2 MiB blocks still contiguous</text>
</svg>
