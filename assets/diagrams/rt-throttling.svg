<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d">
<title id="t">RT throttling stops a spinning SCHED_FIFO thread for 50 ms every second</title>
<desc id="d">One second of a CPU that runs one busy-spinning SCHED_FIFO thread. With the default sched_rt_runtime_us of 950000, the kernel deschedules the thread at 950 ms and keeps it off the CPU for 50 ms, so a message that arrives in that window waits up to 50 ms. With sched_rt_runtime_us set to -1 the thread keeps running and handles the same message at once.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .in { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b2613; text-anchor: middle; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .late { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; }
  .ok { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d6b33; }

  /* The picture is always complete. A playhead sweeps both lanes, and each event pulses as it passes. */
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  .thr { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: thr 6s linear infinite; animation-delay: -3.3s; }
  .msg { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: msg 6s linear infinite; animation-delay: -3.24s; }
  .msg-wait { animation-name: msgwait; }
  .pick { fill: #1d6b33; transform-box: fill-box; transform-origin: center; animation: pick 6s linear infinite; }

  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  /* The throttled block stays lit for the 5 % of the loop the playhead spends inside it. */
  @keyframes thr {
    0%, 5%   { fill: #ff6b6b; transform: scaleY(1.15); }
    6%, 100% { fill: #ffc9c9; transform: scaleY(1); }
  }
  @keyframes msg {
    0%, 3%   { fill: #ffb000; transform: scale(1.5); }
    6%, 100% { fill: #8a5a00; transform: scale(1); }
  }
  @keyframes pick {
    0%, 3%   { fill: #2fbf5a; transform: scaleY(1.3); }
    6%, 100% { fill: #1d6b33; transform: scaleY(1); }
  }
  /* The throttled lane's message stays lit until the thread is back on the CPU. */
  @keyframes msgwait {
    0%, 4%   { fill: #ffb000; transform: scale(1.5); }
    6%, 100% { fill: #8a5a00; transform: scale(1); }
  }

  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .head, .thr, .msg, .pick { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="290" rx="8"/>

<!-- Lane 1: default RT throttling -->
<rect class="lane" x="10" y="10" width="740" height="125" rx="6"/>
<text class="cap" x="24" y="34">Default: sched_rt_runtime_us = 950000 (of 1000000)</text>
<text class="sub" x="24" y="52">At 950 ms the kernel throttles (T) the thread for 50 ms. The message is picked up (green mark) only after.</text>
<text class="lbl" x="24" y="99">CPU 7</text>
<rect class="app" x="150" y="78" width="256" height="34" rx="4"/>
<text class="in" x="278" y="100">SCHED_FIFO spin (event.loop)</text>
<rect class="thr" x="407" y="78" width="28" height="34" rx="3"/>
<text class="lbl" x="421" y="100" text-anchor="middle">T</text>
<rect class="app" x="436" y="78" width="284" height="34" rx="4"/>
<text class="in" x="578" y="100">spin</text>
<rect class="pick" x="436" y="74" width="4" height="42" rx="1" style="animation-delay:-2.99s"/>
<path class="msg msg-wait" d="M412 60 l6 6 l-6 6 l-6 -6 z"/>
<text class="late" x="446" y="70">message waits up to 50 ms</text>
<text class="axis" x="150" y="128">0.5 s</text>
<text class="axis" x="404" y="128" text-anchor="end">950 ms</text>
<text class="axis" x="438" y="128" text-anchor="start">1 s</text>
<text class="axis" x="720" y="128">1.5 s</text>

<!-- Lane 2: throttling off -->
<rect class="lane" x="10" y="150" width="740" height="125" rx="6"/>
<text class="cap" x="24" y="174">sched_rt_runtime_us = -1</text>
<text class="sub" x="24" y="192">No cap. The thread keeps running and picks the message up (green mark) the moment it arrives.</text>
<text class="lbl" x="24" y="239">CPU 7</text>
<rect class="app" x="150" y="218" width="570" height="34" rx="4"/>
<text class="in" x="278" y="240">SCHED_FIFO spin (event.loop)</text>
<text class="in" x="578" y="240">spin</text>
<rect class="pick" x="410" y="214" width="4" height="42" rx="1" style="animation-delay:-3.24s"/>
<path class="msg" d="M412 200 l6 6 l-6 6 l-6 -6 z"/>
<text class="ok" x="446" y="210">message handled at once</text>
<text class="axis" x="150" y="268">0.5 s</text>
<text class="axis" x="404" y="268" text-anchor="end">950 ms</text>
<text class="axis" x="438" y="268" text-anchor="start">1 s</text>
<text class="axis" x="720" y="268">1.5 s</text>

<line class="head" x1="150" y1="62" x2="150" y2="258"/>
</svg>
