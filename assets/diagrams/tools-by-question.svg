<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-labelledby="t d">
<title id="t">Four questions, four families of measurement tools</title>
<desc id="d">Each question has its own tools: rtla osnoise and timerlat for a quiet CPU, perf stat and perf sched for a descheduled thread, turbostat and rtla hwnoise for hardware stealing time, and the application histogram, sockperf or hardware timestamps for the whole path.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(360px, 38px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(128.5px, 131px); } 6% { transform: translate(128.5px, 131px); } 6.87% { transform: translate(146.5px, 131px); } 11.38% { transform: translate(146.5px, 38px); } 13.39% { transform: translate(188px, 38px); } 18.43% { transform: translate(292px, 38px); } 21.73% { transform: translate(360px, 38px); } 100% { transform: translate(360px, 38px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 21.62% { fill: #cfe3ff; stroke-width: 1.5; } 23.72% { fill: #9cc3ff; stroke-width: 3; } 31.73%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k3 { transform: translate(360px, 100px); animation: k3 8s linear infinite; }
  @keyframes k3 { 0% { transform: translate(128.5px, 131px); } 24.5% { transform: translate(128.5px, 131px); } 25.58% { transform: translate(146.5px, 131px); } 27.44% { transform: translate(146.5px, 100px); } 29.32% { transform: translate(178px, 100px); } 36.75% { transform: translate(302px, 100px); } 40.23% { transform: translate(360px, 100px); } 100% { transform: translate(360px, 100px); } }
  .p4 { animation: p4 8s linear infinite; }
  @keyframes p4 { 0%, 40.12% { fill: #cfe3ff; stroke-width: 1.5; } 42.23% { fill: #9cc3ff; stroke-width: 3; } 50.22%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k5 { transform: translate(360px, 162px); animation: k5 8s linear infinite; }
  @keyframes k5 { 0% { transform: translate(128.5px, 131px); } 43% { transform: translate(128.5px, 131px); } 44.08% { transform: translate(146.5px, 131px); } 45.94% { transform: translate(146.5px, 162px); } 47.31% { transform: translate(169.5px, 162px); } 55.76% { transform: translate(310.5px, 162px); } 58.73% { transform: translate(360px, 162px); } 100% { transform: translate(360px, 162px); } }
  .p6 { animation: p6 8s linear infinite; }
  @keyframes p6 { 0%, 58.63% { fill: #cfe3ff; stroke-width: 1.5; } 60.73% { fill: #9cc3ff; stroke-width: 3; } 68.73%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k7 { transform: translate(360px, 224px); animation: k7 8s linear infinite; }
  @keyframes k7 { 0% { transform: translate(128.5px, 131px); } 61.5% { transform: translate(128.5px, 131px); } 62.37% { transform: translate(146.5px, 131px); } 66.88% { transform: translate(146.5px, 224px); } 68.14% { transform: translate(172.5px, 224px); } 74.68% { transform: translate(307.5px, 224px); } 77.22% { transform: translate(360px, 224px); } 100% { transform: translate(360px, 224px); } }
  .p8 { animation: p8 8s linear infinite; }
  @keyframes p8 { 0%, 77.12% { fill: #cfe3ff; stroke-width: 1.5; } 79.22% { fill: #9cc3ff; stroke-width: 3; } 87.22%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6, .k7, .p8 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="262" rx="8"/>
<path class="wire" d="M292,38 L360,38" marker-end="url(#a)"/>
<path class="wire" d="M302,100 L360,100" marker-end="url(#a)"/>
<path class="wire" d="M310.5,162 L360,162" marker-end="url(#a)"/>
<path class="wire" d="M307.5,224 L360,224" marker-end="url(#a)"/>
<path class="wire" d="M128.5,131 L146.5,131 L146.5,38 L188,38" marker-end="url(#a)"/>
<path class="wire" d="M128.5,131 L146.5,131 L146.5,100 L178,100" marker-end="url(#a)"/>
<path class="wire" d="M128.5,131 L146.5,131 L146.5,162 L169.5,162" marker-end="url(#a)"/>
<path class="wire" d="M128.5,131 L146.5,131 L146.5,224 L172.5,224" marker-end="url(#a)"/>
<polygon class="step" points="188,38 202,16 278,16 292,38 278,60 202,60"/><text class="lbl" x="240" y="35" text-anchor="middle">Is the CPU</text><text class="lbl" x="240" y="50" text-anchor="middle">quiet?</text>
<rect class="box p2" x="360" y="16" width="183" height="44" rx="5"/><text class="lbl" x="451.5" y="35" text-anchor="middle">rtla osnoise top -c CPUS</text><text class="lbl" x="451.5" y="50" text-anchor="middle">rtla timerlat top -c CPUS</text>
<polygon class="step" points="178,100 192,78 288,78 302,100 288,122 192,122"/><text class="lbl" x="240" y="97" text-anchor="middle">Is the thread</text><text class="lbl" x="240" y="112" text-anchor="middle">descheduled?</text>
<rect class="box p4" x="360" y="78" width="366" height="44" rx="5"/><text class="lbl" x="543" y="97" text-anchor="middle">perf stat -e context-switches,cpu-migrations -t TID</text><text class="lbl" x="543" y="112" text-anchor="middle">perf sched latency</text>
<polygon class="step" points="169.5,162 183.5,140 296.5,140 310.5,162 296.5,184 183.5,184"/><text class="lbl" x="240" y="159" text-anchor="middle">Is the hardware</text><text class="lbl" x="240" y="174" text-anchor="middle">stealing time?</text>
<rect class="box p6" x="360" y="140" width="194" height="44" rx="5"/><text class="lbl" x="457" y="159" text-anchor="middle">turbostat --show SMI</text><text class="lbl" x="457" y="174" text-anchor="middle">rtla hwnoise (hwlat tracer)</text>
<polygon class="step" points="172.5,224 186.5,202 293.5,202 307.5,224 293.5,246 186.5,246"/><text class="lbl" x="240" y="221" text-anchor="middle">How fast is the</text><text class="lbl" x="240" y="236" text-anchor="middle">whole path?</text>
<rect class="box p8" x="360" y="202" width="257" height="44" rx="5"/><text class="lbl" x="488.5" y="221" text-anchor="middle">application histogram (HdrHistogram)</text><text class="lbl" x="488.5" y="236" text-anchor="middle">sockperf, hardware timestamps</text>
<rect class="foc" x="15.5" y="109" width="113" height="44" rx="22"/><text class="lbl" x="72" y="128" text-anchor="middle">What do you</text><text class="lbl" x="72" y="143" text-anchor="middle">want to know?</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<circle class="tok k3" cx="0" cy="0" r="6"/>
<circle class="tok k5" cx="0" cy="0" r="6"/>
<circle class="tok k7" cx="0" cy="0" r="6"/>
</svg>
