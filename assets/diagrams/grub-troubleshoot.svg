<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting after the reboot: boot, CPU list, tick, threads</title>
<desc id="d">A troubleshooting walk after the reboot. Check whether the host boots, whether the kernel accepted the isolated CPU list, whether the tick stopped, and whether each thread has its own CPU.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(420px, 167px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 16.44% { transform: translate(140px, 82.5px); } 22.44% { transform: translate(140px, 82.5px); } 30.74% { transform: translate(140px, 145px); } 36.74% { transform: translate(140px, 145px); } 74% { transform: translate(420px, 167px); } 80% { transform: translate(420px, 167px); } 100% { transform: translate(420px, 167px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 16.34% { fill: #ffffff; stroke-width: 1.5; } 18.44% { fill: #ffe9a8; stroke-width: 3; } 26.44%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 30.64% { fill: #ffffff; stroke-width: 1.5; } 32.74% { fill: #ffe9a8; stroke-width: 3; } 40.74%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="402" rx="8"/>
<path class="walk" d="M140,49 L140,82.5" marker-end="url(#w)"/>
<path class="wire" d="M180,97 L420,97" marker-end="url(#a)"/>
<path class="walk" d="M140,111.5 L140,145" marker-end="url(#w)"/>
<path class="walk" d="M196.5,167 L420,167" marker-end="url(#w)"/>
<path class="wire" d="M140,189 L140,215" marker-end="url(#a)"/>
<path class="wire" d="M197,237 L420,237" marker-end="url(#a)"/>
<path class="wire" d="M140,259 L140,285" marker-end="url(#a)"/>
<path class="wire" d="M210.5,307 L420,307" marker-end="url(#a)"/>
<path class="wire" d="M140,329 L140,355" marker-end="url(#a)"/>
<rect class="foc" x="48" y="20" width="184" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Problem after the reboot</text>
<polygon class="step p2" points="100,97 114,82.5 166,82.5 180,97 166,111.5 114,111.5"/><text class="lbl" x="140" y="101.5" text-anchor="middle">Boots?</text>
<rect class="wait" x="420" y="75" width="241" height="44" rx="5"/><text class="lbl" x="540.5" y="94" text-anchor="middle">GRUB menu: e, delete the argument</text><text class="lbl" x="540.5" y="109" text-anchor="middle">from the linux line, Ctrl-x</text>
<polygon class="step p3" points="83.5,167 97.5,145 182.5,145 196.5,167 182.5,189 97.5,189"/><text class="lbl" x="140" y="164" text-anchor="middle">isolated file</text><text class="lbl" x="140" y="179" text-anchor="middle">empty?</text>
<rect class="box p4" x="420" y="145" width="232" height="44" rx="5"/><text class="lbl" x="536" y="164" text-anchor="middle">Args never reached BLS:</text><text class="lbl" x="536" y="179" text-anchor="middle">grubby --info=DEFAULT, re-apply</text>
<polygon class="step" points="83,237 97,215 183,215 197,237 183,259 97,259"/><text class="lbl" x="140" y="234" text-anchor="middle">LOC still</text><text class="lbl" x="140" y="249" text-anchor="middle">ticks at HZ?</text>
<rect class="box" x="420" y="215" width="298" height="44" rx="5"/><text class="lbl" x="569" y="234" text-anchor="middle">More than one task on the CPU, or a stray</text><text class="lbl" x="569" y="249" text-anchor="middle">kworker: fix the workqueue mask (Guide 02)</text>
<polygon class="step" points="69.5,307 83.5,285 196.5,285 210.5,307 196.5,329 83.5,329"/><text class="lbl" x="140" y="304" text-anchor="middle">Threads stacked</text><text class="lbl" x="140" y="319" text-anchor="middle">on one CPU?</text>
<rect class="box" x="420" y="285" width="191" height="44" rx="5"/><text class="lbl" x="515.5" y="304" text-anchor="middle">Pin each thread to one CPU</text><text class="lbl" x="515.5" y="319" text-anchor="middle">(Guide 02 §6)</text>
<rect class="mut" x="68" y="355" width="144" height="29" rx="5"/><text class="lbl" x="140" y="374" text-anchor="middle">See the table below</text>
<text class="el" x="212" y="92" text-anchor="start">no</text>
<text class="el" x="146" y="132.25" text-anchor="start">yes</text>
<text class="el" x="228.5" y="162" text-anchor="start">yes</text>
<text class="el" x="146" y="206" text-anchor="start">no</text>
<text class="el" x="229" y="232" text-anchor="start">yes</text>
<text class="el" x="146" y="276" text-anchor="start">no</text>
<text class="el" x="242.5" y="302" text-anchor="start">yes</text>
<text class="el" x="146" y="346" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
