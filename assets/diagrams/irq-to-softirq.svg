<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">When the softirq budget runs out, the rest waits for ksoftirqd</title>
<desc id="d">Two timelines of housekeeping CPU 1, which takes the critical NIC's interrupts. Under light load, each hard interrupt is followed at once by a short NET_RX softirq, and the packets are ready in microseconds. Under a burst, the softirq uses up its budget, the rest of the work is handed to the ksoftirqd thread, and ksoftirqd waits for the scheduler behind another task while the packets wait in the ring.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .seg { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .soft { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .other { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .wait { fill: none; stroke: #9b1c1c; stroke-width: 2; stroke-dasharray: 5 3; }
  .waitt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; text-anchor: middle; }
  .irq { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 6s linear infinite; }
  .ev { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 6s linear infinite; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes pulse {
    0%, 4%   { transform: scaleY(1.25); }
    8%, 100% { transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .irq, .ev, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="300" rx="8"/>

<!-- Lane 1: light load -->
<rect class="lane" x="10" y="10" width="740" height="135" rx="6"/>
<text class="cap" x="24" y="34">Light load: the softirq runs right after the interrupt</text>
<text class="sub" x="24" y="52">Hard IRQ (yellow), then NET_RX softirq on the same CPU. The packets are ready in microseconds.</text>
<text class="lbl" x="24" y="99">CPU 1</text>
<rect class="irq" x="200" y="78" width="12" height="34" rx="2" style="animation-delay:-5.47s"/>
<rect class="soft" x="212" y="78" width="70" height="34" rx="3"/><text class="seg" x="247" y="99">NET_RX</text>
<rect class="irq" x="450" y="78" width="12" height="34" rx="2" style="animation-delay:-2.84s"/>
<rect class="soft" x="462" y="78" width="70" height="34" rx="3"/><text class="seg" x="497" y="99">NET_RX</text>
<text class="axis" x="200" y="130">each burst handled in the softirq, inside its budget</text>

<!-- Lane 2: burst -->
<rect class="lane" x="10" y="155" width="740" height="135" rx="6"/>
<text class="cap" x="24" y="179">Burst: the budget runs out, the rest goes to ksoftirqd</text>
<text class="sub" x="24" y="197">ksoftirqd/1 is an ordinary thread. It waits for the scheduler while the packets wait in the ring.</text>
<text class="lbl" x="24" y="244">CPU 1</text>
<rect class="irq" x="200" y="223" width="12" height="34" rx="2" style="animation-delay:-5.47s"/>
<rect class="soft" x="212" y="223" width="118" height="34" rx="3"/><text class="seg" x="271" y="244">NET_RX: 300 pkts</text>
<rect class="ev" x="330" y="223" width="6" height="34" rx="1" style="animation-delay:-4.11s"/>
<rect class="other" x="336" y="223" width="114" height="34" rx="3"/><text class="seg" x="393" y="244">another task</text>
<rect class="soft" x="450" y="223" width="120" height="34" rx="3"/><text class="seg" x="510" y="244">ksoftirqd/1: the rest</text>
<path class="wait" d="M336 266 L450 266"/>
<text class="waitt" x="393" y="281">packets wait in the ring</text>
<text class="axis" x="590" y="281">red mark: budget used up</text>

<line class="head" x1="150" y1="70" x2="150" y2="262"/>
</svg>
