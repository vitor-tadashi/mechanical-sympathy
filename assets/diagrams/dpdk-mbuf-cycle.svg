<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d">
<title id="t">In DPDK an mbuf goes from the mempool to the ring, through your code, and back</title>
<desc id="d">The NIC DMAs each frame into an mbuf from a mempool in huge pages. The poll-mode core reads descriptors from the RX ring in bursts of 32 and takes the mbuf pointers, your code works on the mbufs, tx_burst puts them on the TX ring, and each mbuf is freed back to the mempool after it is sent.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
