<rect class="foc p3" x="287" y="48" width="116" height="44" rx="5"/><text class="lbl" x="345" y="67" text-anchor="middle">PMD core</text><text class="lbl" x="345" y="82" text-anchor="middle">rx_burst of 32</text>
<rect class="app" x="447" y="48" width="146" height="44" rx="5"/><text class="lbl" x="520" y="67" text-anchor="middle">your code</text><text class="lbl" x="520" y="82" text-anchor="middle">works on the mbufs</text>
<rect class="step" x="625.5" y="48" width="109" height="44" rx="5"/><text class="lbl" x="680" y="67" text-anchor="middle">tx_burst</text><text class="lbl" x="680" y="82" text-anchor="middle">to the TX ring</text>
