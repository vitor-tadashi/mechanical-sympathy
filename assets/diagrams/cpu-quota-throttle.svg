<rect class="ex" x="468.5" y="237" width="17.5" height="14" rx="2"/>
<rect class="ag" x="378.0" y="264" width="85.5" height="24" rx="3"/>
<rect class="th" x="464.5" y="264" width="25.5" height="24" rx="3"/>
