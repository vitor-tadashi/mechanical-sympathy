<line class="per" x1="378.0" y1="224" x2="378.0" y2="292"/>
<text class="cnt" x="476.0" y="310" style="animation-delay:-3.6s">+1</text>
<rect class="ag" x="492.0" y="232" width="85.5" height="24" rx="3"/>
<rect class="th" x="578.5" y="232" width="25.5" height="24" rx="3"/>
