<rect class="ag" x="606.0" y="232" width="85.5" height="24" rx="3"/>
<rect class="th" x="692.5" y="232" width="25.5" height="24" rx="3"/>
<rect class="ex" x="696.5" y="237" width="17.5" height="14" rx="2"/>
<rect class="ag" x="606.0" y="264" width="85.5" height="24" rx="3"/>
<rect class="th" x="692.5" y="264" width="25.5" height="24" rx="3"/>
<rect class="ex" x="696.5" y="269" width="17.5" height="14" rx="2"/>
<line class="per" x1="606.0" y1="224" x2="606.0" y2="292"/>
<text class="cnt" x="704.0" y="310" style="animation-delay:-0.4s">+1</text>
<text class="tag" x="192.8" y="249">agent</text>
<text class="axis" x="24" y="310">nr_throttled</text>
<text class="ok" x="150" y="334">hatched: the slice is throttled. A quarter of every period is free for other work.</text>
