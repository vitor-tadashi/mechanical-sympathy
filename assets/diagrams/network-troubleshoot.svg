<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" width="760" height="425" role="img" aria-labelledby="t d">
<title id="t">Troubleshooting network latency: drops, reverted settings, interrupt placement</title>
<desc id="d">Check drops first, then whether the settings survived, then where the NIC interrupts land. Each branch ends at a fix from the table.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 221px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 18.69% { transform: translate(140px, 109.5px); } 24.69% { transform: translate(140px, 109.5px); } 36.74% { transform: translate(140px, 218.5px); } 42.74% { transform: translate(140px, 218.5px); } 51.33% { transform: translate(214.5px, 240.5px); } 53.49% { transform: translate(214.5px, 221px); } 74% { transform: translate(400px, 221px); } 80% { transform: translate(400px, 221px); } 100% { transform: translate(400px, 221px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 18.59% { fill: #ffffff; stroke-width: 1.5; } 20.69% { fill: #ffe9a8; stroke-width: 3; } 28.69%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 36.64% { fill: #ffffff; stroke-width: 1.5; } 38.74% { fill: #ffe9a8; stroke-width: 3; } 46.74%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="425" rx="8"/>
<path class="walk" d="M140,49 L140,109.5" marker-end="url(#w)"/>
<path class="wire" d="M180,124 L204,124 L204,97 L400,97" marker-end="url(#a)"/>
<path class="wire" d="M180,124 L204,124 L204,151 L400,151" marker-end="url(#a)"/>
<path class="walk" d="M140,138.5 L140,218.5" marker-end="url(#w)"/>
<path class="walk" d="M190.5,240.5 L214.5,240.5 L214.5,221 L400,221" marker-end="url(#w)"/>
<path class="wire" d="M190.5,240.5 L214.5,240.5 L214.5,267.5 L400,267.5" marker-end="url(#a)"/>
<path class="wire" d="M140,262.5 L140,308" marker-end="url(#a)"/>
<path class="wire" d="M205.5,330 L400,330" marker-end="url(#a)"/>
<path class="wire" d="M140,352 L140,378" marker-end="url(#a)"/>
<rect class="foc" x="48" y="20" width="184" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Network latency or drops</text>
<polygon class="step p2" points="100,124 114,109.5 166,109.5 180,124 166,138.5 114,138.5"/><text class="lbl" x="140" y="128.5" text-anchor="middle">Drops?</text>
<rect class="box" x="400" y="75" width="244" height="44" rx="5"/><text class="lbl" x="522" y="94" text-anchor="middle">Ring too small or IRQ CPU too slow:</text><text class="lbl" x="522" y="109" text-anchor="middle">rings at max (§5.7), check squeezed</text>
<rect class="box" x="400" y="129" width="277" height="44" rx="5"/><text class="lbl" x="538.5" y="148" text-anchor="middle">IRQ CPU cannot keep up: dedicate it, add</text><text class="lbl" x="538.5" y="163" text-anchor="middle">a second CPU, or busy polling / bypass</text>
<polygon class="step p3" points="89.5,240.5 103.5,218.5 176.5,218.5 190.5,240.5 176.5,262.5 103.5,262.5"/><text class="lbl" x="140" y="237.5" text-anchor="middle">Settings</text><text class="lbl" x="140" y="252.5" text-anchor="middle">reverted?</text>
<rect class="box p4" x="400" y="199" width="223" height="44" rx="5"/><text class="lbl" x="511.5" y="218" text-anchor="middle">irqbalance, adaptive coalescing</text><text class="lbl" x="511.5" y="233" text-anchor="middle">or NetworkManager re-applying</text>
<rect class="box" x="400" y="253" width="233" height="29" rx="5"/><text class="lbl" x="516.5" y="272" text-anchor="middle">systemctl status lowlat-runtime</text>
<polygon class="step" points="74.5,330 88.5,308 191.5,308 205.5,330 191.5,352 88.5,352"/><text class="lbl" x="140" y="327" text-anchor="middle">NIC IRQs on an</text><text class="lbl" x="140" y="342" text-anchor="middle">isolated CPU?</text>
<rect class="box" x="400" y="308" width="308" height="44" rx="5"/><text class="lbl" x="554" y="327" text-anchor="middle">Run 04-network --runtime after any channel</text><text class="lbl" x="554" y="342" text-anchor="middle">change; add the device to NICS</text>
<rect class="mut" x="68" y="378" width="144" height="29" rx="5"/><text class="lbl" x="140" y="397" text-anchor="middle">See the table below</text>
<text class="el" x="212" y="92" text-anchor="start">ethtool -S drop/miss</text>
<text class="el" x="212" y="146" text-anchor="start">softnet squeezed</text>
<text class="el" x="146" y="182.5" text-anchor="start">none</text>
<text class="el" x="222.5" y="216" text-anchor="start">after minutes</text>
<text class="el" x="222.5" y="262.5" text-anchor="start">after reboot</text>
<text class="el" x="146" y="289.25" text-anchor="start">no</text>
<text class="el" x="237.5" y="325" text-anchor="start">yes</text>
<text class="el" x="146" y="369" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
