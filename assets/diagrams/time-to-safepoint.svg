<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
<title id="t">Every thread waits for the slowest one to reach a safepoint</title>
<desc id="d">Two timelines of three Java threads during one stop-the-world pause. In the first, worker.0 is in a long loop without a safepoint poll, so net.rx and event.loop stop at once and then wait, doing nothing, until worker.0 reaches a poll; only then does the short pause itself run. In the second, the loop polls often, every thread stops almost at once, and the whole stop is little more than the pause itself.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .seg { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .run { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.2; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.2; }
  .vm { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.2; }
  .req { stroke: #8a5a00; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pulse 6s linear infinite; }
  .rtxt { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes pulse {
    0%, 4%   { stroke-width: 6; }
    8%, 100% { stroke-width: 2.5; }
  }
  @media (prefers-reduced-motion: reduce) {
    .req, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="340" rx="8"/>
<rect class="lane" x="10" y="10" width="740" height="155" rx="6"/>
<text class="cap" x="24" y="34">A long loop without a safepoint poll</text>
<text class="sub" x="24" y="52">net.rx and event.loop stop at once and wait (red) for worker.0. Then the pause runs (blue).</text>
<text class="lbl" x="24" y="82">net.rx</text>
<rect class="run" x="150" y="68" width="102" height="18" rx="2"/>
<rect class="wait" x="252" y="68" width="178" height="18" rx="2"/>
<rect class="vm" x="430" y="68" width="40" height="18" rx="2"/>
<rect class="run" x="470" y="68" width="250" height="18" rx="2"/>
<text class="lbl" x="24" y="108">event.loop</text>
<rect class="run" x="150" y="94" width="106" height="18" rx="2"/>
<rect class="wait" x="256" y="94" width="174" height="18" rx="2"/>
<rect class="vm" x="430" y="94" width="40" height="18" rx="2"/>
<rect class="run" x="470" y="94" width="250" height="18" rx="2"/>
<text class="lbl" x="24" y="134">worker.0</text>
<rect class="run" x="150" y="120" width="280" height="18" rx="2"/>
<text class="seg" x="360" y="133">still in its loop</text>
<rect class="vm" x="430" y="120" width="40" height="18" rx="2"/>
<rect class="run" x="470" y="120" width="250" height="18" rx="2"/>
<line class="req" x1="250" y1="62" x2="250" y2="146" style="animation-delay:-4.95s"/>
<text class="rtxt" x="150" y="160">orange line: safepoint requested</text>
<text class="axis" x="440" y="160">stopped for the slowest thread</text>
<rect class="lane" x="10" y="175" width="740" height="155" rx="6"/>
<text class="cap" x="24" y="199">The loop polls often (loop strip mining, the JDK default)</text>
<text class="sub" x="24" y="217">Every thread reaches a poll within microseconds. The stop is little more than the pause itself.</text>
<text class="lbl" x="24" y="247">net.rx</text>
<rect class="run" x="150" y="233" width="102" height="18" rx="2"/>
<rect class="wait" x="252" y="233" width="12" height="18" rx="2"/>
<rect class="vm" x="264" y="233" width="40" height="18" rx="2"/>
<rect class="run" x="304" y="233" width="416" height="18" rx="2"/>
<text class="lbl" x="24" y="273">event.loop</text>
<rect class="run" x="150" y="259" width="106" height="18" rx="2"/>
<rect class="wait" x="256" y="259" width="8" height="18" rx="2"/>
<rect class="vm" x="264" y="259" width="40" height="18" rx="2"/>
<rect class="run" x="304" y="259" width="416" height="18" rx="2"/>
<text class="lbl" x="24" y="299">worker.0</text>
<rect class="run" x="150" y="285" width="112" height="18" rx="2"/>
<rect class="wait" x="262" y="285" width="2" height="18" rx="2"/>
<rect class="vm" x="264" y="285" width="40" height="18" rx="2"/>
<rect class="run" x="304" y="285" width="416" height="18" rx="2"/>
<line class="req" x1="250" y1="227" x2="250" y2="311" style="animation-delay:-4.95s"/>
<text class="rtxt" x="150" y="325">orange line: safepoint requested</text>
<text class="axis" x="440" y="325">stopped for the pause only</text>
<line class="head" x1="150" y1="62" x2="150" y2="318"/>
</svg>
