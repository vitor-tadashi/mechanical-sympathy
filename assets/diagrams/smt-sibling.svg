<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="t d">
<title id="t">A busy Hyper-Threading sibling slows the thread on the other half of the core</title>
<desc id="d">Two timelines for one physical core with two logical CPUs, 15 and 39. The event.loop thread on CPU 15 handles the same messages in both. When worker.2 runs on the sibling CPU 39, the two threads share the core's caches and execution ports, and every message handled during a worker burst takes longer. When the sibling is left idle, every message takes the same short time.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .track { fill: #ffffff; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-dasharray: 4 3; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .in { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }
  .ev { transform-box: fill-box; transform-origin: center; animation: flash 6s linear infinite; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 6s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes flash {
    0%, 3%   { transform: scaleY(1.3); stroke-width: 3; }
    6%, 100% { transform: scaleY(1); stroke-width: 1.5; }
  }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ev, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="310" rx="8"/>

<!-- Lane 1: sibling busy -->
<rect class="lane" x="10" y="10" width="740" height="140" rx="6"/>
<text class="cap" x="24" y="34">Sibling busy: worker.2 pinned to CPU 39, the other half of core 15</text>
<text class="sub" x="24" y="52">Both threads share L1, L2, the TLBs and the execution ports. Messages handled during a burst take longer.</text>
<text class="lbl" x="24" y="84">CPU 15</text>
<rect class="track" x="150" y="68" width="570" height="22" rx="3"/>
<rect class="app" x="160" y="68" width="24" height="22" rx="2"/>
<rect class="app" x="230" y="68" width="24" height="22" rx="2"/>
<rect class="app" x="300" y="68" width="24" height="22" rx="2"/>
<rect class="wait ev" x="324" y="68" width="14" height="22" rx="2" style="animation-delay:-4.17s"/>
<rect class="app" x="370" y="68" width="24" height="22" rx="2"/>
<rect class="wait ev" x="394" y="68" width="14" height="22" rx="2" style="animation-delay:-3.43s"/>
<rect class="app" x="440" y="68" width="24" height="22" rx="2"/>
<rect class="wait ev" x="464" y="68" width="14" height="22" rx="2" style="animation-delay:-2.69s"/>
<rect class="app" x="510" y="68" width="24" height="22" rx="2"/>
<rect class="app" x="580" y="68" width="24" height="22" rx="2"/>
<rect class="app" x="650" y="68" width="24" height="22" rx="2"/>
<rect class="wait ev" x="674" y="68" width="14" height="22" rx="2" style="animation-delay:-0.48s"/>
<text class="lbl" x="24" y="119">CPU 39</text>
<rect class="track" x="150" y="103" width="570" height="22" rx="3"/>
<rect class="box" x="280" y="103" width="200" height="22" rx="2"/>
<text class="in" x="380" y="119">worker.2 busy</text>
<rect class="box" x="620" y="103" width="80" height="22" rx="2"/>
<text class="in" x="660" y="119">busy</text>
<text class="axis" x="435" y="142">schematic · green: event.loop handles a message · red: the extra time while the sibling runs</text>

<!-- Lane 2: sibling idle -->
<rect class="lane" x="10" y="160" width="740" height="140" rx="6"/>
<text class="cap" x="24" y="184">Sibling idle: no thread on CPU 39 (or Hyper-Threading off)</text>
<text class="sub" x="24" y="202">The same messages. The core serves one thread, and every message takes the same time.</text>
<text class="lbl" x="24" y="234">CPU 15</text>
<rect class="track" x="150" y="218" width="570" height="22" rx="3"/>
<rect class="app" x="160" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="230" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="300" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="370" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="440" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="510" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="580" y="218" width="24" height="22" rx="2"/>
<rect class="app" x="650" y="218" width="24" height="22" rx="2"/>
<text class="lbl" x="24" y="269">CPU 39</text>
<rect class="mut" x="150" y="253" width="570" height="22" rx="3"/>
<text class="in" x="435" y="269">idle sibling: isolated with its core, no thread pinned</text>
<text class="axis" x="435" y="292">worker.2 moved to a core of its own</text>

<line class="head" x1="150" y1="62" x2="150" y2="280"/>
</svg>
