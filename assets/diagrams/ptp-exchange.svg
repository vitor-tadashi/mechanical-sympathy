<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 261" width="760" height="261" role="img" aria-labelledby="t d">
<title id="t">Four PTP timestamps give the path delay and the offset</title>
<desc id="d">The master sends Sync, stamped t1 when it leaves and t2 when it reaches the NIC, then Follow_Up with t1. ptp4l sends Delay_Req, stamped t3, and the master answers Delay_Resp with t4. The offset is ((t2 - t1) - (t4 - t3)) / 2, assuming a symmetric path, and the PHC is adjusted by it.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .life { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .k1 { transform: translate(606px, 183px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(154px, 69px); } 6% { transform: translate(154px, 69px); } 23% { transform: translate(606px, 69px); } 25.8% { transform: translate(606px, 69px); } 26% { transform: translate(154px, 107px); } 43% { transform: translate(606px, 107px); } 45.8% { transform: translate(606px, 107px); } 46% { transform: translate(606px, 145px); } 63% { transform: translate(154px, 145px); } 65.8% { transform: translate(154px, 145px); } 66% { transform: translate(154px, 183px); } 83% { transform: translate(606px, 183px); } 85.8% { transform: translate(606px, 183px); } 100% { transform: translate(606px, 183px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="261" rx="8"/>
<line class="life" x1="150" y1="43" x2="150" y2="245"/>
<line class="life" x1="610" y1="43" x2="610" y2="245"/>
<path class="wire" d="M154,69 L606,69" marker-end="url(#a)"/>
<path class="wire" d="M154,107 L606,107" marker-end="url(#a)"/>
<path class="wire" d="M606,145 L154,145" marker-end="url(#a)"/>
<path class="wire" d="M154,183 L606,183" marker-end="url(#a)"/>
<rect class="foc" x="355.56" y="208" width="394.44" height="22" rx="4"/>
<text class="sm" x="552.78" y="223" text-anchor="middle">offset = ((t2 - t1) - (t4 - t3)) / 2, then the PHC is adjusted</text>
<rect class="box" x="73" y="14" width="154" height="29" rx="5"/><text class="lbl" x="150" y="33" text-anchor="middle">Master (switch port)</text>
<rect class="foc" x="559.5" y="14" width="101" height="29" rx="5"/><text class="lbl" x="610" y="33" text-anchor="middle">ptp4l on eno1</text>
<text class="el" x="380" y="63" text-anchor="middle">Sync (hardware timestamp t1 at master, t2 at NIC)</text>
<text class="el" x="380" y="101" text-anchor="middle">Follow_Up (carries t1)</text>
<text class="el" x="380" y="139" text-anchor="middle">Delay_Req (t3 at NIC)</text>
<text class="el" x="380" y="177" text-anchor="middle">Delay_Resp (carries t4)</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
