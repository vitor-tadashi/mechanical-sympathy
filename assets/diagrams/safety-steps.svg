<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="t d">
<title id="t">Plan and dry-run change nothing; apply saves the originals; after the reboot keep it or roll back</title>
<desc id="d">--plan shows what applies to this host and --dry-run prints every command and file, and neither changes anything. --apply saves the originals before it writes. After the reboot you verify and measure, then keep the result or run --rollback and reboot.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(520px, 155.5px); animation: k1 9s linear infinite; }
  @keyframes k1 { 0%, 5.8% { transform: translate(156px, 60px); opacity: 0; } 6% { transform: translate(156px, 60px); opacity: 1; } 7.39% { transform: translate(186px, 60px); opacity: 1; } 15.14% { transform: translate(354px, 60px); opacity: 1; } 16.53% { transform: translate(384px, 60px); opacity: 1; } 23.55% { transform: translate(536px, 60px); opacity: 1; } 25.19% { transform: translate(571.5px, 60px); opacity: 1; } 28.51% { transform: translate(640px, 82px); opacity: 1; } 30.21% { transform: translate(640px, 118.75px); opacity: 1; } 35.75% { transform: translate(520px, 118.75px); opacity: 1; } 37.45% { transform: translate(520px, 155.5px); opacity: 1; } 42.8% { transform: translate(520px, 155.5px); opacity: 1; } 43%, 100% { transform: translate(520px, 155.5px); opacity: 0; } }
  .p2 { animation: p2 9s linear infinite; }
  @keyframes p2 { 0%, 37.35% { fill: #c8f0d0; stroke-width: 1.5; } 39.45% { fill: #8fe0a0; stroke-width: 3; } 47.45%, 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  .k3 { transform: translate(670px, 155.5px); animation: k3 9s linear infinite; }
  @keyframes k3 { 0%, 42.8% { transform: translate(156px, 60px); opacity: 0; } 43% { transform: translate(156px, 60px); opacity: 1; } 44.6% { transform: translate(186px, 60px); opacity: 1; } 53.54% { transform: translate(354px, 60px); opacity: 1; } 55.13% { transform: translate(384px, 60px); opacity: 1; } 63.22% { transform: translate(536px, 60px); opacity: 1; } 65.11% { transform: translate(571.5px, 60px); opacity: 1; } 68.94% { transform: translate(640px, 82px); opacity: 1; } 70.9% { transform: translate(640px, 118.75px); opacity: 1; } 72.49% { transform: translate(670px, 118.75px); opacity: 1; } 74.45% { transform: translate(670px, 155.5px); opacity: 1; } 79.8% { transform: translate(670px, 155.5px); opacity: 1; } 80%, 100% { transform: translate(670px, 155.5px); opacity: 0; } }
  .p4 { animation: p4 9s linear infinite; }
  @keyframes p4 { 0%, 74.35% { fill: #ffc9c9; stroke-width: 1.5; } 76.45% { fill: #ff9b9b; stroke-width: 3; } 84.45%, 100% { fill: #ffc9c9; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="220" rx="8"/>
<path class="wire" d="M156,60 L186,60" marker-end="url(#a)"/>
<path class="wire" d="M354,60 L384,60" marker-end="url(#a)"/>
<path class="wire" d="M536,60 L571.5,60" marker-end="url(#a)"/>
<path class="wire" d="M640,82 L640,118.75 L520,118.75 L520,155.5" marker-end="url(#a)"/>
<path class="wire" d="M640,82 L640,118.75 L670,118.75 L670,155.5" marker-end="url(#a)"/>
<text class="note" x="180" y="120" text-anchor="middle">these two change nothing</text>
<rect class="box" x="24" y="38" width="132" height="44" rx="5"/><text class="lbl" x="90" y="57" text-anchor="middle">--plan</text><text class="lbl" x="90" y="72" text-anchor="middle">what applies here</text>
<rect class="box" x="186" y="38" width="168" height="44" rx="5"/><text class="lbl" x="270" y="57" text-anchor="middle">--dry-run</text><text class="lbl" x="270" y="72" text-anchor="middle">every command and file</text>
<rect class="step" x="384" y="38" width="152" height="44" rx="5"/><text class="lbl" x="460" y="57" text-anchor="middle">--apply</text><text class="lbl" x="460" y="72" text-anchor="middle">originals saved first</text>
<polygon class="step" points="571.5,60 585.5,38 694.5,38 708.5,60 694.5,82 585.5,82"/><text class="lbl" x="640" y="57" text-anchor="middle">reboot,</text><text class="lbl" x="640" y="72" text-anchor="middle">verify, measure</text>
<rect class="app p2" x="488" y="155.5" width="64" height="29" rx="14.5"/><text class="lbl" x="520" y="174.5" text-anchor="middle">keep it</text>
<rect class="wait p4" x="601.5" y="155.5" width="137" height="29" rx="14.5"/><text class="lbl" x="670" y="174.5" text-anchor="middle">--rollback, reboot</text>
<text class="el" x="580" y="113.75" text-anchor="middle">good</text>
<text class="el" x="646" y="104.375" text-anchor="start">bad</text>
<circle class="tok k1" cx="0" cy="0" r="6"/>
<circle class="tok k3" cx="0" cy="0" r="6"/>
</svg>
