  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .life { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .k1 { transform: translate(214px, 285px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(214px, 103px); } 6% { transform: translate(214px, 103px); } 23% { transform: translate(546px, 103px); } 25.8% { transform: translate(546px, 103px); } 26% { transform: translate(546px, 141px); } 43% { transform: translate(214px, 141px); } 45.8% { transform: translate(214px, 141px); } 46% { transform: translate(214px, 247px); } 63% { transform: translate(546px, 247px); } 65.8% { transform: translate(546px, 247px); } 66% { transform: translate(546px, 285px); } 83% { transform: translate(214px, 285px); } 85.8% { transform: translate(214px, 285px); } 100% { transform: translate(214px, 285px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="329" rx="8"/>
<line class="life" x1="210" y1="43" x2="210" y2="313"/>
<line class="life" x1="550" y1="43" x2="550" y2="313"/>
<rect class="mut" x="150" y="56" width="460" height="22" rx="4"/>
<text class="sm" x="380" y="71" text-anchor="middle">app in user.slice with AllowedCPUs=OS_CPUS (cpuset)</text>
<path class="wire" d="M214,103 L546,103" marker-end="url(#a)"/>
<path class="wire dash" d="M546,141 L214,141" marker-end="url(#a)"/>
<rect class="wait" x="59.76" y="166" width="300.48" height="22" rx="4"/>
<text class="sm" x="210" y="181" text-anchor="middle">crashes, or runs "pinned" threads unpinned</text>
<rect class="app" x="150" y="200" width="460" height="22" rx="4"/>
<text class="sm" x="380" y="215" text-anchor="middle">app in latency.slice with AllowedCPUs=0-31</text>
<path class="wire" d="M214,247 L546,247" marker-end="url(#a)"/>
<path class="wire dash" d="M546,285 L214,285" marker-end="url(#a)"/>
<rect class="app" x="152.5" y="14" width="115" height="29" rx="5"/><text class="lbl" x="210" y="33" text-anchor="middle">critical thread</text>
<rect class="box" x="520" y="14" width="60" height="29" rx="5"/><text class="lbl" x="550" y="33" text-anchor="middle">kernel</text>
<text class="el" x="380" y="97" text-anchor="middle">sched_setaffinity(CPU 9, isolated)</text>
<text class="el" x="380" y="135" text-anchor="middle">EINVAL, CPU 9 is outside the cpuset</text>
<text class="el" x="380" y="241" text-anchor="middle">sched_setaffinity(CPU 9, isolated)</text>
<text class="el" x="380" y="279" text-anchor="middle">0, pinned</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
