<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 329" width="760" height="329" role="img" aria-labelledby="t d">
<title id="t">The same pinning call fails inside a cpuset without the isolated CPUs</title>
<desc id="d">A critical thread asks the kernel to pin it to isolated CPU 9. Inside user.slice with AllowedCPUs set to the OS CPUs, the call fails with EINVAL and the thread crashes or runs unpinned. Inside latency.slice with AllowedCPUs=0-31, the same call succeeds.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
