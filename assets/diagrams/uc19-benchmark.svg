<path class="walk" d="M140,134 L140,187" marker-end="url(#w)"/>
<path class="walk" d="M210.5,209 L234.5,209 L234.5,182 L400,182" marker-end="url(#w)"/>
<path class="wire" d="M210.5,209 L234.5,209 L234.5,236 L400,236" marker-end="url(#a)"/>
<rect class="foc" x="32" y="20" width="216" height="44" rx="22"/><text class="lbl" x="140" y="39" text-anchor="middle">Benchmark p99.99 looks great,</text><text class="lbl" x="140" y="54" text-anchor="middle">production disagrees</text>
<polygon class="step p2" points="79,112 93,90 187,90 201,112 187,134 93,134"/><text class="lbl" x="140" y="109" text-anchor="middle">Client waits</text><text class="lbl" x="140" y="124" text-anchor="middle">for answers?</text>
<rect class="mut" x="400" y="90" width="217" height="44" rx="5"/><text class="lbl" x="508.5" y="109" text-anchor="middle">Open loop already: compare the</text><text class="lbl" x="508.5" y="124" text-anchor="middle">environments (Guide 09 §3.5)</text>
<polygon class="step p3" points="69.5,209 83.5,187 196.5,187 210.5,209 196.5,231 83.5,231"/><text class="lbl" x="140" y="206" text-anchor="middle">Samples below</text><text class="lbl" x="140" y="221" text-anchor="middle">duration × rate?</text>
<rect class="wait p4" x="400" y="160" width="272" height="44" rx="5"/><text class="lbl" x="536" y="179" text-anchor="middle">Coordinated omission: re-run open loop,</text><text class="lbl" x="536" y="194" text-anchor="middle">or correct the histogram (§3)</text>
<rect class="box" x="400" y="214" width="181" height="44" rx="5"/><text class="lbl" x="490.5" y="233" text-anchor="middle">Look for a stall the</text><text class="lbl" x="490.5" y="248" text-anchor="middle">client timed (Guide 09 §7)</text>
<text class="el" x="233" y="107" text-anchor="start">no</text>
<text class="el" x="146" y="164.5" text-anchor="start">yes</text>
<text class="el" x="242.5" y="177" text-anchor="start">yes</text>
<text class="el" x="242.5" y="231" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
