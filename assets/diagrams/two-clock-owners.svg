<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Two daemons steering one clock make it zigzag; one owner keeps it flat</title>
<desc id="d">Two plots of the system clock offset over a few minutes. When chronyd and phc2sys both steer the same clock, each pulls it toward its own source, and the offset zigzags by tens of microseconds. With one owner, phc2sys from PTP or chronyd alone, the offset stays within about a microsecond. The numbers are illustrative.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .plot { fill: #ffffff; stroke: #d0d7de; }
  .zero { stroke: #57606a; stroke-dasharray: 3 3; }
  .bad { fill: none; stroke: #9b1c1c; stroke-width: 2; }
  .good { fill: none; stroke: #1d6b33; stroke-width: 2; }
  .ax { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .tag { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
  .t1 { fill: #1f4e8c; } .t2 { fill: #8a5a00; }
  .kick { transform-box: fill-box; transform-origin: center; animation: pop 8s linear infinite; }
  .k1 { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; } .k2 { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  @keyframes pop { 0%, 4% { transform: scale(1.6); } 9%, 100% { transform: scale(1); } }
  .head { transform: translateX(570px); animation: sweep 8s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .kick, .head { animation: none; }
    .head { display: none; }
  }
</style>
