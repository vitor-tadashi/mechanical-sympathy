<rect class="foc" x="35" y="20" width="210" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">Slow only in the first minutes</text>
<polygon class="step p2" points="64,97 78,75 202,75 216,97 202,119 78,119"/><text class="lbl" x="140" y="94" text-anchor="middle">HugePages_Free</text><text class="lbl" x="140" y="109" text-anchor="middle">dropped at start?</text>
<rect class="box" x="400" y="75" width="229" height="44" rx="5"/><text class="lbl" x="514.5" y="94" text-anchor="middle">The JVM fell back to 4 KiB pages:</text><text class="lbl" x="514.5" y="109" text-anchor="middle">flags, pool size (Guide 03 §9)</text>
<polygon class="step p3" points="78,167 92,145 188,145 202,167 188,189 92,189"/><text class="lbl" x="140" y="164" text-anchor="middle">Huge pages on</text><text class="lbl" x="140" y="179" text-anchor="middle">node 1?</text>
<rect class="box" x="400" y="145" width="161" height="44" rx="5"/><text class="lbl" x="480.5" y="164" text-anchor="middle">Bind the JVM to node 1</text><text class="lbl" x="480.5" y="179" text-anchor="middle">(Guide 03 §5.3)</text>
<polygon class="step p4" points="70.5,237 84.5,215 195.5,215 209.5,237 195.5,259 84.5,259"/><text class="lbl" x="140" y="234" text-anchor="middle">AlwaysPreTouch</text><text class="lbl" x="140" y="249" text-anchor="middle">on?</text>
<rect class="box p5" x="400" y="222.5" width="171" height="29" rx="5"/><text class="lbl" x="485.5" y="241.5" text-anchor="middle">Pre-touch the heap (§3)</text>
<rect class="mut" x="54.5" y="285" width="171" height="44" rx="5"/><text class="lbl" x="140" y="304" text-anchor="middle">JIT and cold caches:</text><text class="lbl" x="140" y="319" text-anchor="middle">warm up before traffic</text>
<text class="el" x="248" y="92" text-anchor="start">no</text>
<text class="el" x="146" y="136" text-anchor="start">yes</text>
<text class="el" x="234" y="162" text-anchor="start">no</text>
<text class="el" x="146" y="206" text-anchor="start">yes</text>
<text class="el" x="241.5" y="232" text-anchor="start">no</text>
