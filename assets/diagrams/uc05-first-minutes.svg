  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 237px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 14.68% { transform: translate(140px, 75px); } 20.68% { transform: translate(140px, 75px); } 27.89% { transform: translate(140px, 145px); } 33.89% { transform: translate(140px, 145px); } 41.11% { transform: translate(140px, 215px); } 47.11% { transform: translate(140px, 215px); } 74% { transform: translate(400px, 237px); } 80% { transform: translate(400px, 237px); } 100% { transform: translate(400px, 237px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 14.58% { fill: #ffffff; stroke-width: 1.5; } 16.68% { fill: #ffe9a8; stroke-width: 3; } 24.68%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 27.79% { fill: #ffffff; stroke-width: 1.5; } 29.89% { fill: #ffe9a8; stroke-width: 3; } 37.89%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 41.01% { fill: #ffffff; stroke-width: 1.5; } 43.11% { fill: #ffe9a8; stroke-width: 3; } 51.11%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 7s linear infinite; }
