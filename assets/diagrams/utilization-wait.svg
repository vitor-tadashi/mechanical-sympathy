<text class="mtxt" x="369.0" y="274.3">9 S</text>
<circle cx="517.0" cy="312.0" r="4" fill="#1f4e8c"/><circle cx="517.0" cy="247.1" r="4" fill="#9b1c1c"/>
<text class="mtxt" x="491.0" y="241.1">15 S</text>
<circle cx="639.0" cy="276.0" r="4" fill="#1f4e8c"/><circle cx="639.0" cy="81.3" r="4" fill="#9b1c1c"/>
<text class="mtxt" x="613.0" y="75.3">46 S</text>
<line class="p99" x1="110" y1="82" x2="140" y2="82"/><text class="lbl" x="148" y="86" fill="#9b1c1c">p99, variable service time</text>
<line class="det" x1="110" y1="102" x2="140" y2="102"/><text class="lbl" x="148" y="106" fill="#1d6b33">p99, fixed service time (no jitter)</text>
<line class="mean" x1="110" y1="122" x2="140" y2="122"/><text class="lbl" x="148" y="126" fill="#1f4e8c">mean, variable service time</text>
<text class="axis" x="24" y="392">One server, random arrivals (M/M/1 theory); the fixed-service curve is simulated. Shapes, not measurements.</text>
</svg>
