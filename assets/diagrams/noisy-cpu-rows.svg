<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 353" width="760" height="353" role="img" aria-labelledby="t d">
<title id="t">Which interrupt row increases tells you who disturbs an isolated CPU</title>
<desc id="d">Start from a noisy isolated CPU and read the row of /proc/interrupts that keeps increasing: the tick, a rescheduling IPI, a TLB shootdown, a device interrupt, or none, which points at a kernel thread or RT throttling.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(370px, 259px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(110px, 49px); } 6% { transform: translate(110px, 49px); } 12% { transform: translate(110px, 49px); } 28.63% { transform: translate(110px, 183px); } 34.63% { transform: translate(110px, 183px); } 44.52% { transform: translate(186.5px, 205px); } 51.22% { transform: translate(186.5px, 259px); } 74% { transform: translate(370px, 259px); } 80% { transform: translate(370px, 259px); } 100% { transform: translate(370px, 259px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 28.53% { fill: #ffffff; stroke-width: 1.5; } 30.63% { fill: #ffe9a8; stroke-width: 3; } 38.63%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="353" rx="8"/>
<path class="walk" d="M110,49 L110,183" marker-end="url(#w)"/>
<path class="wire" d="M162.5,205 L186.5,205 L186.5,97 L370,97" marker-end="url(#a)"/>
<path class="wire" d="M162.5,205 L186.5,205 L186.5,151 L370,151" marker-end="url(#a)"/>
<path class="wire" d="M162.5,205 L370,205" marker-end="url(#a)"/>
<path class="walk" d="M162.5,205 L186.5,205 L186.5,259 L370,259" marker-end="url(#w)"/>
<path class="wire" d="M162.5,205 L186.5,205 L186.5,313 L370,313" marker-end="url(#a)"/>
<rect class="foc" x="32.5" y="20" width="155" height="29" rx="14.5"/><text class="lbl" x="110" y="39" text-anchor="middle">Isolated CPU is noisy</text>
<polygon class="step p2" points="57.5,205 71.5,183 148.5,183 162.5,205 148.5,227 71.5,227"/><text class="lbl" x="110" y="202" text-anchor="middle">Which row</text><text class="lbl" x="110" y="217" text-anchor="middle">increases?</text>
<rect class="box" x="370" y="75" width="311" height="44" rx="5"/><text class="lbl" x="525.5" y="94" text-anchor="middle">More than one runnable task, or nohz_full not</text><text class="lbl" x="525.5" y="109" text-anchor="middle">active: check ps -eLo psr and Guide 01 §7</text>
<rect class="box" x="370" y="129" width="235" height="44" rx="5"/><text class="lbl" x="487.5" y="148" text-anchor="middle">Another task keeps waking there:</text><text class="lbl" x="487.5" y="163" text-anchor="middle">find it with ps -eLo psr,comm</text>
<rect class="box" x="370" y="183" width="294" height="44" rx="5"/><text class="lbl" x="517" y="202" text-anchor="middle">munmap or mprotect in the process: fewer</text><text class="lbl" x="517" y="217" text-anchor="middle">mapping changes, huge pages (Guide 03)</text>
<rect class="box p3" x="370" y="237" width="191" height="44" rx="5"/><text class="lbl" x="465.5" y="256" text-anchor="middle">IRQ affinity or irqbalance:</text><text class="lbl" x="465.5" y="271" text-anchor="middle">§4.3 and Guide 04 §6</text>
<rect class="box" x="370" y="291" width="219" height="44" rx="5"/><text class="lbl" x="479.5" y="310" text-anchor="middle">Kernel thread or RT throttling:</text><text class="lbl" x="479.5" y="325" text-anchor="middle">rtla osnoise top, §4.4, §5</text>
<text class="el" x="194.5" y="92" text-anchor="start">LOC at HZ</text>
<text class="el" x="194.5" y="146" text-anchor="start">RES</text>
<text class="el" x="194.5" y="200" text-anchor="start">CAL or TLB</text>
<text class="el" x="194.5" y="254" text-anchor="start">a NIC row</text>
<text class="el" x="194.5" y="308" text-anchor="start">none, still slow</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
