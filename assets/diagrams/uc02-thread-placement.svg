<rect class="foc" x="102.5" y="20" width="75" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">A thread</text>
<polygon class="step" points="78,97 92,75 188,75 202,97 188,119 92,119"/><text class="lbl" x="140" y="94" text-anchor="middle">On the</text><text class="lbl" x="140" y="109" text-anchor="middle">critical path?</text>
<rect class="app p2" x="400" y="75" width="218" height="44" rx="5"/><text class="lbl" x="509" y="94" text-anchor="middle">Isolated CPU on the NIC's node</text><text class="lbl" x="509" y="109" text-anchor="middle">one thread per CPU, pinned</text>
<polygon class="step" points="82,167 96,145 184,145 198,167 184,189 96,189"/><text class="lbl" x="140" y="164" text-anchor="middle">An agent or</text><text class="lbl" x="140" y="179" text-anchor="middle">vendor tool?</text>
<rect class="mut p4" x="400" y="145" width="137" height="44" rx="5"/><text class="lbl" x="468.5" y="164" text-anchor="middle">housekeeping.slice</text><text class="lbl" x="468.5" y="179" text-anchor="middle">CPUs 4 and 6</text>
<polygon class="step" points="77,237 91,215 189,215 203,237 189,259 91,259"/><text class="lbl" x="140" y="234" text-anchor="middle">Interrupt or</text><text class="lbl" x="140" y="249" text-anchor="middle">softirq work?</text>
<rect class="box p6" x="400" y="215" width="205" height="44" rx="5"/><text class="lbl" x="502.5" y="234" text-anchor="middle">Housekeeping CPU, node-local</text><text class="lbl" x="502.5" y="249" text-anchor="middle">CPU 1 critical, CPU 30 bulk</text>
<rect class="box p8" x="19.5" y="285" width="241" height="44" rx="5"/><text class="lbl" x="140" y="304" text-anchor="middle">OS CPUs, left unpinned</text><text class="lbl" x="140" y="319" text-anchor="middle">logging, metrics, admin, GC helpers</text>
<text class="el" x="234" y="92" text-anchor="start">yes</text>
<text class="el" x="146" y="136" text-anchor="start">no</text>
<text class="el" x="230" y="162" text-anchor="start">yes</text>
