  .p6 { animation: p6 7s linear infinite; }
  @keyframes p6 { 0%, 58.63% { fill: #cfe3ff; stroke-width: 1.5; } 60.73% { fill: #9cc3ff; stroke-width: 3; } 68.73%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  .k7 { transform: translate(140px, 285px); animation: k7 7s linear infinite; }
  @keyframes k7 { 0% { transform: translate(140px, 49px); } 61.5% { transform: translate(140px, 49px); } 63.23% { transform: translate(140px, 75px); } 66.16% { transform: translate(140px, 119px); } 67.9% { transform: translate(140px, 145px); } 70.83% { transform: translate(140px, 189px); } 72.56% { transform: translate(140px, 215px); } 75.49% { transform: translate(140px, 259px); } 77.22% { transform: translate(140px, 285px); } 100% { transform: translate(140px, 285px); } }
  .p8 { animation: p8 7s linear infinite; }
  @keyframes p8 { 0%, 77.12% { fill: #cfe3ff; stroke-width: 1.5; } 79.22% { fill: #9cc3ff; stroke-width: 3; } 87.22%, 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .k3, .p4, .k5, .p6, .k7, .p8 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="347" rx="8"/>
<path class="wire" d="M140,49 L140,75" marker-end="url(#a)"/>
<path class="wire" d="M202,97 L400,97" marker-end="url(#a)"/>
<path class="wire" d="M140,119 L140,145" marker-end="url(#a)"/>
