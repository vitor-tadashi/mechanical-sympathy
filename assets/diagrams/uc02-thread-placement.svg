<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 347" width="760" height="347" role="img" aria-labelledby="t d">
<title id="t">One question at a time places every thread</title>
<desc id="d">Only threads on the critical path get an isolated CPU on the NIC's node, one thread per CPU. Agents and vendor tools go into housekeeping.slice on CPUs 4 and 6. Interrupt and softirq work goes to a node-local housekeeping CPU. Everything else stays unpinned on the OS CPUs.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
