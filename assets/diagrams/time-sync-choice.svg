<path class="walk" d="M120,119 L120,145" marker-end="url(#w)"/>
<path class="wire" d="M207,167 L400,167" marker-end="url(#a)"/>
<path class="walk" d="M120,189 L120,234.5" marker-end="url(#w)"/>
<path class="walk" d="M211.5,256.5 L235.5,256.5 L235.5,229.5 L400,229.5" marker-end="url(#w)"/>
<path class="wire" d="M211.5,256.5 L235.5,256.5 L235.5,276 L400,276" marker-end="url(#a)"/>
<path class="walk" d="M120,49 L120,75" marker-end="url(#w)"/>
<rect class="foc" x="56" y="20" width="128" height="29" rx="14.5"/><text class="lbl" x="120" y="39" text-anchor="middle">Which time sync?</text>
<polygon class="step p2" points="45.5,97 59.5,75 180.5,75 194.5,97 180.5,119 59.5,119"/><text class="lbl" x="120" y="94" text-anchor="middle">Need µs or better</text><text class="lbl" x="120" y="109" text-anchor="middle">across hosts?</text>
<rect class="box" x="400" y="82.5" width="99" height="29" rx="5"/><text class="lbl" x="449.5" y="101.5" text-anchor="middle">chrony (NTP)</text>
<polygon class="step p3" points="33,167 47,145 193,145 207,167 193,189 47,189"/><text class="lbl" x="120" y="164" text-anchor="middle">PTP grandmaster and</text><text class="lbl" x="120" y="179" text-anchor="middle">PTP-aware switches?</text>
<rect class="box" x="400" y="145" width="170" height="44" rx="5"/><text class="lbl" x="485" y="164" text-anchor="middle">chrony with</text><text class="lbl" x="485" y="179" text-anchor="middle">hardware timestamping</text>
<polygon class="step p4" points="28.5,256.5 42.5,234.5 197.5,234.5 211.5,256.5 197.5,278.5 42.5,278.5"/><text class="lbl" x="120" y="253.5" text-anchor="middle">Timing NIC has</text><text class="lbl" x="120" y="268.5" text-anchor="middle">hardware timestamps?</text>
<rect class="app p5" x="400" y="215" width="151" height="29" rx="5"/><text class="lbl" x="475.5" y="234" text-anchor="middle">PTP: ptp4l + phc2sys</text>
<rect class="wait" x="400" y="254" width="151" height="44" rx="5"/><text class="lbl" x="475.5" y="273" text-anchor="middle">Get a NIC that does:</text><text class="lbl" x="475.5" y="288" text-anchor="middle">ethtool -T (§4)</text>
<text class="el" x="226.5" y="92" text-anchor="start">no</text>
<text class="el" x="126" y="136" text-anchor="start">yes</text>
<text class="el" x="239" y="162" text-anchor="start">no</text>
<text class="el" x="126" y="215.75" text-anchor="start">yes</text>
<text class="el" x="243.5" y="224.5" text-anchor="start">yes</text>
<text class="el" x="243.5" y="271" text-anchor="start">no</text>
