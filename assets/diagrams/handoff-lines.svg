<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" role="img" aria-labelledby="t d">
<title id="t">One message moves at least two cache lines from producer to consumer</title>
<desc id="d">net.rx on CPU 3 writes the message into slot n and release-writes the head. event.loop on CPU 5 acquire-reads the head and reads the slot, and each read moves a cache line to CPU 5. It then release-writes the tail. The producer reads the tail only when its cached copy says the ring may be full.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .life { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 4; }
  .k1 { transform: translate(384px, 228px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(114px, 84px); } 6% { transform: translate(114px, 84px); } 19% { transform: translate(376px, 84px); } 21.8% { transform: translate(376px, 84px); } 22% { transform: translate(114px, 120px); } 35% { transform: translate(376px, 120px); } 37.8% { transform: translate(376px, 120px); } 38% { transform: translate(646px, 156px); } 51% { transform: translate(384px, 156px); } 53.8% { transform: translate(384px, 156px); } 54% { transform: translate(646px, 192px); } 67% { transform: translate(384px, 192px); } 69.8% { transform: translate(384px, 192px); } 70% { transform: translate(646px, 228px); } 83% { transform: translate(384px, 228px); } 85.8% { transform: translate(384px, 228px); } 100% { transform: translate(384px, 228px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="302" rx="8"/>
<line class="life" x1="110" y1="58" x2="110" y2="286"/>
<line class="life" x1="380" y1="58" x2="380" y2="286"/>
<line class="life" x1="650" y1="58" x2="650" y2="286"/>
<path class="wire" d="M114,84 L376,84" marker-end="url(#a)"/>
<path class="wire" d="M114,120 L376,120" marker-end="url(#a)"/>
<path class="wire" d="M646,156 L384,156" marker-end="url(#a)"/>
<path class="wire" d="M646,192 L384,192" marker-end="url(#a)"/>
<path class="wire" d="M646,228 L384,228" marker-end="url(#a)"/>
<rect class="step" x="50" y="251" width="660" height="22" rx="4"/>
<text class="sm" x="380" y="266" text-anchor="middle">The producer reads tail only when its cached copy says the ring may be full</text>
<rect class="app" x="58" y="14" width="104" height="44" rx="5"/><text class="lbl" x="110" y="33" text-anchor="middle">net.rx, CPU 3</text><text class="lbl" x="110" y="48" text-anchor="middle">(producer)</text>
<rect class="foc" x="311.5" y="14" width="137" height="29" rx="5"/><text class="lbl" x="380" y="33" text-anchor="middle">shared cache lines</text>
<rect class="app" x="585.5" y="14" width="129" height="44" rx="5"/><text class="lbl" x="650" y="33" text-anchor="middle">event.loop, CPU 5</text><text class="lbl" x="650" y="48" text-anchor="middle">(consumer)</text>
<text class="el" x="245" y="78" text-anchor="middle">write the message into slot n</text>
<text class="el" x="245" y="114" text-anchor="middle">release-write head = n</text>
<text class="el" x="515" y="150" text-anchor="middle">acquire-read head (line moves to CPU 5)</text>
<text class="el" x="515" y="186" text-anchor="middle">read slot n (line moves to CPU 5)</text>
<text class="el" x="515" y="222" text-anchor="middle">release-write tail = n</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
