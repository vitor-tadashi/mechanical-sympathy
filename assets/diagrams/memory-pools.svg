<rect class="foc" x="17.5" y="160.5" width="125" height="29" rx="14.5"/><text class="lbl" x="80" y="179.5" text-anchor="middle">Physical memory</text>
<rect class="app p2" x="235" y="18" width="190" height="44" rx="5"/><text class="lbl" x="330" y="37" text-anchor="middle">hugetlb pool</text><text class="lbl" x="330" y="52" text-anchor="middle">reserved, never reclaimed</text>
<rect class="step p4" x="235" y="83" width="190" height="44" rx="5"/><text class="lbl" x="330" y="102" text-anchor="middle">Anonymous</text><text class="lbl" x="330" y="117" text-anchor="middle">heap, stacks</text>
<rect class="step p6" x="235" y="168" width="190" height="44" rx="5"/><text class="lbl" x="330" y="187" text-anchor="middle">Page cache</text><text class="lbl" x="330" y="202" text-anchor="middle">file data, code</text>
<rect class="step p8" x="235" y="233" width="190" height="44" rx="5"/><text class="lbl" x="330" y="252" text-anchor="middle">Kernel</text><text class="lbl" x="330" y="267" text-anchor="middle">slab, page tables</text>
<rect class="step p10" x="235" y="293" width="190" height="44" rx="5"/><text class="lbl" x="330" y="312" text-anchor="middle">Free</text><text class="lbl" x="330" y="327" text-anchor="middle">above the watermarks</text>
