<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">Memory is a set of pools, and each one is taken back at a different cost</title>
<desc id="d">Physical memory is split into the hugetlb pool, anonymous memory, the page cache, kernel memory and free pages. Clean page cache can be dropped at once, dirty page cache must be written back first, anonymous memory can only go to swap if there is swap, and the hugetlb pool is never reclaimed.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
