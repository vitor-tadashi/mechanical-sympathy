<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 331" width="760" height="331" role="img" aria-labelledby="t d">
<title id="t">The first message after a pause is slow: idle driver, deep states, host class</title>
<desc id="d">Start from the slow first message. If no idle driver is active, it is not C-states. If the CPU enters deep states, bare metal needs idle=poll and the C-state caps and a VM needs the tuned PM QoS setting. If it never enters them, check the BIOS C-state settings.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(400px, 237px); animation: k1 7s linear infinite; }
  @keyframes k1 { 0% { transform: translate(140px, 49px); } 6% { transform: translate(140px, 49px); } 12% { transform: translate(140px, 49px); } 14.34% { transform: translate(140px, 75px); } 20.34% { transform: translate(140px, 75px); } 26.64% { transform: translate(140px, 145px); } 32.64% { transform: translate(140px, 145px); } 42.05% { transform: translate(140px, 249.5px); } 48.05% { transform: translate(140px, 249.5px); } 55.37% { transform: translate(220px, 264px); } 57.8% { transform: translate(220px, 237px); } 74% { transform: translate(400px, 237px); } 80% { transform: translate(400px, 237px); } 100% { transform: translate(400px, 237px); } }
  .p2 { animation: p2 7s linear infinite; }
  @keyframes p2 { 0%, 14.24% { fill: #ffffff; stroke-width: 1.5; } 16.34% { fill: #ffe9a8; stroke-width: 3; } 24.34%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p3 { animation: p3 7s linear infinite; }
  @keyframes p3 { 0%, 26.54% { fill: #ffffff; stroke-width: 1.5; } 28.64% { fill: #ffe9a8; stroke-width: 3; } 36.64%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p4 { animation: p4 7s linear infinite; }
  @keyframes p4 { 0%, 41.95% { fill: #ffffff; stroke-width: 1.5; } 44.05% { fill: #ffe9a8; stroke-width: 3; } 52.05%, 100% { fill: #ffffff; stroke-width: 1.5; } }
  .p5 { animation: p5 7s linear infinite; }
  @keyframes p5 { 0%, 73.9% { fill: #cfe3ff; stroke-width: 1.5; } 74%, 97% { fill: #9cc3ff; stroke-width: 3; } 100% { fill: #cfe3ff; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3, .p4, .p5 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="331" rx="8"/>
<path class="walk" d="M140,49 L140,75" marker-end="url(#w)"/>
<path class="wire" d="M193,97 L400,97" marker-end="url(#a)"/>
<path class="walk" d="M140,119 L140,145" marker-end="url(#w)"/>
<path class="wire" d="M196.5,167 L400,167" marker-end="url(#a)"/>
<path class="walk" d="M140,189 L140,249.5" marker-end="url(#w)"/>
<path class="walk" d="M196,264 L220,264 L220,237 L400,237" marker-end="url(#w)"/>
<path class="wire" d="M196,264 L220,264 L220,291 L400,291" marker-end="url(#a)"/>
<rect class="foc" x="15" y="20" width="250" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">First message after a pause is slow</text>
<polygon class="step p2" points="87,97 101,75 179,75 193,97 179,119 101,119"/><text class="lbl" x="140" y="94" text-anchor="middle">Idle driver</text><text class="lbl" x="140" y="109" text-anchor="middle">is none?</text>
<rect class="box" x="400" y="75" width="226" height="44" rx="5"/><text class="lbl" x="513" y="94" text-anchor="middle">Not C-states: look at coalescing</text><text class="lbl" x="513" y="109" text-anchor="middle">(use case 15) or cold caches</text>
<polygon class="step p3" points="83.5,167 97.5,145 182.5,145 196.5,167 182.5,189 97.5,189"/><text class="lbl" x="140" y="164" text-anchor="middle">Deep states</text><text class="lbl" x="140" y="179" text-anchor="middle">entered?</text>
<rect class="box" x="400" y="145" width="231" height="44" rx="5"/><text class="lbl" x="515.5" y="164" text-anchor="middle">Check the BIOS C-state settings</text><text class="lbl" x="515.5" y="179" text-anchor="middle">(Guide 00 §4.1)</text>
<polygon class="step p4" points="84,264 98,249.5 182,249.5 196,264 182,278.5 98,278.5"/><text class="lbl" x="140" y="268.5" text-anchor="middle">Bare metal?</text>
<rect class="box p5" x="400" y="215" width="211" height="44" rx="5"/><text class="lbl" x="505.5" y="234" text-anchor="middle">idle=poll and the C-state caps</text><text class="lbl" x="505.5" y="249" text-anchor="middle">(Guide 01 §5.1)</text>
<rect class="box" x="400" y="269" width="105" height="44" rx="5"/><text class="lbl" x="452.5" y="288" text-anchor="middle">tuned PM QoS</text><text class="lbl" x="452.5" y="303" text-anchor="middle">(Guide 07 §5)</text>
<text class="el" x="225" y="92" text-anchor="start">yes</text>
<text class="el" x="146" y="136" text-anchor="start">no</text>
<text class="el" x="228.5" y="162" text-anchor="start">no</text>
<text class="el" x="146" y="223.25" text-anchor="start">yes</text>
<text class="el" x="228" y="232" text-anchor="start">yes</text>
<text class="el" x="228" y="286" text-anchor="start">no</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
