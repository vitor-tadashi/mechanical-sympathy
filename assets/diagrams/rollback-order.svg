<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="t d">
<title id="t">apply-all --rollback undoes the guides in reverse run order</title>
<desc id="d">The wrapper stops and disables lowlat-runtime.service, rolls back the guides in reverse run order, 11, 08, 04, 05, 10, 12, 07, 06, 03, 02, 01 and 00, removes or restores the runtime unit, and reboots. Guide 08 comes before 04, because its driver reload would reset the NIC settings that 04 restores.</desc>
