<path class="arr" d="M26 25 H17 V129 H24" marker-end="url(#a)"/>
<rect class="app" x="20" y="414" width="16" height="16" rx="3"/>
<text class="role" x="42" y="426">isolated, one pinned thread</text>
<rect class="spare" x="218" y="414" width="16" height="16" rx="3"/>
<text class="role" x="240" y="426">isolated, spare headroom</text>
<rect class="box" x="410" y="414" width="16" height="16" rx="3"/>
<text class="role" x="432" y="426">housekeeping: OS and IRQs</text>
<rect class="mut" x="588" y="414" width="16" height="16" rx="3"/>
<text class="role" x="610" y="426">agents, cpuset fence</text>
<text class="sub" x="20" y="454">The reference host of scripts/lowlat.conf.example: 2 sockets x 16 cores, Hyper-Threading off.</text>
<text class="sub" x="20" y="472">ISOLATED_CPUS are the odd CPUs from 3 to 31. OS_CPUS is every other CPU.</text>
</svg>
