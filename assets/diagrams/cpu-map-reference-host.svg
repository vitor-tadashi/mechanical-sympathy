<text class="rl" x="595" y="141">timer</text>
<rect class="spare" x="642" y="106" width="82" height="46" rx="4"/>
<text class="num" x="683" y="125">CPU 15</text>
<text class="rl" x="683" y="141">isolated, spare</text>
<rect class="spare" x="26" y="158" width="82" height="46" rx="4"/>
<text class="num" x="67" y="177">CPU 17</text>
<text class="rl" x="67" y="193">isolated, spare</text>
<rect class="spare" x="114" y="158" width="82" height="46" rx="4"/>
<text class="num" x="155" y="177">CPU 19</text>
<text class="rl" x="155" y="193">isolated, spare</text>
<rect class="spare" x="202" y="158" width="82" height="46" rx="4"/>
<text class="num" x="243" y="177">CPU 21</text>
<text class="rl" x="243" y="193">isolated, spare</text>
<rect class="spare" x="290" y="158" width="82" height="46" rx="4"/>
<text class="num" x="331" y="177">CPU 23</text>
<text class="rl" x="331" y="193">isolated, spare</text>
<rect class="spare" x="378" y="158" width="82" height="46" rx="4"/>
<text class="num" x="419" y="177">CPU 25</text>
<text class="rl" x="419" y="193">isolated, spare</text>
<rect class="spare" x="466" y="158" width="82" height="46" rx="4"/>
<text class="num" x="507" y="177">CPU 27</text>
<text class="rl" x="507" y="193">isolated, spare</text>
<rect class="spare" x="554" y="158" width="82" height="46" rx="4"/>
<text class="num" x="595" y="177">CPU 29</text>
<text class="rl" x="595" y="193">isolated, spare</text>
<rect class="spare" x="642" y="158" width="82" height="46" rx="4"/>
<text class="num" x="683" y="177">CPU 31</text>
<text class="rl" x="683" y="193">isolated, spare</text>
<rect class="lane" x="10" y="230" width="740" height="170" rx="6"/>
<text class="cap" x="24" y="254">NUMA node 0 (even CPUs): the operating system</text>
<text class="sub" x="24" y="272">Workqueues, agents, bulk and management interrupts and non-critical threads. Nothing here is isolated.</text>
<rect class="box" x="26" y="286" width="82" height="46" rx="4"/>
<text class="num" x="67" y="305">CPU 0</text>
<text class="rl" x="67" y="321">wq, mgmt IRQ</text>
<rect class="box" x="114" y="286" width="82" height="46" rx="4"/>
<text class="num" x="155" y="305">CPU 2</text>
<text class="rl" x="155" y="321">workqueues</text>
<rect class="mut" x="202" y="286" width="82" height="46" rx="4"/>
<text class="num" x="243" y="305">CPU 4</text>
<text class="rl" x="243" y="321">agents</text>
<rect class="mut" x="290" y="286" width="82" height="46" rx="4"/>
<text class="num" x="331" y="305">CPU 6</text>
<text class="rl" x="331" y="321">agents</text>
