<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" role="img" aria-labelledby="t d">
<title id="t">The reference host: which CPU does what</title>
<desc id="d">A 32-CPU host with two NUMA nodes. Node 1 (odd CPUs) holds the critical NICs. CPU 1 is the only housekeeping CPU there and takes the critical NIC interrupts, while CPUs 3 to 13 each run one pinned thread role and CPUs 15 to 31 are isolated spares. Node 0 (even CPUs) runs the operating system: workqueues on CPUs 0 and 2, agents on CPUs 4 and 6, other threads on CPUs 8 to 28 and bulk NIC interrupts on CPU 30.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .spare { fill: #e6f7ea; stroke: #1d6b33; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .off { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .role { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .mid { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .midr { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2b0a0a; text-anchor: middle; }
  .midw { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b1f33; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: middle; }

  .num { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .rl { font: 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #333333; text-anchor: middle; }
  .arr { stroke: #1f4e8c; stroke-width: 2.5; fill: none; }
  .pcie { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
</style>
<rect class="bg" x="0" y="0" width="760" height="484" rx="8"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f4e8c"/></marker></defs>
<rect class="pcie" x="26" y="10" width="300" height="30" rx="4"/>
<text class="lbl" x="40" y="30">2 critical NICs, PCIe slots on node 1</text>
<text class="role" x="340" y="30">their interrupts land on CPU 1 only</text>
<rect class="lane" x="10" y="50" width="740" height="170" rx="6"/>
<text class="cap" x="24" y="74">NUMA node 1 (odd CPUs): critical NICs, memory and threads</text>
<text class="sub" x="24" y="92">One housekeeping CPU for interrupts, everything else isolated. Each pinned role owns its CPU.</text>
<rect class="box" x="26" y="106" width="82" height="46" rx="4"/>
<text class="num" x="67" y="125">CPU 1</text>
<text class="rl" x="67" y="141">critical IRQs</text>
<rect class="app" x="114" y="106" width="82" height="46" rx="4"/>
<text class="num" x="155" y="125">CPU 3</text>
<text class="rl" x="155" y="141">net.rx</text>
<rect class="app" x="202" y="106" width="82" height="46" rx="4"/>
<text class="num" x="243" y="125">CPU 5</text>
<text class="rl" x="243" y="141">net.tx</text>
<rect class="app" x="290" y="106" width="82" height="46" rx="4"/>
<text class="num" x="331" y="125">CPU 7</text>
<text class="rl" x="331" y="141">event.loop</text>
<rect class="app" x="378" y="106" width="82" height="46" rx="4"/>
<text class="num" x="419" y="125">CPU 9</text>
<text class="rl" x="419" y="141">worker.0</text>
<rect class="app" x="466" y="106" width="82" height="46" rx="4"/>
