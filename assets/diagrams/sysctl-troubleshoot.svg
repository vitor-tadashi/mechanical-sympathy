<rect class="bg" x="0" y="0" width="760" height="245" rx="8"/>
<path class="walk" d="M140,49 L140,136.5" marker-end="url(#w)"/>
<path class="walk" d="M177.5,151 L201.5,151 L201.5,97 L400,97" marker-end="url(#w)"/>
