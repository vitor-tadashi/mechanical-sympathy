<path class="wire" d="M177.5,151 L201.5,151 L201.5,205 L400,205" marker-end="url(#a)"/>
<rect class="foc" x="56.5" y="20" width="167" height="29" rx="14.5"/><text class="lbl" x="140" y="39" text-anchor="middle">A sysctl value is wrong</text>
<polygon class="step p2" points="102.5,151 116.5,136.5 163.5,136.5 177.5,151 163.5,165.5 116.5,165.5"/><text class="lbl" x="140" y="155.5" text-anchor="middle">When?</text>
<rect class="box p3" x="400" y="75" width="256" height="44" rx="5"/><text class="lbl" x="528" y="94" text-anchor="middle">A later file or tuned wins:</text><text class="lbl" x="528" y="109" text-anchor="middle">systemd-analyze cat-config sysctl.d</text>
<rect class="box" x="400" y="129" width="272" height="44" rx="5"/><text class="lbl" x="536" y="148" text-anchor="middle">NIC appeared late:</text><text class="lbl" x="536" y="163" text-anchor="middle">check again after boot, udev re-applies</text>
<rect class="box" x="400" y="183" width="275" height="44" rx="5"/><text class="lbl" x="537.5" y="202" text-anchor="middle">Key missing on this kernel:</text><text class="lbl" x="537.5" y="217" text-anchor="middle">sysctl --system errors, script skip list</text>
<text class="el" x="209.5" y="92" text-anchor="start">after boot</text>
<text class="el" x="209.5" y="146" text-anchor="start">only per-interface keys</text>
<text class="el" x="209.5" y="200" text-anchor="start">never applied</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
