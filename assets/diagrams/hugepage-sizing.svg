<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Size the huge page pool per node: sum every consumer, add headroom, check what is left</title>
<desc id="d">Every huge page consumer on a NUMA node is added up: the JVM heap, the code cache, bypass packet buffers and native pools. Then 10 to 20 percent headroom is added to get HUGEPAGES_PER_NODE for that node, and the node must still keep enough ordinary memory for the OS.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .grp { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.5; }
  .step { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sm { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .gl { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .el { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .done { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a5a00; }
  .sl { fill: none; stroke: #1a1a1a; stroke-width: 1; }
  .wire { fill: none; stroke: #57606a; stroke-width: 1.5; }
  .walk { fill: none; stroke: #8a5a00; stroke-width: 3; }
  .dash { stroke-dasharray: 5 4; }
  .tok { fill: #8a5a00; stroke: #1a1a1a; stroke-width: 1; }
  .tokb { fill: #1f4e8c; stroke: #0b1f33; stroke-width: 1; }
  .tokr { fill: #9b1c1c; stroke: #2b0a0a; stroke-width: 1; }
  .tokg { fill: #1d6b33; stroke: #0b2613; stroke-width: 1; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .k1 { transform: translate(390px, 275.5px); animation: k1 8s linear infinite; }
  @keyframes k1 { 0% { transform: translate(162px, 44px); } 6% { transform: translate(162px, 44px); } 7.4% { transform: translate(183px, 44px); } 12.78% { transform: translate(183px, 125px); } 14.18% { transform: translate(204px, 125px); } 16.98% { transform: translate(204px, 125px); } 17.18% { transform: translate(162px, 98px); } 18.57% { transform: translate(183px, 98px); } 20.37% { transform: translate(183px, 125px); } 21.76% { transform: translate(204px, 125px); } 24.56% { transform: translate(204px, 125px); } 24.76% { transform: translate(162px, 152px); } 26.16% { transform: translate(183px, 152px); } 27.95% { transform: translate(183px, 125px); } 29.35% { transform: translate(204px, 125px); } 32.15% { transform: translate(204px, 125px); } 32.35% { transform: translate(162px, 206px); } 33.75% { transform: translate(183px, 206px); } 39.13% { transform: translate(183px, 125px); } 40.53% { transform: translate(204px, 125px); } 43.72% { transform: translate(252px, 125px); } 47.34% { transform: translate(306.5px, 125px); } 53.39% { transform: translate(397.5px, 125px); } 58.37% { transform: translate(472.5px, 125px); } 64.37% { transform: translate(560px, 147px); } 67.89% { transform: translate(560px, 200px); } 72.3% { transform: translate(497.5px, 222px); } 79.44% { transform: translate(390px, 222px); } 83% { transform: translate(390px, 275.5px); } 85.8% { transform: translate(390px, 275.5px); } 100% { transform: translate(390px, 275.5px); } }
  .p2 { animation: p2 8s linear infinite; }
  @keyframes p2 { 0%, 70.9% { fill: #ffd166; stroke-width: 1.5; } 73% { fill: #ffb703; stroke-width: 3; } 81%, 100% { fill: #ffd166; stroke-width: 1.5; } }
  .p3 { animation: p3 8s linear infinite; }
  @keyframes p3 { 0%, 82.9% { fill: #c8f0d0; stroke-width: 1.5; } 83%, 97% { fill: #8fe0a0; stroke-width: 3; } 100% { fill: #c8f0d0; stroke-width: 1.5; } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .k1, .p2, .p3 { animation: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>
<path class="wire" d="M162,44 L183,44 L183,125 L204,125" marker-end="url(#a)"/>
<path class="wire" d="M162,98 L183,98 L183,125 L204,125" marker-end="url(#a)"/>
<path class="wire" d="M162,152 L183,152 L183,125 L204,125" marker-end="url(#a)"/>
<path class="wire" d="M162,206 L183,206 L183,125 L204,125" marker-end="url(#a)"/>
<path class="wire" d="M252,125 L306.5,125" marker-end="url(#a)"/>
<path class="wire" d="M397.5,125 L472.5,125" marker-end="url(#a)"/>
<path class="wire" d="M560,147 L560,200" marker-end="url(#a)"/>
<path class="wire" d="M497.5,222 L390,222 L390,275.5" marker-end="url(#a)"/>
<path class="wire" d="M622.5,222 L690,222 L690,268" marker-end="url(#a)"/>
<rect class="step" x="14" y="23" width="148" height="42" rx="5"/><text class="sm" x="88" y="41.5" text-anchor="middle">JVM heap</text><text class="sm" x="88" y="55.5" text-anchor="middle">(-Xmx)</text>
<rect class="step" x="14" y="77" width="148" height="42" rx="5"/><text class="sm" x="88" y="95.5" text-anchor="middle">Code cache</text><text class="sm" x="88" y="109.5" text-anchor="middle">(rounded to 2 MiB)</text>
<rect class="step" x="14" y="131" width="148" height="42" rx="5"/><text class="sm" x="88" y="149.5" text-anchor="middle">Bypass packet</text><text class="sm" x="88" y="163.5" text-anchor="middle">buffers</text>
<rect class="step" x="14" y="185" width="148" height="42" rx="5"/><text class="sm" x="88" y="203.5" text-anchor="middle">C/C++ pools,</text><text class="sm" x="88" y="217.5" text-anchor="middle">ring buffers</text>
<circle class="step" cx="228" cy="125" r="24"/><text class="lbl" x="228" y="129.5" text-anchor="middle">sum</text>
<rect class="step" x="306.5" y="103" width="91" height="44" rx="5"/><text class="lbl" x="352" y="122" text-anchor="middle">+10 to 20 %</text><text class="lbl" x="352" y="137" text-anchor="middle">headroom</text>
<rect class="foc p2" x="472.5" y="103" width="175" height="44" rx="2"/><line class="sl" x1="478.5" y1="103" x2="478.5" y2="147"/><line class="sl" x1="641.5" y1="103" x2="641.5" y2="147"/><text class="lbl" x="560" y="122" text-anchor="middle">HUGEPAGES_PER_NODE</text><text class="lbl" x="560" y="137" text-anchor="middle">for that node</text>
<polygon class="step" points="497.5,222 511.5,200 608.5,200 622.5,222 608.5,244 511.5,244"/><text class="lbl" x="560" y="219" text-anchor="middle">Node RAM left</text><text class="lbl" x="560" y="234" text-anchor="middle">for the OS?</text>
<rect class="app p3" x="347" y="275.5" width="86" height="29" rx="5"/><text class="lbl" x="390" y="294.5" text-anchor="middle">Reserve it</text>
<rect class="wait" x="628.5" y="268" width="123" height="44" rx="5"/><text class="lbl" x="690" y="287" text-anchor="middle">Shrink the heap,</text><text class="lbl" x="690" y="302" text-anchor="middle">or add RAM</text>
<text class="el" x="443.75" y="217" text-anchor="middle">enough</text>
<text class="el" x="656.25" y="217" text-anchor="middle">too little</text>
<circle class="tok k1" cx="0" cy="0" r="7"/>
</svg>
