<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" role="img" aria-labelledby="t d">
<title id="t">Where the tail comes from: rare events from every layer of the host</title>
<desc id="d">Two traces of the latency of each message handled by one busy thread, on a log scale from 1 microsecond to 1 millisecond. On a stock host most messages take about 2 microseconds, but rare events from every layer stick out above them: the scheduler tick about every millisecond, an interrupt, a page fault, a kworker, a C-state exit and an SMI, from 5 microseconds up to about half a millisecond. On a tuned host the same messages take the same 2 microseconds, and only one small residual tick remains. The numbers are illustrative.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .ax { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .key { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .tag { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; text-anchor: middle; }
  .grid { stroke: #d0d7de; stroke-dasharray: 3 3; }
  .dot { fill: #1d6b33; }
  .spk line { stroke: #9b1c1c; stroke-width: 2.5; }
  .spk circle { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 2; }
  .spk { transform-box: fill-box; transform-origin: center bottom; animation: pop 8s linear infinite; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; transform: translateX(570px); animation: sweep 8s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @keyframes pop {
    0%, 3%   { transform: scale(1.18); }
    7%, 100% { transform: scale(1); }
  }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spk, .head { animation: none; }
    .head { display: none; }
  }
</style>
