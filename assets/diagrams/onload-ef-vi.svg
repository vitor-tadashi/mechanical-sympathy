<text class="smb" x="294" y="198">packet buffers, 2 KiB each</text>
<text class="tiny" x="294" y="212">registered with the NIC for DMA</text>
<rect class="mut" x="292" y="226" width="176" height="88" rx="4"/>
<text class="smb" x="302" y="244">EF_MAX_PACKETS 32768</text>
<text class="sm" x="302" y="261">= 64 MiB per stack (2 KiB each)</text>
<text class="smb" x="302" y="281">EF_MAX_RX_PACKETS 24576</text>
<text class="sm" x="302" y="297">caps the receive share</text>
<text class="tiny" x="302" y="309">defaults: check your release</text>
<path class="arrow" d="M237 190 L279 190"/>
<text class="tiny" x="258" y="182" text-anchor="middle">DMA</text>
<rect class="lane" x="510" y="60" width="240" height="266" rx="6"/>
<text class="cap" x="524" y="82">Your process</text>
<rect class="box" x="524" y="94" width="212" height="98" rx="5"/>
<text class="smb" x="534" y="112">Onload library (LD_PRELOAD)</text>
<text class="sm" x="534" y="130">TCP and UDP in user space</text>
<text class="sm" x="534" y="146">socket buffers per socket</text>
<text class="sm" x="534" y="162">(EF_UDP_RCVBUF, EF_TCP_RCVBUF)</text>
<text class="tiny" x="534" y="180">ef_vi programs skip this box</text>
<rect class="app" x="524" y="206" width="212" height="108" rx="5"/>
<text class="smb" x="534" y="224">application thread</text>
<text class="sm" x="534" y="242">spins on the EVQ (EF_POLL_USEC)</text>
<text class="sm" x="534" y="258">no interrupt, no system call</text>
<text class="sm" x="534" y="274">while it spins</text>
<text class="tiny" x="534" y="296">recv() copies once. A zero-copy</text>
<text class="tiny" x="534" y="308">receive API exists.</text>
<path class="arrow" d="M482 190 L523 190"/>
<text class="tiny" x="502" y="182" text-anchor="middle">reads</text>
<rect class="mut" x="10" y="340" width="240" height="34" rx="5"/>
<text class="smb" x="130" y="355" text-anchor="middle">kernel network stack</text>
<text class="tiny" x="130" y="368" text-anchor="middle">the same one as without Onload</text>
<path class="arrow" d="M130 327 L130 339" stroke-dasharray="4 3"/>
