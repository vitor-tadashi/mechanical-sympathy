<rect class="box" x="420" y="140" width="17" height="17" rx="2"/>
<rect class="box" x="441" y="140" width="17" height="17" rx="2"/>
<rect class="box" x="294" y="161" width="17" height="17" rx="2"/>
<rect class="box" x="315" y="161" width="17" height="17" rx="2"/>
<rect class="box" x="336" y="161" width="17" height="17" rx="2"/>
