<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-labelledby="t d">
<title id="t">On a Solarflare NIC, a VI is three queues over packet buffers that your process owns</title>
<desc id="d">The NIC steers each flow with a hardware filter to a virtual interface. A virtual interface is a receive queue, a transmit queue and an event queue. The NIC writes packets by DMA into 2 KiB packet buffers in huge pages of host memory. The Onload library in your process, or your own ef_vi code, polls the event queue and reads the packets in place. Traffic that Onload does not accelerate still goes through the kernel driver. The default sizes are from the Onload sources and can differ by release.</desc>
