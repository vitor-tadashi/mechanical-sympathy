<rect class="bg" x="0" y="0" width="760" height="452" rx="8"/>
<text class="cap" x="24" y="28">Solarflare: a VI is three queues over packet buffers that your process owns</text>
<text class="sub" x="24" y="46">ef_vi is that layer. Onload adds a TCP/UDP stack and sockets on top of it, so unmodified programs can use it.</text>
<rect class="lane" x="10" y="60" width="240" height="266" rx="6"/>
<text class="cap" x="24" y="82">NIC</text>
<rect class="mut" x="24" y="94" width="212" height="38" rx="4"/>
<text class="smb" x="130" y="111" text-anchor="middle">hardware filters</text>
<text class="tiny" x="130" y="125" text-anchor="middle">IP and port steer each flow to a VI</text>
<rect class="app" x="24" y="144" width="212" height="84" rx="5"/>
<text class="smb" x="32" y="161">VI 1: one Onload stack</text>
<rect class="box" x="32" y="170" width="60" height="26" rx="3"/>
<text class="smb" x="62" y="187" text-anchor="middle">RXQ</text>
<rect class="box" x="98" y="170" width="60" height="26" rx="3"/>
<text class="smb" x="128" y="187" text-anchor="middle">TXQ</text>
<rect class="box" x="164" y="170" width="60" height="26" rx="3"/>
<text class="smb" x="194" y="187" text-anchor="middle">EVQ</text>
<text class="tiny" x="32" y="210">RXQ 512 by default (EF_RXQ_SIZE)</text>
<rect class="dash" x="24" y="238" width="212" height="76" rx="5"/>
<text class="smb" x="32" y="255">VI 0: the kernel sfc driver</text>
<rect class="box" x="32" y="264" width="60" height="26" rx="3"/>
<text class="smb" x="62" y="281" text-anchor="middle">RXQ</text>
<rect class="box" x="98" y="264" width="60" height="26" rx="3"/>
<text class="smb" x="128" y="281" text-anchor="middle">TXQ</text>
<rect class="box" x="164" y="264" width="60" height="26" rx="3"/>
<text class="smb" x="194" y="281" text-anchor="middle">EVQ</text>
<text class="tiny" x="32" y="306">ARP, ICMP, other sockets</text>
<rect class="lane" x="280" y="60" width="200" height="266" rx="6"/>
<text class="cap" x="294" y="82">Host memory, huge pages</text>
<rect class="box" x="294" y="98" width="17" height="17" rx="2"/>
<rect class="box" x="315" y="98" width="17" height="17" rx="2"/>
<rect class="box" x="336" y="98" width="17" height="17" rx="2"/>
