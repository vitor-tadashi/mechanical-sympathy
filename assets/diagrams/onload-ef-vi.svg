<line class="tick" x1="480" y1="392" x2="480" y2="400"/>
<text class="sm" x="252" y="412" text-anchor="middle">ef_vi: queues and buffers, which you refill and poll yourself</text>
<line class="tick" x1="280" y1="420" x2="736" y2="420"/>
<line class="tick" x1="280" y1="416" x2="280" y2="424"/>
<line class="tick" x1="736" y1="416" x2="736" y2="424"/>
<text class="sm" x="508" y="436" text-anchor="middle">Onload: ef_vi plus TCP and UDP, sockets and their limits</text>
</svg>
