<rect class="box" x="378" y="98" width="17" height="17" rx="2"/>
<rect class="box" x="399" y="98" width="17" height="17" rx="2"/>
<rect class="box" x="420" y="98" width="17" height="17" rx="2"/>
<rect class="box" x="441" y="98" width="17" height="17" rx="2"/>
<rect class="box" x="294" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="315" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="336" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="357" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="378" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="399" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="420" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="441" y="119" width="17" height="17" rx="2"/>
<rect class="box" x="294" y="140" width="17" height="17" rx="2"/>
<rect class="box" x="315" y="140" width="17" height="17" rx="2"/>
<rect class="box" x="336" y="140" width="17" height="17" rx="2"/>
<rect class="box" x="357" y="140" width="17" height="17" rx="2"/>
