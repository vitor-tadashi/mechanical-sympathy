<text class="cap" x="24" y="148">isolcpus (with systemd CPUAffinity)</text>
<text class="sub" x="24" y="166">No other task runs here any more. The tick and the RCU callbacks still do.</text>
<text class="lbl" x="24" y="209">CPU 5</text>
