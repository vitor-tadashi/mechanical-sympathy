<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">Each boot argument removes interruptions from an isolated CPU</title>
<desc id="d">Three timelines of CPU 5, which runs one busy thread. With no arguments, other tasks, the scheduler tick and RCU callbacks all interrupt it. isolcpus with systemd CPUAffinity removes the other tasks. nohz_full stops the tick, apart from about one residual tick per second, and also moves the RCU callbacks to rcuo threads on a housekeeping CPU; rcu_nocbs on the same CPUs states that explicitly. The thread then runs alone.</desc>
<style>
  .bg { fill: #ffffff; }
  .lane { fill: #f6f8fa; stroke: #d0d7de; }
  .box { fill: #cfe3ff; stroke: #1f4e8c; stroke-width: 1.5; }
  .app { fill: #c8f0d0; stroke: #1d6b33; stroke-width: 1.5; }
  .wait { fill: #ffc9c9; stroke: #9b1c1c; stroke-width: 1.5; }
  .mut { fill: #eeeeee; stroke: #777777; stroke-width: 1.5; }
  .foc { fill: #ffd166; stroke: #8a5a00; stroke-width: 2; }
  .cap { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #444444; }
  .lbl { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .mid { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; text-anchor: middle; }
  .axis { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  .note { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; text-anchor: end; }
  .head { stroke: #8a5a00; stroke-width: 2; stroke-dasharray: 4 3; }
  .tag { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9b1c1c; text-anchor: middle; }
  .tk { fill: #9b1c1c; }
  .ev, .tsk { transform-box: fill-box; transform-origin: center; animation: pop 8s linear infinite; }
  @keyframes pop { 0%, 3% { transform: scale(1.18); } 7%, 100% { transform: scale(1); } }
  .head { transform: translateX(570px); animation: sweep 8s linear infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(570px); } }
  @media (prefers-color-scheme: dark) {
    svg > * { filter: invert(0.88) hue-rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ev, .tsk, .head { animation: none; }
    .head { display: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="370" rx="8"/>
