<text class="cap" x="24" y="34">No isolation arguments</text>
<text class="sub" x="24" y="52">Other tasks get time slices, the tick fires 1000 times a second, and RCU callbacks run here.</text>
<text class="lbl" x="24" y="95">CPU 5</text>
