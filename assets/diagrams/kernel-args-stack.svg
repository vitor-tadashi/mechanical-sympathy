<text class="cap" x="24" y="262">+ nohz_full (and rcu_nocbs)</text>
<text class="sub" x="24" y="280">The tick stops, apart from one residual tick per second. RCU callbacks move to rcuo threads elsewhere.</text>
<text class="lbl" x="24" y="323">CPU 5</text>
<rect class="app" x="150" y="304" width="570" height="28" rx="4"/>
