<rect class="step" x="14.5" y="95.5" width="131" height="59" rx="5"/><text class="lbl" x="80" y="114.5" text-anchor="middle">NIC:</text><text class="lbl" x="80" y="129.5" text-anchor="middle">RSS hash of</text><text class="lbl" x="80" y="144.5" text-anchor="middle">src/dst IP + port</text>
<rect class="step" x="200" y="45.5" width="80" height="29" rx="5"/><text class="lbl" x="240" y="64.5" text-anchor="middle">queue 0</text>
<rect class="step" x="320" y="45.5" width="80" height="29" rx="5"/><text class="lbl" x="360" y="64.5" text-anchor="middle">IRQ 120</text>
