<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d">
<title id="t">RSS spreads flows over queues, and every queue interrupt here points at CPU 1</title>
<desc id="d">The NIC hashes each flow to a queue through the indirection table. Each queue has its own MSI-X interrupt, and here every interrupt points at CPU 1, so one CPU drains all the queues in turn before NAPI hands the data to the socket.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
