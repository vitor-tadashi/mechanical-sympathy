<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d">
<title id="t">Four histogram shapes and what usually causes each</title>
<desc id="d">Four latency histograms on a logarithmic latency axis. Healthy: one narrow peak and a short tail, from a quiet host and code. Bimodal: a second hump, from two paths such as memory on the wrong NUMA node or a busy SMT sibling. Comb: isolated spikes at fixed latencies, from a fixed wait such as a timer, interrupt coalescing or a polling interval. Long tail: a smooth slope over several decades, from queueing behind earlier work or rare stalls such as garbage collection or memory reclaim.</desc>
