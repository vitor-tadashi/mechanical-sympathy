name: lint

on:
  push:
    branches: [main]
  pull_request:
    # edited: the PR title and body are checked by commit-titles; nothing else reruns.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which areas does the change touch? The rules live in tools/changed-areas.
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scripts: ${{ steps.areas.outputs.scripts }}
      docs: ${{ steps.areas.outputs.docs }}
      site: ${{ steps.areas.outputs.site }}
      java: ${{ steps.areas.outputs.java }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            areas="$(tools/changed-areas --all)"
          else
            areas="$(tools/changed-areas "${BASE_SHA}")"
          fi
          printf 'Areas: %s\n' "$(tr '\n' ' ' <<<"${areas}")"
          for area in scripts docs site java integration doc-health; do
            if grep -qx "${area}" <<<"${areas}"; then
              echo "${area}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${area}=false" >> "${GITHUB_OUTPUT}"
            fi
          done

  commit-titles:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR title (becomes the squash commit title)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: tools/check-commit-title "${PR_TITLE}"
      - name: Commit titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/check-commit-title --range "${BASE_SHA}..${HEAD_SHA}"
      - name: PR description (becomes the squash commit body)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "${PR_BODY}" | tools/check-description
      - name: Commit descriptions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "${sha}" | tools/check-description
          done

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install ShellCheck (pinned; distro packages lag behind)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
      - run: make lint-scripts

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install mermaid-cli (pinned; the 11.x line matches the Mermaid that GitHub renders)
        env:
          MERMAID_CLI_VERSION: 11.17.0
        run: npm install --global "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"
      - run: make lint-docs

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: make lint-site

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: make lint-java

  # The one check to require: skipped jobs pass, failed or cancelled ones do not.
  lint-ok:
    if: always()
    needs: [changes, commit-titles, scripts, docs, site, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* ]]
