name: kvm-spike

# A spike, not a gate: can the standard hosted runner boot a Rocky Linux 9 cloud image
# under KVM, and how long does it take? The TCG job runs only when KVM is not usable, to
# give the fallback timing. See tools/check-kvm.

on:
  pull_request:
    paths:
      - .github/workflows/kvm-spike.yml
      - tools/check-kvm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      kvm: ${{ steps.probe.outputs.kvm }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable the KVM device for every user (udev rule)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe /dev/kvm
        id: probe
        run: |
          ls -l /dev/kvm || true
          lscpu | grep -i -E 'model name|virtualization|hypervisor|^CPU\(s\)' || true
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm=true" >> "${GITHUB_OUTPUT}"
          else
            echo "kvm=false" >> "${GITHUB_OUTPUT}"
            echo "### /dev/kvm is not usable on this runner" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Install QEMU and cloud-image-utils
        if: steps.probe.outputs.kvm == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot Rocky Linux 9 under KVM
        if: steps.probe.outputs.kvm == 'true'
        run: tools/check-kvm --accel kvm --work "${RUNNER_TEMP}/kvm"
      - name: Upload the serial console log
        if: always() && steps.probe.outputs.kvm == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: serial-kvm
          path: ${{ runner.temp }}/kvm/serial.log
          if-no-files-found: ignore

  tcg:
    needs: kvm
    if: needs.kvm.outputs.kvm != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and cloud-image-utils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot Rocky Linux 9 under TCG
        run: tools/check-kvm --accel tcg --timeout 4800 --work "${RUNNER_TEMP}/tcg"
      - name: Upload the serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-tcg
          path: ${{ runner.temp }}/tcg/serial.log
          if-no-files-found: ignore
