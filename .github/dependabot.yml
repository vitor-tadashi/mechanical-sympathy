# Merging this file into main enables version-update pull requests.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gradle
    directory: /examples/java-latency-probe
    schedule:
      interval: weekly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: build
      include: scope
